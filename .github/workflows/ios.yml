# iOS uygulamasını bulutta (GitHub'ın macOS makinesinde) derler.
# İmza gerektirmez: simülatör için derler, simülatörde açar ve ekran görüntüsü alır.
# Görüntüler çalışmanın "Artifacts" bölümünden indirilebilir.
name: iOS derleme

on:
  push:
    paths:
      - "starboard-site/**"
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  # Ekran görüntülerini ci-ekran-goruntuleri dalına yazabilmek için.
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    # Apple Silicon (macos-latest) makinelerinde kapasite sıkıntısı var; Intel daha hızlı atanıyor.
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Paketleri kur
        run: npm ci

      - name: Web dosyalarini iOS projesine kopyala
        run: npx cap sync ios

      - name: Xcode surumu
        run: xcodebuild -version

      # Bu dosyalar Mac olmadan elle düzenleniyor; bozuksa derlemeden önce açıkça hata versin.
      - name: Proje ve plist dosyalarini denetle
        run: |
          plutil -lint \
            ios/App/App.xcodeproj/project.pbxproj \
            ios/App/App/Info.plist \
            ios/App/App/App.entitlements \
            ios/App/App/PrivacyInfo.xcprivacy \
            ios/App/App/en.lproj/InfoPlist.strings \
            ios/App/App/tr.lproj/InfoPlist.strings
          xcodebuild -list -project ios/App/App.xcodeproj

      - name: Simulator icin derle (imzasiz)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 40
          test -d build/Build/Products/Debug-iphonesimulator/App.app

      - name: Izin metinleri ve gizlilik bildirimi uygulamada mi
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          test -f "$APP/PrivacyInfo.xcprivacy"
          for L in en tr; do
            test -f "$APP/$L.lproj/InfoPlist.strings"
            plutil -p "$APP/$L.lproj/InfoPlist.strings"
          done
          for K in NSCameraUsageDescription NSHealthShareUsageDescription NSHealthUpdateUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$K" "$APP/Info.plist"
            plutil -extract "$K" raw "$APP/tr.lproj/InfoPlist.strings" >/dev/null
          done

      - name: Simulatorde ac ve ekran goruntusu al
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt in sorted(d, reverse=True):
              if 'iOS' in rt:
                  for dev in d[rt]:
                      if dev['name'].startswith('iPhone'):
                          print(dev['udid']); sys.exit()
          ")
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" app.starboard.health
          sleep 20
          mkdir -p shots
          xcrun simctl io "$DEVICE" screenshot shots/acilis.png
          # Uygulamayi kapatip yeniden ac: kalici depo ve ikinci acilis
          xcrun simctl terminate "$DEVICE" app.starboard.health
          xcrun simctl launch "$DEVICE" app.starboard.health
          sleep 12
          xcrun simctl io "$DEVICE" screenshot shots/ikinci-acilis.png

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-ekran-goruntuleri
          path: shots/

      # Görüntüler ayrı bir dala da yazılır: GitHub, Artifacts'i yalnızca oturum açanlara
      # indirtiyor; daldaki dosyalar ise herkese açık adresten görülebilir:
      # https://raw.githubusercontent.com/efekaratosun/starboard/ci-ekran-goruntuleri/latest/acilis.png
      - name: Ekran goruntulerini dala yaz
        if: github.ref == 'refs/heads/main'
        run: |
          SHA="${GITHUB_SHA::7}"
          mkdir -p /tmp/shots && cp shots/*.png /tmp/shots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-ekran-goruntuleri || true
          if git rev-parse --verify origin/ci-ekran-goruntuleri >/dev/null 2>&1; then
            git checkout -B ci-ekran-goruntuleri origin/ci-ekran-goruntuleri
          else
            git checkout --orphan ci-ekran-goruntuleri
            git rm -rf . >/dev/null
          fi
          mkdir -p "$SHA" latest
          cp /tmp/shots/*.png "$SHA"/
          cp /tmp/shots/*.png latest/
          git add "$SHA" latest
          git commit -m "iOS ekran goruntuleri $SHA"
          git push origin ci-ekran-goruntuleri
