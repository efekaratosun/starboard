# Her gönderimde testleri çalıştırır; main dalında testler geçerse
# starboard-site klasörünü GitHub Pages'e yayınlar.
name: Test ve yayin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testleri tarayicida calistir
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=30000 --dump-dom http://localhost:8000/tests/ > result.html
          sed -n '/<pre id="out">/,/<\/pre>/p' result.html | sed 's/<[^>]*>//g'
          grep -q 'data-result="pass"' result.html

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Onbellek surumunu damgala
        run: sed -i "s/starboard-[0-9]\{12\}/starboard-$(date +%Y%m%d%H%M)/" starboard-site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: starboard-site
      - id: deployment
        uses: actions/deploy-pages@v4
