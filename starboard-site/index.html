        <div class="qs-h">${iconBox("grain")}<div><b>Kalori</b>
          <i>${logged ? `günlükteki ${e.log.length} kalemden ${e.kcal || 0} kcal`
              : `${e.kcal || 0}${program ? ` / ${program.kcal}` : ""} kcal`}</i></div></div>

      ${session && session.b ? `<div class="qs-row">

      <div class="qs-row">

      if (n === null || n < 0) delete e.steps; else e.steps = Math.round(n);

    const addT = async () => {
      const title = ti.value.trim();
      if (!title) return;
      e.tasks.push({ id: Date.now() + Math.random(), title, done:false, suggested:false });
      ti.value = ""; await commit();
      el.querySelector("#qs-t").focus();

    const gm = el.querySelector("#qs-meals");
    if (gm) gm.onclick = () => { close(); tab = "meals"; mealTab = "log"; render(); window.scrollTo(0,0); };
    const gt = el.querySelector("#qs-train");
    if (gt) gt.onclick = () => { close(); goToTask("train", k); };
  };

  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="qs-t-h">

      ? `${prettyDate(k)} gününe yazılıyor.` : "Bugüne yazılıyor."}</div>
    <div id="qs-b"></div>
  </div>`;
  document.body.appendChild(el);

/* ---- kendi programını yaz ----
   Gün gün hareket, set ve tekrar. Kaydedilince hazır programlarla aynı yoldan
   görevlere, antrenman kaydına ve antrenman moduna girer. */
function openProgramEditor(){
  const p = state.profile;
  const draft = JSON.parse(JSON.stringify((p.custom && p.custom.days) || {}));
  let sel = isoWeekday(today());
  const el = document.createElement("div");
  el.className = "sheet-bg";
  function escK(ev){ if (ev.key === "Escape") close(); }
  const close = () => { sheetOut(el); document.removeEventListener("keydown", escK); };
  const day = () => (draft[sel] = draft[sel] || { t:"", ex:[] });
  const filled = n => !!(draft[n] && draft[n].ex && draft[n].ex.some(x => (x.n || "").trim()));

  const draw = focusLast => {
    const d = day();
    el.querySelector("#pe-b").innerHTML = `
      <div class="pe-days" role="group" aria-label="Gün seç">${[1,2,3,4,5,6,7].map(n =>
        `<button class="chip${n === sel ? " sel" : ""}${filled(n) ? " has" : ""}" data-pe-day="${n}"
           aria-pressed="${n === sel}" aria-label="${WD_NAMES[n]}${filled(n) ? ", hareket var" : ""}">${WD_SHORT[n]}</button>`).join("")}</div>
      <div class="field"><label for="pe-t">${WD_NAMES[sel]} antrenmanının adı</label>
        <input id="pe-t" type="text" value="${esc(d.t || "")}" placeholder="örn. Göğüs ve kol" maxlength="40"></div>
      ${d.ex.length ? `<div class="pe-head" aria-hidden="true"><span>Hareket</span><span>Set</span><span>Tekrar</span><span></span></div>`
        : `<div class="empty" style="margin:6px 0 4px">Hareket eklemezsen ${WD_NAMES[sel]} dinlenme günü sayılır.</div>`}
      ${d.ex.map((x, i) => `<div class="pe-x">
        <input data-pe-n="${i}" type="text" value="${esc(x.n || "")}" placeholder="Hareket" aria-label="Hareket adı" maxlength="40">
        <input data-pe-s="${i}" type="text" inputmode="numeric" value="${esc(x.s ?? "")}" aria-label="Set sayısı">
        <input data-pe-r="${i}" type="text" inputmode="numeric" value="${esc(x.r ?? "")}" aria-label="Tekrar sayısı">
        <button class="del" data-pe-del="${i}" aria-label="Hareketi sil">×</button></div>`).join("")}
      <button class="ghost" id="pe-add" style="margin-top:10px">＋ Hareket ekle</button>`;

    el.querySelectorAll("[data-pe-day]").forEach(b => b.onclick = () => { sel = +b.dataset.peDay; draw(); });
    el.querySelector("#pe-t").oninput = ev => { d.t = ev.target.value; };
    const dots = () => el.querySelectorAll("[data-pe-day]").forEach(b => b.classList.toggle("has", filled(+b.dataset.peDay)));
    el.querySelectorAll("[data-pe-n]").forEach(i => i.oninput = () => { d.ex[+i.dataset.peN].n = i.value; dots(); });
    el.querySelectorAll("[data-pe-s]").forEach(i => i.oninput = () => { d.ex[+i.dataset.peS].s = i.value; });
    el.querySelectorAll("[data-pe-r]").forEach(i => i.oninput = () => { d.ex[+i.dataset.peR].r = i.value; });
    el.querySelectorAll("[data-pe-del]").forEach(b => b.onclick = () => { d.ex.splice(+b.dataset.peDel, 1); draw(); });
    el.querySelector("#pe-add").onclick = () => {
      if (d.ex.length >= 14){ toast("Bir güne en fazla 14 hareket ekleyebilirsin."); return; }
      d.ex.push({ n:"", s:3, r:"10" }); draw(true);
    };
    if (focusLast){ const all = el.querySelectorAll("[data-pe-n]"); if (all.length) all[all.length - 1].focus(); }
  };

  const clean = () => {
    const out = {};
    for (let n = 1; n <= 7; n++){
      const d = draft[n];
      if (!d) continue;
      const seen = new Set(), ex = [];
      for (const x of (d.ex || [])){
        const name = String(x.n || "").replace(/[·×]/g, " ").replace(/\s+/g, " ").trim();
        if (!name) continue;
        const s = clamp(Math.round(num(x.s) || 3), 1, 12);
        let r = String(x.r ?? "").toLowerCase().replace(/\s/g, "").replace(/[–—]/g, "-");
        if (!/^(max|\d{1,3}(-\d{1,3})?)$/.test(r)) r = "10";
        const id = `${name} ${s}×${r}`;
        if (seen.has(id)) continue;
        seen.add(id); ex.push({ n:name, s, r });
      }
      if (ex.length) out[n] = { t: String(d.t || "").replace(/\s+/g, " ").trim().slice(0, 40), ex };
    }
    return out;
  };

  el.innerHTML = `<div class="sheet pe" role="dialog" aria-modal="true" aria-labelledby="pe-h">
    <div class="sheet-h"><b id="pe-h">Kendi programın</b>
      <button class="sheet-x" aria-label="Kapat">×</button></div>
    <div class="metric-note" style="margin:-2px 0 14px">Günü seç, hareketlerini yaz. Boş bıraktığın günler dinlenme olur.</div>
    <div id="pe-b"></div>
    <div class="row pe-foot">
      <button id="pe-ok">Kaydet ve kullan</button>
      <button class="ghost" id="pe-no" style="flex:0 0 104px">Vazgeç</button>
    </div>
  </div>`;
  document.body.appendChild(el);
  draw();
  el.querySelector(".sheet-x").onclick = close;
  el.querySelector("#pe-no").onclick = close;
  el.querySelector("#pe-ok").onclick = async () => {
    const days = clean();
    if (!Object.keys(days).length){ toast("En az bir güne hareket ekle."); return; }
    p.custom = { days };
    p.programId = "custom";
    delete p.noPlan;
    close();
    await saveState(state); render();
    toast(`Programın kaydedildi: haftada ${Object.keys(days).length} gün.`);
  };
  document.addEventListener("keydown", escK);
}

/* ---- hareket: sayaçlar ve parıltı ----
   render() sayfayı baştan yazdığı için eski değer DOM'da kalmıyor; sayaçlar
   son gördükleri değeri burada tutuyor ve yeni değere doğru sayıyorlar. */
const reduceMotion = () =>
  !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

const _counted = new Map();
function animateCounts(){
  app.querySelectorAll("[data-count]").forEach(el => {
    const key = el.dataset.count;
    const to = parseFloat(el.dataset.v);
    if (!isFinite(to)) { _counted.delete(key); return; }
    const had = _counted.has(key);
    const from = had ? _counted.get(key) : to;
    _counted.set(key, to);
    if (!had || from === to || reduceMotion()) return;
    const dec = +(el.dataset.dec || 0), t0 = performance.now(), dur = 620;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmtN(+(from + (to - from) * e).toFixed(dec));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

/* Ödül anı: işaretlenen yıldızdan kısa bir parıltı dağılır. */
function sparkle(el){
  if (!el || reduceMotion()) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 8; i++){
    const a = (Math.PI * 2 * i) / 8 + Math.random() * 0.5;
    const d = 26 + Math.random() * 22;
    const s = document.createElement("i");
    s.className = "spark";
    s.style.cssText = `left:${cx - 3.5}px;top:${cy - 3.5}px;` +
      `--dx:${(Math.cos(a) * d).toFixed(1)}px;--dy:${(Math.sin(a) * d).toFixed(1)}px;` +
      `animation-delay:${(Math.random() * 90).toFixed(0)}ms`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}

/* ---- bento özeti ----
   Günün dört ölçüsü tek bakışta: kalori, su, uyku ve seri. Kalori kutusu
   dolu renk taşır — günün asıl sorusu o. Her kutu kendi girişine götürür,
   yani özet aynı zamanda kısayol. Altındaki uzun kartlar detayda kalır. */
function bentoRow(entry, program, key){
  const now = key === today();
  const tasks = entry.tasks || [];
  const done = tasks.filter(t => t.done).length, all = tasks.length;

  const left = (program && typeof entry.kcal === "number") ? program.kcal - entry.kcal : null;
  const kNum = left === null ? (program ? program.kcal : null) : Math.abs(left);
  const kLbl = left === null ? "günlük hedef" : left >= 0 ? "kcal kaldı" : "kcal aşıldı";
  const kFill = (program && typeof entry.kcal === "number") ? entry.kcal / program.kcal : 0;

  const wv = entry.water || 0, wg = program ? program.water : 0;
  const sv = typeof entry.sleep === "number" ? entry.sleep : null;
  const [slo, shi] = sleepBand();
  const streak = streakNow();

  const val = (id, v, dec) => `<span data-count="${id}" data-v="${v === null ? "" : v}" data-dec="${dec || 0}">${
    v === null ? "—" : fmtN(v)}</span>`;

  const tile = (go, c, ic, name, v, dec, unit, sub, fill) => `
    <button class="bt" data-btgo="${go}" style="--c:var(${c})">
      <span class="bt-h">${icon(ic, "bt-ic")}<span class="bt-nm">${name}</span></span>
      <span class="bt-v num">${val(go, v, dec)}<small>${unit}</small></span>
      <span class="bt-sub">${sub}</span>
      <span class="bt-bar"><s style="width:${clamp(fill * 100, 0, 100).toFixed(0)}%"></s></span>
    </button>`;

  return `<div class="bento">
    <button class="bt bt-kcal dust" data-btgo="kcal">
      <span class="bt-h">${icon("grain", "bt-ic")}<span class="bt-nm">Kalori</span></span>
      <span class="bt-v num">${val("kcal", kNum)}</span>
      <span class="bt-sub">${kLbl}</span>
      <span class="bt-bar"><s style="width:${clamp(kFill * 100, 0, 100).toFixed(0)}%"></s></span>
    </button>

    ${tile("water", "--water", "dairy", "Su", wv, 0, " ml", wg ? `hedef ${fmtN(wg)} ml` : "hedef yok", wg ? wv / wg : 0)}
    ${tile("sleep", "--sleep", "rest", "Uyku", sv === null ? null : +sv.toFixed(1), 1, " sa",
        `hedef ${slo}-${shi} sa`, sv === null ? 0 : sv / slo)}
    ${tile("streak", "--star-tile", "star4", "Seri", streak, 0, " gün",
        `${done}/${all} görev bitti`, streak / 7)}
  </div>`;
}

function wireBento(key){
  app.querySelectorAll("[data-btgo]").forEach(b => b.onclick = () => {
    const g = b.dataset.btgo;
    if (g === "streak"){ tab = "calendar"; calTab = "cal"; render(); window.scrollTo(0,0); return; }
    goToTask(g === "water" ? "water" : g === "sleep" ? "sleep" : "kcal", key);
  });
}

/* ---- açılır / kapanır bölümler ---- */
const FOLD_DEFAULT = { body:false, eval:false, review:false, sugg:false, micro:false, lifts:false };
function isOpen(key){
  const f = state.ui && state.ui.fold;
  return f && key in f ? f[key] : (FOLD_DEFAULT[key] ?? true);
}
function fold(key, title, count, body){
  const open = isOpen(key);
  return `<section class="fold${open ? "" : " shut"}">
    <button class="fold-h" data-fold="${key}" aria-expanded="${open}">
      <span class="fold-t">${title}</span>${count ? `<span class="count">${count}</span>` : `<span class="count"></span>`}
      <svg class="ico fold-c" aria-hidden="true"><use href="#i-next"/></svg>
    </button>
    <div class="fold-b"><div class="fold-i">${body}</div></div>
  </section>`;
}
function wireFolds(){
  app.querySelectorAll("[data-fold]").forEach(b => b.onclick = async () => {
    const key = b.dataset.fold, open = !isOpen(key);
    state.ui = state.ui || {};
    state.ui.fold = state.ui.fold || {};
    state.ui.fold[key] = open;
    b.closest(".fold").classList.toggle("shut", !open);
    b.setAttribute("aria-expanded", open);
    await saveState(state);
  });
}

const GUIDE_BY_ID = Object.fromEntries(GUIDE.map(g => [g.id, g]));

/* Bir hareket metninin rehber kayıtları (devrelerde birden fazla). */
function guidesFor(str){
  const l = str.toLocaleLowerCase("tr");
  const one = t => { const g = GUIDE.find(x => x.r.test(t)); return g ? g.id : null; };
  const m = l.match(/^\d+ tur:\s*(.*)$/);
  if (m){
    const ids = m[1].split(/ · |\s\+\s|, /).map(one).filter(Boolean);
    return [...new Set(ids)];
  }
  const id = one(l);
  return id ? [id] : [];
}

let planTab = "log", howOpen = null, howQuery = "";

/* ---- antrenman modu ----
   Tek hareket tam ekran. Her set son antrenmanın değeriyle hazır gelir;
   ✓ onaylar, ± düzeltir. Klavye sadece istersen açılır. */
let woIdx = 0, woEl = null, woDone = false;

const tgNum = tg => { const m = String(tg ?? "").match(/\d+/); return m ? +m[0] : null; };
const woStep = (f, v) => f === "kg" ? 2.5 : f === "km" ? 0.5 : f === "min" ? 5 : f === "m" ? 25 : 1;
const woRound = (f, v) => f === "kg" || f === "km" || f === "min" ? Math.round(v * 100) / 100 : Math.round(v);

function woList(){
  const p = currentProgram();
  const ses = p ? p.training.days.find(d => d.wd === isoWeekday(vKey())) : null;
  return { ses, list: exercisesOf(ses), venue: venueOf(p) };
}

/* Bugünün kaydı; yoksa açılır. */
function woRec(name, t){
  const e = ensureDay(vKey());
  e.lifts = e.lifts || {};
  let r = e.lifts[name];
  if (!r || !r.t) r = e.lifts[name] = {};
  r.t = t;
  return r;
}
function woTidy(name){
  const e = state.days[vKey()] || {};
  if (e.lifts && !liftHas(e.lifts[name])) delete e.lifts[name];
}

/* Bir alanın önerilen değeri: bugün girilen > bugünkü önceki set > geçen antrenman > programdaki hedef. */
function woSug(ex, rec, prev, k){
  const S = rec.sets || [], P = (prev && prev.sets) || [];
  if (ex.t === "w"){
    const s = S[k] || {}, p = P[k] || {};
    const back = (k > 0 && S[k-1] && S[k-1].kg) || null;
    return { kg: s.kg ?? back ?? p.kg ?? (prev && prev.kg) ?? null,
             r:  s.r  ?? p.r  ?? tgNum(ex.tg) };
  }
  const own = typeof S[k] === "number" ? S[k] : null;
  const back = k > 0 && typeof S[k-1] === "number" ? S[k-1] : null;
  const p = typeof P[k] === "number" ? P[k] : null;
  return { v: own ?? back ?? p ?? tgNum(ex.tg) };
}
const woSetDone = (ex, rec, k) => ex.t === "w"
  ? !!(rec.sets && rec.sets[k] && rec.sets[k].r)
  : !!(rec.sets && typeof rec.sets[k] === "number");

/* ---- parçalar ---- */
function woField(f, v, label, k){
  return `<div class="wo-f">
    <button class="wo-pm" data-wpm="${f}" data-wk="${k}" data-wd="-1" aria-label="${label} azalt" tabindex="-1">−</button>
    <label class="wo-v"><input type="text" inputmode="decimal" enterkeyhint="done" data-wi="${f}" data-wk="${k}"
      value="${v === null || v === undefined ? "" : fmtN(v)}" aria-label="${label}"><span>${label}</span></label>
    <button class="wo-pm" data-wpm="${f}" data-wk="${k}" data-wd="1" aria-label="${label} artır" tabindex="-1">+</button>
  </div>`;
}
const woTick = `<svg aria-hidden="true"><use href="#i-check"/></svg>`;
function woSetRow(ex, rec, prev, k){
  const on = woSetDone(ex, rec, k), s = woSug(ex, rec, prev, k);
  const fields = ex.t === "w"
    ? woField("kg", s.kg, "kg", k) + woField("r", s.r, "tekrar", k)
    : woField("s", s.v, ex.t === "t" ? "saniye" : "tekrar", k);
  return `<div class="wo-set${on ? " on" : ""}">
    <span class="wo-no">${k+1}</span>
    <div class="wo-fields">${fields}</div>
    <button class="wo-ok" data-wok="${k}" aria-pressed="${on}" aria-label="${k+1}. seti ${on ? "geri al" : "tamamlandı olarak işaretle"}">${woTick}</button>
  </div>`;
}
function woChips(cur, max, unit){
  return `<div class="wo-chips" role="group" aria-label="Tamamlanan ${unit}">${Array.from({ length:max }, (_, i) =>
    `<button class="wo-chip${i < cur ? " on" : ""}" data-wc="${i+1}" aria-pressed="${i < cur}"
      aria-label="${i+1}. ${unit}">${i+1}</button>`).join("")}</div>
    <div class="wo-note">${cur}/${max} ${unit} tamam. Kaçıncı ${unit} bittiyse ona dokun; aynısına tekrar dokunursan geri alır.</div>`;
}

function woBody(ex, name, rec, prev){
  switch (ex.t){
    case "w": case "r": case "t": {
      const n = ex.n || 1;
      const all = Array.from({ length:n }, (_, k) => woSetDone(ex, rec, k)).every(Boolean);
      const canCopy = !all && (prev || (ex.t !== "w" && tgNum(ex.tg) !== null));
      return `${canCopy ? `<button class="ghost wo-copy" id="wo-copy">${prev ? "Hepsi geçen seferki gibi" : "Hepsini hedefe göre doldur"}</button>` : ""}
        <div class="wo-sets">${Array.from({ length:n }, (_, k) => woSetRow(ex, rec, prev, k)).join("")}</div>
        <div class="wo-note">Değerler ${prev ? "geçen antrenmandan" : "programdaki hedeften"} geliyor. Aynıysa ✓'e bas, farklıysa − / + ile düzelt ya da sayıya dokunup yaz.</div>`;
    }
    case "wc": {
      const s = { kg: rec.kg ?? (prev && prev.kg) ?? null };
      return `<div class="wo-fields" style="margin-bottom:14px">${woField("kg", s.kg, "kg", "")}</div>
        ${woChips(rec.n || 0, ex.n, ex.unit || "set")}`;
    }
    case "n": return woChips(rec.n || 0, ex.n, ex.unit || "tur");
    case "sw": return `${woChips(rec.n || 0, ex.n, "tekrar")}
      <div class="wo-fields" style="margin-top:14px">${woField("min", rec.min ?? (prev && prev.min) ?? null, "dakika", "")}</div>`;
    case "sd": return `<div class="wo-fields">${woField("m", rec.m ?? ex.d ?? null, "metre", "")}${woField("min", rec.min ?? (prev && prev.min) ?? null, "dakika", "")}</div>
      <div class="wo-note">Değerleri girdiğinde kaydedilir.</div>`;
    case "c": {
      const min = rec.min ?? tgNum(ex.tg), km = rec.km ?? (prev && prev.km) ?? null;
      return `<div class="wo-fields">${woField("min", min, "dakika", "")}${ex.km ? woField("km", km, "km", "") : ""}</div>
        ${rec.min && rec.km ? `<div class="wo-note">Tempo: <b>${pace(rec.min, rec.km)}</b></div>`
          : `<div class="wo-note">Değerleri girdiğinde kaydedilir.</div>`}`;
    }
    default:
      return `<button class="wo-big${rec.ok ? " on" : ""}" id="wo-ok1" aria-pressed="${rec.ok ? "true" : "false"}">${woTick}${rec.ok ? "Yapıldı" : "Yaptım"}</button>`;
  }
}

/* ---- ekran ---- */
function woScreen(){
  const { list, venue } = woList();
  const lifts = (state.days[vKey()] || {}).lifts || {};
  const nDone = list.filter(n => liftHas(lifts[n])).length;

  if (woDone || woIdx >= list.length){
    return `<div class="wo-top"><button class="wo-x" id="wo-x" aria-label="Kapat">×</button>
      <span class="wo-count">ÖZET</span><span style="flex:0 0 38px"></span></div>
    <div class="wo-main">
      <div class="wo-done"><b>${nDone === list.length ? "Antrenman tamam 💪" : "Kaydedildi"}</b>
        <span>${nDone}/${list.length} hareket kaydettin.${nDone < list.length ? " Eksikleri sonra da girebilirsin." : ""}</span></div>
      <section style="margin-top:16px">${list.map(name => {
        const ex = parseEx(name, venue), rec = lifts[name];
        const has = liftHas(rec), sum = has ? liftSummary(rec, ex) : "";
        return `<div class="wo-sum${has ? "" : " skip"}">
          <svg class="ico" aria-hidden="true"><use href="#i-${has ? "check" : "cross"}"/></svg>
          <div class="m"><h3>${esc(ex.name)}</h3><p>${has ? esc(sum || "yapıldı") : "girilmedi"}</p></div>
        </div>`;
      }).join("")}</section>
    </div>
    <div class="wo-nav"><div>
      <button class="ghost wo-prev" id="wo-back">Geri</button>
      <button id="wo-finish">Bitir</button>
    </div></div>`;
  }

  const name = list[woIdx], ex = parseEx(name, venue);
  const rec = (lifts[name] && lifts[name].t === ex.t) ? lifts[name] : (lifts[name] || {});
  const prev = lastLift(name, vKey());
  const ps = prev ? liftSummary(prev, ex) : "";
  const ids = guidesFor(name);

  return `<div class="wo-top">
      <button class="wo-x" id="wo-x" aria-label="Antrenman modunu kapat">×</button>
      <span class="wo-count">HAREKET ${woIdx+1} / ${list.length}</span>
      <span style="flex:0 0 38px"></span>
    </div>
    <div class="wo-dots" aria-hidden="true">${list.map((n, i) =>
      `<i class="${i === woIdx ? "cur" : liftHas(lifts[n]) ? "on" : ""}"></i>`).join("")}</div>
    <div class="wo-main">
      <div class="wo-h">${esc(ex.name)}</div>
      <div class="wo-s">${esc(ex.sub || "")}${ex.sub && LIFT_KIND[ex.t] ? " · " : ""}${LIFT_KIND[ex.t] || ""}</div>
      <div class="wo-last">${ps ? `Geçen sefer: <b>${esc(ps)}</b> · ${prettyDate(prev.k)}` : "Bu hareketi ilk kez kaydediyorsun."}
        ${ids.length ? `<button class="how-link" data-wohow="${ids[0]}">Nasıl yapılır</button>` : ""}</div>
      ${woBody(ex, name, rec, prev)}
    </div>
    <div class="wo-nav"><div>
      <button class="ghost wo-prev" id="wo-back"${woIdx ? "" : " disabled"}>Geri</button>
      <button id="wo-next">${woIdx === list.length - 1 ? "Bitir" : "Sonraki hareket"}</button>
    </div></div>`;
}

function drawWO(){
  if (!woEl) return;
  woEl.innerHTML = woScreen();
  wireWO();
  woEl.querySelector(".wo-main").scrollTop = 0;
}

function openWorkout(){
  const { list } = woList();
  if (!list.length) return;
  const lifts = (state.days[vKey()] || {}).lifts || {};
  const first = list.findIndex(n => !liftHas(lifts[n]));
  woIdx = first < 0 ? 0 : first;
  woDone = false;
  woEl = document.createElement("div");
  woEl.className = "wo";
  woEl.setAttribute("role", "dialog");
  woEl.setAttribute("aria-modal", "true");
  woEl.setAttribute("aria-label", "Antrenman modu");
  document.body.appendChild(woEl);
  document.body.style.overflow = "hidden";
  drawWO();
}
function closeWorkout(){
  if (!woEl) return;
  woEl.remove(); woEl = null;
  document.body.style.overflow = "";
  render();
}

function wireWO(){
  const { list, venue } = woList();
  const q = s => woEl.querySelectorAll(s);
  const el = i => woEl.querySelector(i);
  const save = async () => { await saveState(state); };

  el("#wo-x").onclick = closeWorkout;
  const back = el("#wo-back");
  if (back && !back.disabled) back.onclick = () => {
    if (woDone){ woDone = false; woIdx = list.length - 1; } else woIdx--;
    drawWO();
  };
  const fin = el("#wo-finish");
  if (fin) fin.onclick = closeWorkout;
  const next = el("#wo-next");
  if (next) next.onclick = () => {
    if (woIdx === list.length - 1) woDone = true; else woIdx++;
    drawWO();
  };
  q("[data-wohow]").forEach(b => b.onclick = () => {
    const id = b.dataset.wohow;
    closeWorkout();
    tab = "plan"; planTab = "howto"; howQuery = ""; howOpen = id;
    render();
    const t = app.querySelector(`[data-how="${id}"]`);
    if (t) t.scrollIntoView({ block:"center" }); else window.scrollTo(0,0);
  });

  if (woDone || woIdx >= list.length) return;

  const name = list[woIdx], ex = parseEx(name, venue), prev = lastLift(name, vKey());
  const val = (f, k) => {
    const i = woEl.querySelector(`[data-wi="${f}"][data-wk="${k}"]`);
    if (!i) return null;
    const n = num(i.value);
    return n !== null && n >= 0 ? n : null;
  };

  /* ± düğmeleri: kutuyu değiştirir, kaydetmez (✓ kaydeder) */
  q("[data-wpm]").forEach(b => b.onclick = () => {
    const f = b.dataset.wpm, k = b.dataset.wk;
    const i = woEl.querySelector(`[data-wi="${f}"][data-wk="${k}"]`);
    if (!i) return;
    const cur = num(i.value) ?? 0;
    i.value = fmtN(Math.max(0, woRound(f, cur + woStep(f) * (+b.dataset.wd))));
    i.dispatchEvent(new Event("input", { bubbles:true }));
    if (["kg","min","km","m"].includes(f) && !["w","r","t"].includes(ex.t)) i.onchange();
  });

  /* set onayı */
  q("[data-wok]").forEach(b => b.onclick = async () => {
    const k = +b.dataset.wok;
    const rec = woRec(name, ex.t);
    rec.sets = rec.sets || [];
    const before = records().find(r => r.name === name);
    if (woSetDone(ex, rec, k)){
      rec.sets[k] = ex.t === "w" ? null : null;
      woTidy(name); await save(); drawWO(); return;
    }
    if (ex.t === "w"){
      const r = val("r", k);
      if (r === null || r === 0){ toast("Kaç tekrar yaptığını gir."); return; }
      const kg = val("kg", k);
      rec.sets[k] = kg === null ? { r } : { kg, r };
    } else {
      const v = val("s", k);
      if (v === null || v === 0){ toast(ex.t === "t" ? "Kaç saniye tuttuğunu gir." : "Kaç tekrar yaptığını gir."); return; }
      rec.sets[k] = v;
    }
    for (let j = 0; j < rec.sets.length; j++) if (rec.sets[j] === undefined) rec.sets[j] = null;
    await save(); drawWO();
    checkPR(name, before);
  });

  /* hepsi geçen seferki gibi */
  const copy = el("#wo-copy");
  if (copy) copy.onclick = async () => {
    const rec = woRec(name, ex.t);
    rec.sets = rec.sets || [];
    const before = records().find(r => r.name === name);
    let n = 0;
    for (let k = 0; k < (ex.n || 1); k++){
      if (woSetDone(ex, rec, k)) continue;
      const s = woSug(ex, rec, prev, k);
      if (ex.t === "w"){
        /* kilo bilinmiyorsa toplu doldurma o seti atlar; elle ✓ hâlâ mümkün */
        if (s.r === null || s.r === undefined || s.kg === null || s.kg === undefined) continue;
        rec.sets[k] = { kg:s.kg, r:s.r };
      } else {
        if (s.v === null || s.v === undefined) continue;
        rec.sets[k] = s.v;
      }
      n++;
    }
    if (!n){ toast("Doldurulacak bir değer yok; sayıları elle gir."); return; }
    for (let j = 0; j < rec.sets.length; j++) if (rec.sets[j] === undefined) rec.sets[j] = null;
    await save(); drawWO();
    checkPR(name, before);
    toast(`${n} set kaydedildi.`);
  };

  /* tur / set rozetleri */
  q("[data-wc]").forEach(b => b.onclick = async () => {
    const v = +b.dataset.wc, rec = woRec(name, ex.t);
    const before = records().find(r => r.name === name);
    rec.n = rec.n === v ? v - 1 : v;
    if (!rec.n) delete rec.n;
    woTidy(name); await save(); drawWO();
    checkPR(name, before);
  });

  /* tek alanlı tipler: değer değişince kaydet */
  q("[data-wi]").forEach(i => {
    const f = i.dataset.wi;
    if (["w","r","t"].includes(ex.t)) return;
    i.onchange = async () => {
      const rec = woRec(name, ex.t);
      const before = records().find(r => r.name === name);
      const n = num(i.value);
      const v = n !== null && n >= 0 ? (f === "m" ? Math.round(n) : n) : null;
      if (v === null) delete rec[f]; else rec[f] = v;
      woTidy(name); await save();
      const ae = document.activeElement === i;
      drawWO();
      if (ae) woEl.querySelector(`[data-wi="${f}"][data-wk="${i.dataset.wk}"]`)?.focus();
      checkPR(name, before);
    };
  });

  /* "yaptım" düğmesi */
  const ok1 = el("#wo-ok1");
  if (ok1) ok1.onclick = async () => {
    const rec = woRec(name, ex.t);
    if (rec.ok) delete rec.ok; else rec.ok = 1;
    woTidy(name); await save(); drawWO();
  };
}


function howCard(id){
  const g = GUIDE_BY_ID[id];
  const open = howOpen === id;
  return `<div class="how${open ? " on" : ""}">
    <button class="how-h" data-how="${id}" aria-expanded="${open}">
      <span>${esc(g.n)}</span><svg class="ico fold-c" aria-hidden="true"><use href="#i-next"/></svg>
    </button>
    ${open ? `<div class="how-b"><ol>${g.s.map(x => `<li>${x}</li>`).join("")}</ol>
      <div class="how-x"><b>Dikkat:</b> ${g.x}</div></div>` : ""}
  </div>`;
}

function howList(program){
  const q = norm(howQuery.trim());
  let body;
  if (q.length >= 2){
    const hits = GUIDE.filter(g => matchScore(g.n, q) > 0);
    body = `<section>${hits.length ? hits.map(g => howCard(g.id)).join("")
      : `<div class="empty">"${esc(howQuery)}" için anlatım bulunamadı.</div>`}</section>`;
  } else {
    const seen = new Set();
    body = program.training.days.filter(d => d.b).map(d => {
      const ids = [];
      for (const ex of exercisesOf(d)) for (const id of guidesFor(ex))
        if (!seen.has(id)){ seen.add(id); ids.push(id); }
      if (!ids.length) return "";
      return `<section><h2>${WD_NAMES[d.wd]} · ${esc(d.t)}</h2>${ids.map(howCard).join("")}</section>`;
    }).join("");
  }
  return body;
}

function howtoView(program){
  return `<section>
    <input id="how-q" type="text" placeholder="Hareket ara: squat, barfiks, plank…" value="${esc(howQuery)}" autocomplete="off">
    <div class="metric-note" style="margin-top:10px">Programındaki hareketler günlere göre sıralı. Başka bir hareketi arayarak da bulabilirsin. Ağrı hissedersen dur; tekniği ağırlıktan önce oturt.</div>
  </section>
  <div id="how-res">${howList(program)}</div>`;
}

function wireHowto(){
  app.querySelectorAll("[data-how]").forEach(b => b.onclick = () => {
    howOpen = howOpen === b.dataset.how ? null : b.dataset.how;
    const res = document.getElementById("how-res");
    const y = window.scrollY;
    res.innerHTML = howList(currentProgram());
    window.scrollTo(0, y);
    wireHowto();

  const q = document.getElementById("how-q");

    q.oninput = () => {

      wireHowto();
    };
  }
}

/* ---- haftalık özet ---- */
function weeklySummary(){
  const program = currentProgram();
  const t = today();
  const keys = Object.keys(state.days).filter(k => k > shiftDays(t,-7) && k <= t).sort();
  if (!keys.length || !program) return "";

  const kcals = keys.map(k => state.days[k].kcal).filter(v => typeof v === "number");
  const avg = kcals.length ? Math.round(kcals.reduce((a,b)=>a+b,0)/kcals.length) : null;
  const inBand = kcals.filter(v => v >= program.kcal*0.9 && v <= program.kcal*1.1).length;

  let tDone = 0, tAll = 0;
  for (const k of keys){ const ts = state.days[k].tasks || []; tAll += ts.length; tDone += ts.filter(x=>x.done).length; }

  const cur = avgWeights(state, shiftDays(t,-7), t);
  const prev = avgWeights(state, shiftDays(t,-14), shiftDays(t,-7));
  const wch = (cur.length && prev.length)
    ? (cur.reduce((a,b)=>a+b,0)/cur.length) - (prev.reduce((a,b)=>a+b,0)/prev.length) : null;

  const lifts = keys.filter(k => state.days[k].lifts && Object.values(state.days[k].lifts).some(liftHas)).length;

  const row = (l, v, note) => `<div class="macro"><span class="lbl">${l}${note?`<div class="metric-note">${note}</div>`:""}</span><span class="v num">${v}</span></div>`;

  return `<section>
    <h2>Son 7 gün</h2>
    ${row("Ortalama kalori", avg !== null ? `${avg} kcal` : "—", avg !== null ? `hedef ${program.kcal} kcal` : "kalori girilmemiş")}
    ${row("Hedef bandında gün", kcals.length ? `${inBand}/${kcals.length}` : "—", "±%10 aralığı")}
    ${row("Kilo değişimi", wch !== null ? `${wch>0?"+":""}${wch.toFixed(2)} kg` : "—", wch !== null ? "iki haftalık ortalama farkı" : "trend için daha fazla ölçüm gerekli")}
    ${row("Tamamlanan görev", tAll ? `%${Math.round(tDone/tAll*100)}` : "—", tAll ? `${tDone}/${tAll}` : "")}
    ${row("Antrenman kaydı", `${lifts} gün`, "")}
  </section>`;
}

/* ---- dışa / içe aktarma ---- */
async function exportData(statusEl){
  const payload = JSON.stringify({ app:"starboard", v:1, exportedAt:new Date().toISOString(), state }, null, 2);
  const filename = `starboard-${today()}.json`;
  const say = m => { if (statusEl) statusEl.textContent = m; };

  /* claude.ai'da yayınlandığında indirme yeteneğinden geçmesi gerekiyor;
     dosyayı doğrudan açtığında (yerel dosya, GitHub Pages) eski yol çalışır. */
  try {
    const dl = window.claude && claude.use ? await claude.use("downloads") : null;
    if (dl) {
      try {
        await dl.save({ filename, data: payload });
        say(`${filename} kaydedildi.`);
      } catch (e) {
        const c = e && e.code;
        if (c === "declined") say("İndirme iptal edildi.");
        else if (c === "rate_limited") say("Az önce bir indirme istendi, birkaç saniye sonra tekrar dene.");
        else say("Bu ortamda dosya indirilemedi.");
      }
      return;
    }
  } catch(e){ /* yetenek yok, aşağıdaki yola düş */ }

  const url = URL.createObjectURL(new Blob([payload], { type:"application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  say(`${filename} indirildi.`);
}

function importData(file, statusEl){
  const rd = new FileReader();
  rd.onload = async () => {
    let data;
    try { data = JSON.parse(rd.result); }
    catch(e){ statusEl.textContent = "Dosya okunamadı: geçerli bir JSON değil."; return; }
    const incoming = data && data.state ? data.state : data;
    if (!incoming || !incoming.profile || !incoming.days){
      statusEl.textContent = "Bu dosya bu uygulamanın yedeği gibi görünmüyor."; return;
    }
    const n = Object.keys(incoming.days).length;
    if (!confirm(`${n} günlük kayıt yüklenecek ve mevcut verilerin silinecek. Devam edilsin mi?`)) return;
    state = incoming;
    state.v = 1;
    await saveState(state);
    tab = "today"; render(); window.scrollTo(0,0);
  };
  rd.onerror = () => { statusEl.textContent = "Dosya okunamadı."; };
  rd.readAsText(file);
}

function greetTitle(){
  const h = new Date().getHours();
  const [hi, ic] = h < 5 ? ["İyi geceler","🌙"] : h < 12 ? ["Günaydın","☀️"]
                 : h < 18 ? ["İyi günler","🌤️"] : h < 22 ? ["İyi akşamlar","🌆"] : ["İyi geceler","🌙"];
  const n = state.profile.name ? `, ${esc(state.profile.name)}` : "";
  return `${hi}${n} <span class="wave" aria-hidden="true">${ic}</span>`;
}
function greetSub(program){
  const e = state.days[today()] || { tasks:[] };
  const all = e.tasks.length, left = e.tasks.filter(t => !t.done).length;
  const kcalLeft = program && typeof e.kcal === "number" ? program.kcal - e.kcal : null;
  if (all && !left) return "Bugünkü her şeyi bitirdin, gökyüzünde bir yıldız daha yandı.";
  const parts = [];
  if (all) parts.push(`${left} görevin kaldı`);
  if (kcalLeft !== null && kcalLeft > 0) parts.push(`hedefe ${kcalLeft} kcal var`);
  return parts.length ? "Bugün " + parts.join(", ") + "." : "Güne küçük bir adımla başla.";
}

const CONST_NAMES = ["Kervan","Lale","Kayık","Yay","Kartal","Nar","Çınar","Martı","Fener","Pusula","Kule","Tulpar","Kandil","Çapa"];
const weekStart = k => shiftDays(k, -(isoWeekday(k) - 1));
function rng(seed){ let x = (seed >>> 0) || 1; return () => (x = (Math.imul(x, 1664525) + 1013904223) >>> 0) / 4294967296; }
const seedOf = k => Number(k.replace(/-/g, ""));
/* Damgalı gün her zaman tam sayılır; damgasızsa güncel hesaba bakılır. */
const fullDay = k => {
  const d = state.days[k];
  if (d && d.star) return true;
  const r = dayRatio(k);
  return r !== null && r >= 1;
};

function streakNow(){
  let k = today(), n = 0;
  if (!fullDay(k)) k = shiftDays(k, -1);   /* bugün henüz bitmediyse seri dünden sayılır */
  while (fullDay(k) && n < 3650){ n++; k = shiftDays(k, -1); }
  return n;
}
function starTotal(){ return Object.keys(state.days).filter(fullDay).length; }

function weekInfo(ws){
  const t = today();
  const days = Array.from({ length:7 }, (_, i) => shiftDays(ws, i));
  const lit = days.map(k => k <= t && fullDay(k));
  const n = lit.filter(Boolean).length;
  const name = n >= 5 ? CONST_NAMES[seedOf(ws) % CONST_NAMES.length] : null;
  return { days, lit, n, name };
}

function skySVG(ws, big){
  const W = 320, H = big ? 150 : 120;
  const r = rng(seedOf(ws));
  const { days, lit } = weekInfo(ws);
  const t = today();
  const pts = days.map((_, i) => [22 + i * ((W - 44) / 6) + (r() - .5) * 18, 24 + r() * (H - 48)]);
  const dust = Array.from({ length: big ? 34 : 22 }, () =>
    `<circle cx="${(r()*W).toFixed(1)}" cy="${(r()*H).toFixed(1)}" r="${(r()*0.9+0.3).toFixed(2)}" fill="var(--star-off)"/>`).join("");
  let lines = "";
  for (let i = 0; i < 6; i++){
    const [a, b] = [pts[i], pts[i+1]];
    const on = lit[i] && lit[i+1];
    lines += `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"
      stroke="${on ? "var(--star)" : "var(--star-off)"}" stroke-width="${on ? 1.6 : 1}" ${on ? "" : `stroke-dasharray="2 5"`} stroke-linecap="round" opacity="${on ? .75 : .7}"/>`;
  }
  const stars = pts.map(([x, y], i) => {
    const k = days[i], on = lit[i], isT = k === t, fut = k > t;
    const label = `${WD_NAMES[isoWeekday(k)]}: ${fut ? "henüz gelmedi" : on ? "yıldız yandı" : "yanmadı"}`;
    return `<g><title>${label}</title>
      ${on ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${big ? 11 : 9}" fill="var(--star)" opacity=".18"/>` : ""}
      ${isT ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${big ? 9 : 7.5}" fill="none" stroke="var(--sky-ink)" stroke-width="1.2" stroke-dasharray="2 2.5" opacity=".8"/>` : ""}
      ${on ? `<path transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${big ? 1 : .8})" d="M0-6.5 1.6-1.6 6.5 0 1.6 1.6 0 6.5-1.6 1.6-6.5 0-1.6-1.6Z" fill="var(--star)"/>`
           : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${fut ? 1.6 : 2.4}" fill="${fut ? "var(--star-off)" : "var(--sky-muted)"}" opacity="${fut ? 1 : .75}"/>`}
    </g>`;
  }).join("");
  return `<svg class="sky-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Haftanın takımyıldızı">${dust}${lines}${stars}</svg>`;
}

function skyCard(){
  const ws = weekStart(today());
  const w = weekInfo(ws);
  const streak = streakNow();
  return `<section class="sky">
    <div class="sky-head">
      <div><div class="sky-t">Bu haftanın takımyıldızı</div>
        <div class="sky-s">${w.name ? `“${w.name}” belirdi · ${w.n}/7 yıldız` : `${w.n}/7 yıldız yandı${w.n ? "" : ", ilki bugün olabilir"}`}</div></div>
      <div class="sky-n"><b class="num">${streak}</b><span>günlük seri</span></div>
    </div>
    ${skySVG(ws, true)}
    <div class="sky-note">Görevlerini bitirdiğin her gün bir yıldız yanar; haftada beş yıldız takımyıldızın adını açar. Toplam ${starTotal()} yıldız.</div>
  </section>`;
}

function skyGallery(){
  const ws = weekStart(today());
  const weeks = Array.from({ length:6 }, (_, i) => shiftDays(ws, -7 * i));
  const fmt = k => new Date(k + "T12:00:00").toLocaleDateString("tr-TR", { day:"numeric", month:"short" });
  return `<section>
    <h2>Gökyüzün <span class="count">son 6 hafta</span></h2>
    <div class="sky-grid">${weeks.map(k => { const w = weekInfo(k); return `<figure class="sky-mini">
      ${skySVG(k, false)}
      <figcaption><b>${w.name ? w.name : `${w.n}/7`}</b><span>${fmt(k)} – ${fmt(shiftDays(k, 6))}</span></figcaption>
    </figure>`; }).join("")}</div>
  </section>`;
}

const CUP = 250;
function cupsHTML(water, target){

  const full = Math.floor((water || 0) / CUP);
  return `<div class="cups" role="group" aria-label="Su bardakları, her biri ${CUP} ml">${Array.from({ length:n }, (_, i) =>
    `<button class="cup${i < full ? " on" : ""}" data-cup="${i}" aria-label="${i+1}. bardak${i < full ? ", içildi" : ""}">
      <svg viewBox="0 0 24 28" aria-hidden="true"><path class="cup-f" d="M5.4 11.5h13.2l-1.2 12.3a1.6 1.6 0 0 1-1.6 1.4H8.2a1.6 1.6 0 0 1-1.6-1.4z"/>
      <path class="cup-o" d="M4 3.5h16l-1.9 20.6a2.2 2.2 0 0 1-2.2 2H8.1a2.2 2.2 0 0 1-2.2-2z"/></svg></button>`).join("")}</div>`;
}

/* ---- uyku kaydırıcısı ---- */
const hm = m => { m = ((m % 1440) + 1440) % 1440; return `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`; };
const durTxt = m => `${Math.floor(m/60)} sa${m % 60 ? ` ${m % 60} dk` : ""}`;
function sleepTimes(entry){
  const wake = typeof entry.wake === "number" ? ((entry.wake % 1440) + 1440) % 1440 : 420;
  let bed = typeof entry.bed === "number" ? entry.bed
          : typeof entry.sleep === "number" ? wake - Math.round(entry.sleep * 60) : 1380;
  bed = ((Math.round(bed / 5) * 5) % 1440 + 1440) % 1440;
  return { bed, wake };
}
const sleepDur = (bed, wake) => ((wake - bed) % 1440 + 1440) % 1440;

/* 24 saatlik kadran: 00 üstte, 06 sağda, 12 altta, 18 solda. */
const DIAL = { c:120, r:92 };
const dialPt = (m, r = DIAL.r) => { const a = m / 1440 * 2 * Math.PI - Math.PI / 2; return [DIAL.c + r * Math.cos(a), DIAL.c + r * Math.sin(a)]; };
function dialArc(bed, wake){
  const d = sleepDur(bed, wake);
  if (d === 0) return "";
  const [x1, y1] = dialPt(bed), [x2, y2] = dialPt(wake);
  return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${DIAL.r} ${DIAL.r} 0 ${d > 720 ? 1 : 0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
}
function sleepHTML(entry){
  const { bed, wake } = sleepTimes(entry);
  const has = typeof entry.sleep === "number";
  const ticks = Array.from({ length:24 }, (_, h) => {
    const [x1, y1] = dialPt(h * 60, 74), [x2, y2] = dialPt(h * 60, h % 6 ? 70.5 : 67);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="dial-tick${h % 6 ? "" : " big"}"/>`;
  }).join("");
  const labels = [0, 6, 12, 18].map(h => { const [x, y] = dialPt(h * 60, 58); return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" class="dial-num">${String(h).padStart(2,"0")}</text>`; }).join("");
  const handle = (id, m, icon, label) => { const [x, y] = dialPt(m); return `<g id="${id}" class="dial-h" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"
      tabindex="0" role="slider" aria-label="${label}" aria-valuetext="${hm(m)}">
      <circle r="17"/><text y="5.5" text-anchor="middle">${icon}</text></g>`; };
  const d = sleepDur(bed, wake);
  return `<div class="entry sl-entry">${iconBox("rest")}
    <div class="entry-main">
      <div class="lbl-row"><span class="lbl">Uyku</span><span class="lbl-v num">${has ? durTxt(Math.round(entry.sleep*60)) : "henüz girilmedi"}</span></div>
      <button class="sl-toggle" id="sl-toggle" aria-expanded="false" aria-controls="sl-more">
        <span>${has ? `${hm(bed)} → ${hm(wake)}` : "Saatleri gir"}</span>
        <svg class="ico" aria-hidden="true"><use href="#i-next"/></svg></button>
      <div class="sl-more" id="sl-more" hidden>
      <div class="dial-wrap">
        <svg id="sl-dial" class="dial" viewBox="0 0 240 240" role="group" aria-label="Uyku saati kadranı">
          <defs><linearGradient id="sl-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--sleep)"/><stop offset="1" stop-color="var(--water)"/></linearGradient></defs>
          <circle cx="120" cy="120" r="${DIAL.r}" class="dial-track"/>
          <path id="sl-arc" class="dial-arc" d="${dialArc(bed, wake)}"/>
          ${ticks}${labels}
          <text x="120" y="114" class="dial-dur num" id="sl-c1">${durTxt(d)}</text>
          <text x="120" y="134" class="dial-sub num" id="sl-c2">${hm(bed)} → ${hm(wake)}</text>
          ${handle("sl-h-bed", bed, "🌙", "Yatış saati")}
          ${handle("sl-h-wake", wake, "☀️", "Kalkış saati")}
        </svg>
      </div>
      <div class="dial-legend num"><span>🌙 Yattım <b id="sl-bed-v">${hm(bed)}</b></span><span>☀️ Kalktım <b id="sl-wake-v">${hm(wake)}</b></span></div>
      <div class="metric-note" style="text-align:center;margin-top:6px">${has ? "Ayı ve güneşi sürükleyerek değiştir; bırakınca kaydedilir." : "Ayı yattığın, güneşi kalktığın saate sürükle; bırakınca kaydedilir."}</div>
      </div>
    </div></div>`;
}
function wireSleep(entry){
  const tg = document.getElementById("sl-toggle"), more = document.getElementById("sl-more");
  if (tg && more) tg.onclick = () => {
    more.hidden = !more.hidden;
    tg.setAttribute("aria-expanded", String(!more.hidden));
    tg.classList.toggle("on", !more.hidden);
  };
  const svg = document.getElementById("sl-dial");
  if (!svg) return;
  let { bed, wake } = sleepTimes(entry);
  const hb = document.getElementById("sl-h-bed"), hw = document.getElementById("sl-h-wake");
  const draw = () => {
    const [bx, by] = dialPt(bed), [wx, wy] = dialPt(wake);
    hb.setAttribute("transform", `translate(${bx.toFixed(1)} ${by.toFixed(1)})`);
    hw.setAttribute("transform", `translate(${wx.toFixed(1)} ${wy.toFixed(1)})`);
    hb.setAttribute("aria-valuetext", hm(bed)); hw.setAttribute("aria-valuetext", hm(wake));
    document.getElementById("sl-arc").setAttribute("d", dialArc(bed, wake));
    document.getElementById("sl-c1").textContent = durTxt(sleepDur(bed, wake));
    document.getElementById("sl-c2").textContent = `${hm(bed)} → ${hm(wake)}`;
    document.getElementById("sl-bed-v").textContent = hm(bed);
    document.getElementById("sl-wake-v").textContent = hm(wake);
  };
  const save = async (refocus) => {
    entry.bed = bed; entry.wake = wake;
    entry.sleep = Math.round(sleepDur(bed, wake) / 60 * 100) / 100;
    await saveState(state); render();
    if (refocus) document.getElementById(refocus)?.focus();
  };
  const minuteAt = ev => {
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX - r.left) / r.width * 240 - DIAL.c, y = (ev.clientY - r.top) / r.height * 240 - DIAL.c;
    let a = Math.atan2(y, x) + Math.PI / 2; if (a < 0) a += 2 * Math.PI;
    return (Math.round(a / (2 * Math.PI) * 1440 / 5) * 5) % 1440;
  };
  let drag = null;
  const start = (which) => ev => { drag = which; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); };
  hb.onpointerdown = start("bed"); hw.onpointerdown = start("wake");
  svg.onpointermove = ev => { if (!drag) return; const m = minuteAt(ev); if (drag === "bed") bed = m; else wake = m; draw(); };
  svg.onpointerup = svg.onpointercancel = () => { if (!drag) return; drag = null; save(); };
  const key = (which, id) => ev => {
    const d = { ArrowUp:15, ArrowRight:15, ArrowDown:-15, ArrowLeft:-15 }[ev.key];
    if (!d) return;
    ev.preventDefault();
    if (which === "bed") bed = (bed + d + 1440) % 1440; else wake = (wake + d + 1440) % 1440;
    draw(); save(id);
  };
  hb.onkeydown = key("bed", "sl-h-bed"); hw.onkeydown = key("wake", "sl-h-wake");
}

/* ---- kişisel rekorlar ---- */
const e1rm = (kg, r) => kg * (1 + r / 30);
function records(){
  const best = new Map();
  const put = (name, val, text, k, extra) => {
    const cur = best.get(name);
    if (!cur || val > cur.val) best.set(name, { name, val, text, k, ...extra });
  };
  for (const [k, d] of Object.entries(state.days)){
    for (const [name, rec] of Object.entries(d.lifts || {})){
      if (!liftHas(rec)) continue;
      if (!rec.t){                                   /* eski biçim */
        if (rec.kg) put(name, e1rm(rec.kg, rec.reps || 1), `${fmtN(rec.kg)} kg × ${rec.reps || 1}`, k, { u:"w" });
        continue;
      }
      switch (rec.t){
        case "w": {
          const sets = (rec.sets || []).filter(x => x && x.kg && x.r);
          if (!sets.length) break;
          const b = sets.reduce((a, x) => e1rm(x.kg, x.r) > e1rm(a.kg, a.r) ? x : a);
          put(name, e1rm(b.kg, b.r), `${fmtN(b.kg)} kg × ${b.r}`, k, { u:"w" });
          break;
        }
        case "wc": if (rec.kg) put(name, rec.kg * 100 + (rec.n || 0), `${fmtN(rec.kg)} kg · ${rec.n || 0} set`, k, { u:"w" }); break;
        case "r": { const m = Math.max(0, ...numsOf(rec.sets)); if (m) put(name, m, `${m} tekrar`, k, { u:"r" }); break; }
        case "t": { const m = Math.max(0, ...numsOf(rec.sets)); if (m) put(name, m, `${m} sn`, k, { u:"t" }); break; }
        case "n": if (rec.n) put(name, rec.n, `${rec.n} tur`, k, { u:"n" }); break;
        case "sw": if (rec.n) put(name, rec.n, `${rec.n} tekrar`, k, { u:"n" }); break;
        case "sd": if (rec.m) put(name, rec.m, `${rec.m} m`, k, { u:"d" }); break;
        case "c": if (rec.km) put(name, rec.km, `${fmtN(rec.km)} km${rec.min ? ` · ${pace(rec.min, rec.km)}` : ""}`, k, { u:"d" }); break;
      }
    }
  }
  return [...best.values()].sort((a, b) => (b.k === today()) - (a.k === today()) || b.k.localeCompare(a.k));
}
function prBoard(){
  const all = records();
  const list = all.slice(0, 8);
  return `<section>
    <h2>Kişisel rekorlar ${all.length ? `<span class="count">${all.length} hareket</span>` : ""}</h2>
    ${list.length ? `<div class="prs">${list.map(r => `<div class="pr${r.k === today() ? " new" : ""}">
      <svg class="pr-cup" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-cup"/></svg>
      <div class="pr-m"><span class="pr-n">${esc(parseEx(r.name, venueOf(currentProgram())).name)}</span>
        <span class="pr-v num">${esc(r.text)}</span></div>
      <span class="pr-d">${r.k === today() ? "bugün" : prettyDate(r.k)}</span>
    </div>`).join("")}</div>
    <div class="metric-note" style="margin-top:12px">Ağırlıklı hareketlerde rekor, tahmini tek tekrar maksimumuna göre seçilir: ağırlık × (1 + tekrar ÷ 30). Böylece 60 kg × 8, 70 kg × 3'ten daha iyi sayılabilir.</div>`
    : `<div class="empty">Antrenman kaydı girdikçe her hareketin en iyisi burada birikir.</div>`}
  </section>`;
}

/* Yeni rekor kırıldıysa kısa kutlama */
function checkPR(name, before){
  const now = records().find(r => r.name === name);
  if (!now || now.k !== vKey()) return;
  if (before && now.val <= before.val + 0.001) return;
  toast(`🏆 Yeni rekor: ${parseEx(name, venueOf(currentProgram())).name} · ${now.text}`);
}

/* ---- kısa bilgi ---- */
function toast(msg){
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

/* ---- kutlama ---- */
function celebrate(){
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cols = ["--band-vivid","--star","--good-vivid","--sleep","--water","--g-fruit"];
  const el = document.createElement("div");
  el.className = "party";
  el.innerHTML = (reduce ? "" : Array.from({ length:42 }, (_, i) =>
      `<i style="left:${(Math.random()*100).toFixed(1)}%;animation-delay:${(Math.random()*.5).toFixed(2)}s;--r:${Math.round(Math.random()*360)}deg;background:var(${cols[i % cols.length]})"></i>`).join(""))
    + `<div class="party-card" role="status">
        <svg class="party-star" viewBox="-8 -8 16 16" aria-hidden="true"><path d="M0-6.5 1.6-1.6 6.5 0 1.6 1.6 0 6.5-1.6 1.6-6.5 0-1.6-1.6Z" fill="var(--star)"/></svg>
        <b>Bugün tamam!</b><span>Takımyıldızına bir yıldız eklendi. Seri: ${streakNow()} gün.</span>
        <button id="party-ok">Harika</button></div>`;
  document.body.appendChild(el);
  const close = () => sheetOut(el);
  el.querySelector("#party-ok").onclick = close;
  el.onclick = e => { if (e.target === el) close(); };
  setTimeout(close, 5000);
}

/* Günün verisine göre avatarın hali */
function avatarMood(e, program){
  const sleepy = typeof e.sleep === "number" && e.sleep < sleepBand()[0] - 0.5;
  const tr = program ? autoInfo({ kind:"train", suggested:true }, e, program) : null;
  const kc = program ? autoInfo({ kind:"kcal", suggested:true }, e, program) : null;
  const trained = !!(tr && tr.ok), happy = !!(kc && kc.ok);
  const line = happy ? "😊 kalori hedefte" : trained ? "⚡ antrenman tamam" : sleepy ? "😴 az uyudun" : "";
  return { sleepy, trained, happy, star: fullDay(today()), line };
}
function avatarSVG(key, sx, wp, mood, uid){
  const sym = "#" + avSym(key);
  const [fx, fy, fs] = (AVATARS.find(a => a[0] === key) || AVATARS[2])[2];
  const yTop = (58 - 55 * wp).toFixed(1);
  const m = mood || {};
  let face = "";
  if (m.happy || m.sleepy){
    const ex = 3.2 * fs, er = 1.15 * fs, ey = fy - 1.2 * fs;
    const eyes = m.sleepy && !m.happy
      ? `<path d="M${fx-ex-er} ${ey} h${er*2} M${fx+ex-er} ${ey} h${er*2}" class="face-l"/>`
      : `<circle cx="${fx-ex}" cy="${ey}" r="${er}" class="face-d"/><circle cx="${fx+ex}" cy="${ey}" r="${er}" class="face-d"/>`;
    const mouth = m.happy ? `<path d="M${fx-2.6*fs} ${fy+1.6*fs} Q${fx} ${fy+4.6*fs} ${fx+2.6*fs} ${fy+1.6*fs}" class="face-l"/>`
                          : `<circle cx="${fx}" cy="${fy+2.6*fs}" r="${.9*fs}" class="face-d" opacity=".7"/>`;
    face = `<g class="face" style="stroke-width:${Math.max(.6, 1.1*fs)}px">${eyes}${mouth}</g>`;
  }
  const spark = (x, y, r) => `<path class="spark" transform="translate(${x} ${y}) scale(${r})" d="M0-5 1.2-1.2 5 0 1.2 1.2 0 5-1.2 1.2-5 0-1.2-1.2Z"/>`;
  return `<svg viewBox="0 0 48 64" role="img" aria-label="Avatar, bugünkü su hedefinin yüzde ${Math.round(wp*100)}'i dolu"${m.trained ? ` class="glow"` : ""}>
      <defs><clipPath id="${uid}-clip"><rect x="0" y="${yTop}" width="48" height="64"/></clipPath></defs>
      <g transform="translate(24 0) scale(${sx.toFixed(3)} 1) translate(-24 0)">
        <use href="${sym}" class="bc-base"/>
        <g clip-path="url(#${uid}-clip)"><use href="${sym}"/></g>
        ${face}
      </g>
      ${m.trained ? spark(4, 18, .55) + spark(44, 30, .45) + spark(7, 44, .4) : ""}
      ${m.star ? `<path class="bc-star" transform="translate(40 8)" d="M0-5 1.2-1.2 5 0 1.2 1.2 0 5-1.2 1.2-5 0-1.2-1.2Z"/>` : ""}
      ${m.sleepy ? `<text x="2" y="12" class="zz">z<tspan dx="1" dy="-4" font-size="8">Z</tspan></text>` : ""}
    </svg>`;
}

  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <div class="sheet-h"><b id="sh-t">Avatarın</b><button class="sheet-x" aria-label="Kapat">×</button></div>

    <div class="metric-note" style="margin:10px 0 0">Avatar gün içinde tepki verir: su içtikçe dolar, az uyursan uykulu görünür, antrenmanı bitirince parlar, kalori hedefini tutunca gülümser.</div>
    <div class="row" style="margin-top:16px"><button id="sh-save">Kaydet</button><button class="ghost" id="sh-cancel" style="flex:0 0 100px">Vazgeç</button></div>
  </div>`;
  document.body.appendChild(el);
  const sheet = el.querySelector(".sheet");
  sheet.style.setProperty("--av", col);
  const upd = () => { el.querySelector("#sh-pv").innerHTML = preview(); sheet.style.setProperty("--av", col); };
  wireAvatar("sh", k => { key = k; upd(); }, el);
  wireColor("sh", c => { col = c; upd(); }, el);
  const close = () => sheetOut(el);
  el.onclick = ev => { if (ev.target === el) close(); };
  el.querySelector(".sheet-x").onclick = close;
  el.querySelector("#sh-cancel").onclick = close;
  el.querySelector("#sh-save").onclick = async () => {
    p.avatar = key; p.avColor = col;
    await saveState(state); close(); render(); toast("Avatarın güncellendi.");
  };
  el.querySelector("#sh-save").focus();
}

/* ACE yağ oranı sınıfları (erkek / kadın). */
function fatClass(bf, sex){
  const t = sex === "female" ? [14, 21, 25, 32] : sex === "male" ? [6, 14, 18, 25] : [10, 17.5, 21.5, 28.5];
  if (bf < t[0]) return ["çok düşük", "warn"];
  if (bf < t[1]) return ["atletik", "ok"];
  if (bf < t[2]) return ["fit", "ok"];
  if (bf < t[3]) return ["ortalama", "ok"];
  return ["yüksek", "bad"];
}
function bmiClass(b){
  return b < 18.5 ? ["zayıf","warn"] : b < 25 ? ["normal","ok"] : b < 30 ? ["kilolu","warn"] : ["obez","bad"];
}
const kg1 = v => v.toFixed(1).replace(".", ",");

function bodyCard(){
  const p = state.profile, female = p.sex === "female", neutral = p.sex !== "female" && p.sex !== "male";
  const w = lastWeight();
  const h = p.height / 100;
  const bmi = w !== null && h > 0 ? w / (h*h) : null;
  const bf = p.bodyFat > 0 && p.bodyFat < 70 ? p.bodyFat : null;
  const program = currentProgram();
  const e = state.days[today()] || {};

  /* canlı figür: gövde yağ oranına (yoksa BMI'ye) göre genişler, günün suyuyla dolar */
  const wide = bf !== null ? (bf - sexK(p.sex, 15, 22)) * 0.014 : bmi !== null ? (bmi - 22) * 0.025 : 0;
  const sx = clamp(1 + wide, 0.86, 1.28);
  const wp = program ? clamp((e.water || 0) / program.water, 0, 1) : 0;
  const yTop = (58 - 55 * wp).toFixed(1);
  const mood = avatarMood(e, program);
  const fig = `<button class="bc-fig" id="bc-fig" style="--av:${avColor(p)}" aria-label="Avatarını değiştir">
    ${avatarSVG(avKey(p), sx, wp, mood, "bc")}
    <span class="bc-water num">💧 %${Math.round(wp*100)}</span>
    ${mood.line ? `<span class="bc-mood">${mood.line}</span>` : ""}
  </button>`;

  const [bmiTxt, bmiCls] = bmi !== null ? bmiClass(bmi) : ["", ""];
  const [bfTxt, bfCls] = bf !== null ? fatClass(bf, p.sex) : ["", ""];
  const stats = `<div class="stats">
    <div class="stat"><b>${p.height}<small> cm</small></b><span>Boy</span></div>
    <div class="stat"><b>${w !== null ? kg1(w) : "—"}<small> kg</small></b><span>Kilo</span></div>
    <div class="stat"><b>${bf !== null ? kg1(bf) : "—"}<small> %</small></b><span>Yağ oranı${bfTxt ? ` <em class="tag ${bfCls}">${bfTxt}</em>` : ""}</span></div>
    <div class="stat"><b>${bmi !== null ? kg1(bmi) : "—"}</b><span>BMI${bmiTxt ? ` <em class="tag ${bmiCls}">${bmiTxt}</em>` : ""}</span></div>
  </div>`;

  /* hedefe yolculuk */
  let journey;
  const start = p.startWeight, target = p.targetWeight;
  if (typeof target === "number" && typeof start === "number" && w !== null && start !== target){
    const total = start - target, gone = start - w;
    const pct = clamp(gone / total, 0, 1);
    const left = Math.abs(target - w);
    const down = target < start;
    const cur = avgWeights(state, shiftDays(today(), -7), today());
    const prev = avgWeights(state, shiftDays(today(), -14), shiftDays(today(), -7));
    const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
    const rate = cur.length && prev.length ? mean(cur) - mean(prev) : null;
    const right = rate !== null && (down ? rate < -0.05 : rate > 0.05);
    const reached = down ? w <= target : w >= target;
    const eta = reached ? "Hedefe ulaştın 🎉"
      : right ? `bu tempoyla ~${Math.max(1, Math.ceil(left / Math.abs(rate)))} hafta`
      : rate === null ? "tempo için iki haftalık tartı gerekli" : "son hafta hedefin tersine gitti";
    journey = `<div class="bc-sec">
      <div class="bc-h"><span>Hedefe yolculuk</span><b class="num">%${Math.round(pct * 100)}</b></div>
      <div class="jr"><div class="jr-fill" style="width:${(pct*100).toFixed(1)}%"></div><span class="jr-now" style="left:${(pct*100).toFixed(1)}%"></span></div>
      <div class="jr-lbl num"><span><b>${kg1(start)}</b>başlangıç</span><span class="mid"><b>${kg1(w)}</b>şimdi</span><span class="end"><b>${kg1(target)}</b>hedef</span></div>
      <div class="bc-note">${Math.abs(gone) >= 0.05 ? `${kg1(Math.abs(gone))} kg ${gone > 0 ? "verdin" : "aldın"} · ` : ""}${reached ? "" : `${kg1(left)} kg kaldı · `}${eta}</div>
    </div>`;
  } else {
    journey = `<div class="bc-sec">
      <div class="bc-h"><span>Hedefe yolculuk</span></div>
      <div class="tw-row"><label for="tw" class="tw-l">Hedef kilon kaç?</label>
        <input id="tw" type="number" inputmode="decimal" placeholder="kg">
        <button id="tw-save">Kaydet</button></div>
      <div class="bc-note">Hedefi girince başlangıçtan hedefe ilerlemen ve tahmini süre burada görünür.</div>
    </div>`;
  }

  /* kompozisyon */
  let comp;
  if (bf !== null && w !== null){
    const fatKg = w * bf / 100, lean = w - fatKg;
    comp = `<div class="bc-sec">
      <div class="bc-h"><span>Vücut kompozisyonu</span></div>
      <div class="comp" role="img" aria-label="Yağsız kütle ${kg1(lean)} kg, yağ ${kg1(fatKg)} kg">
        <i class="lean" style="width:${(100 - bf).toFixed(1)}%"></i><i class="fat" style="width:${bf.toFixed(1)}%"></i></div>
      <div class="comp-lbl num"><span><i class="dot lean"></i>Yağsız <b>${kg1(lean)} kg</b></span><span><i class="dot fat"></i>Yağ <b>${kg1(fatKg)} kg</b></span></div>
      <div class="bc-note">${neutral ? "Fit aralık erkekte %14–17, kadında %21–24; ortalama erkekte %18–24, kadında %25–31 (ACE). Etiket iki sınırın ortalamasına göre verilir."
        : `${female ? "Kadında" : "Erkekte"} fit aralık %${female ? "21–24" : "14–17"}, ortalama %${female ? "25–31" : "18–24"} (ACE).`}</div>
    </div>`;
  } else {
    comp = `<div class="bc-sec"><div class="bc-h"><span>Vücut kompozisyonu</span></div>
      <div class="bc-note">Yağ oranını Bugün › Vücut ölçüleri'nden girersen kilonun ne kadarının yağ, ne kadarının kas ve diğer dokular olduğu burada ayrışır.</div></div>`;
  }

  return `<section class="bc">
    <div class="bc-top">${fig}${stats}</div>
    ${journey}
    ${comp}
  </section>`;
}

/* ---- grafik ---- */
/* ---- grafik ----
   Trend ölçümleri (kilo, yağ, bel) dolgulu alan; günlük miktarlar (kalori, uyku)
   sıfırdan büyüyen çubuk. Sağlıklı aralık arkada yumuşak bir bant olarak durur;
   değerler grafiğe dokununca baloncukta, son değer ise her zaman etiketli. */
const CHARTS = {};
let chartSeq = 0;

/* Eksen işaretleri yuvarlak sayılara otursun: 1 / 2 / 2,5 / 5 / 10 adımları. */
function niceTicks(lo, hi, n){
  const span = hi - lo;
  if (!(span > 0)) return [lo];
  const mag = Math.pow(10, Math.floor(Math.log10(span / n)));
  const u = (span / n) / mag;
  const step = (u <= 1 ? 1 : u <= 2 ? 2 : u <= 2.5 ? 2.5 : u <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-6; v += step) out.push(+v.toFixed(6));
  return out.length ? out : [lo];
}

/* Catmull-Rom → kübik Bezier; gerginlik düşük tutulur ki eğri veriyi aşmasın. */
function smoothPath(pts){
  if (pts.length < 3) return pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2, t = 0.18;
    d += ` C${(p1[0] + (p2[0]-p0[0])*t).toFixed(1)} ${(p1[1] + (p2[1]-p0[1])*t).toFixed(1)}`
       + ` ${(p2[0] - (p3[0]-p1[0])*t).toFixed(1)} ${(p2[1] - (p3[1]-p1[1])*t).toFixed(1)}`
       + ` ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

const chFmt = (v, dec) => fmtN(+v.toFixed(dec ?? 0));

/* Çubuk: veri ucu 4px yuvarlak, taban çizgisinde köşeli. */
function barPath(x0, y0, w, h, r){
  r = Math.min(r, w/2, h);
  return `M${x0.toFixed(1)} ${(y0+h).toFixed(1)} L${x0.toFixed(1)} ${(y0+r).toFixed(1)}`
    + ` Q${x0.toFixed(1)} ${y0.toFixed(1)} ${(x0+r).toFixed(1)} ${y0.toFixed(1)}`
    + ` L${(x0+w-r).toFixed(1)} ${y0.toFixed(1)} Q${(x0+w).toFixed(1)} ${y0.toFixed(1)} ${(x0+w).toFixed(1)} ${(y0+r).toFixed(1)}`
    + ` L${(x0+w).toFixed(1)} ${(y0+h).toFixed(1)} Z`;
}

function trendChart(series, o){
  o = o || {};
  const dec = o.dec ?? 0, unit = o.unit || "";
  if (series.length < 2)
    return `<div class="empty">Grafik için en az iki günlük veri gerekiyor. Şu an ${series.length} kayıt var.</div>`;

  const W = 320, H = 168, L = 34, R = 10, T = 16, B = 24;
  const bar = o.kind === "bar";
  const id = "ch" + (++chartSeq);
  const vals = series.map(s => s.v);
  const band = (o.band && o.band[1] > o.band[0]) ? o.band : null;

  /* Çubukta taban sıfır (uzunluk miktarı temsil eder); çizgide aralık veriden gelir. */
  let lo, hi;
  if (bar){
    lo = 0;
    hi = Math.max(...vals, band ? band[1] : 0) * 1.18 || 1;
  } else {
    lo = Math.min(...vals); hi = Math.max(...vals);
    const sp = (hi - lo) || Math.max(1, Math.abs(hi) * 0.08);
    lo -= sp * 0.2; hi += sp * 0.2;
  }
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const yc = v => clamp(y(v), T, H - B);
  const n = series.length;
  const x = i => n === 1 ? (L + W - R) / 2
    : bar ? L + (W - L - R) * ((i + 0.5) / n)
          : L + (W - L - R) * (i / (n - 1));

  /* Sağlıklı aralık: arkada yumuşak bant, çizgi yok. Bant görünür alanın
     neredeyse tamamını kaplıyorsa çizilmez; zemini boyamaktan başka iş görmez. */
  const bh = band ? yc(band[0]) - yc(band[1]) : 0;
  const bandOn = !!band && band[0] < hi && band[1] > lo && bh > 3 && bh < (H - T - B) * 0.88;
  const bandRect = bandOn
    ? `<rect class="ch-band" x="${L}" y="${yc(band[1]).toFixed(1)}" width="${(W-L-R).toFixed(1)}"
        height="${bh.toFixed(1)}" rx="4"/>` : "";

  const ticks = niceTicks(lo, hi, 3).filter(t => y(t) >= T - 0.5 && y(t) <= H - B + 0.5);
  const grid = ticks.map(t => `<line class="ch-grid" x1="${L}" y1="${y(t).toFixed(1)}" x2="${W-R}" y2="${y(t).toFixed(1)}"/>
    <text class="ch-lbl" x="${L-6}" y="${(y(t)+3.4).toFixed(1)}" text-anchor="end">${chFmt(t, dec)}</text>`).join("");

  const pts = series.map((s, i) => [x(i), y(s.v)]);
  const last = series[n-1];

  let marks = "";
  if (bar){
    /* çubuklar: 24px'i geçmez, komşuyla arasında 2px yüzey boşluğu, ucu 4px yuvarlak */
    const slot = (W - L - R) / n;
    const w = Math.max(2, Math.min(22, slot * 0.66));
    marks = series.map((s, i) => {
      const h = Math.max(2, (H - B) - y(s.v));
      return `<path class="ch-bar" data-i="${i}" style="--i:${i}" d="${barPath(x(i) - w/2, y(s.v), w, h, 4)}"/>`;
    }).join("");
  } else {
    const line = smoothPath(pts);
    const area = `${line} L${pts[n-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z`;
    let avg = "";
    if (o.average && n >= 4){
      const ap = series.map((s, i) => {
        const win = series.slice(Math.max(0, i-6), i+1).map(z => z.v);
        return [x(i), y(win.reduce((a,b) => a+b, 0) / win.length)];
      });
      avg = `<path class="ch-avg" d="${smoothPath(ap)}"/>`;
    }
    marks = `<defs><linearGradient id="${id}-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="currentColor" stop-opacity=".26"/>
        <stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>
      <path class="ch-area" d="${area}" fill="url(#${id}-g)"/>${avg}
      <path class="ch-line" pathLength="1" d="${line}"/>
      <circle class="ch-end" cx="${pts[n-1][0].toFixed(1)}" cy="${pts[n-1][1].toFixed(1)}" r="4.5"/>`;
  }

  /* Son değer her zaman yazılı: değer okumak dokunmaya bağlı kalmasın.
     Çizgi sona doğru iniyorsa etiket noktanın altına geçer ki çizgiyi kesmesin. */
  const falling = !bar && n > 1 && pts[n-1][1] > pts[n-2][1] + 0.5;
  const ey = bar ? T + 9 : clamp(pts[n-1][1] + (falling ? 15 : -11), T + 9, H - B - 5);
  const endLabel = `<text class="ch-end-t" x="${W-R}" y="${ey.toFixed(1)}" text-anchor="end">${chFmt(last.v, dec)}${unit ? " " + unit : ""}</text>`;

  CHARTS[id] = { xs: series.map((s, i) => x(i)), ys: series.map(s => bar ? y(s.v) : y(s.v)),
    ks: series.map(s => s.k), vs: vals, dec, unit, W, H, T, B, L, R, bar };

  return `<div class="ch-wrap" data-ch="${id}" data-c="${o.color || "weight"}">
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="${esc(o.label || "trend")}: ${chFmt(series[0].v, dec)} → ${chFmt(last.v, dec)} ${esc(unit)}">
      ${bandRect}${grid}${marks}
      <g class="ch-cur" hidden><line x1="0" y1="${T}" x2="0" y2="${H-B}"/><circle r="4.5" cx="0" cy="0"/></g>
      ${endLabel}
      <text class="ch-lbl" x="${L}" y="${H-7}">${prettyDate(series[0].k)}</text>
      <text class="ch-lbl" x="${W-R}" y="${H-7}" text-anchor="end">${prettyDate(last.k)}</text>
      <rect class="ch-hit" x="0" y="0" width="${W}" height="${H}" tabindex="0"
        aria-label="${esc(o.label || "trend")} grafiği; sağ ve sol okla günler arasında gezin"/>
    </svg>
    <div class="ch-tip" hidden><b></b><span></span></div>
  </div>`;
}

function bandNote(txt){
  return `<div class="ch-key"><i></i>${txt}</div>`;
}

function wireCharts(){
  app.querySelectorAll(".ch-wrap[data-ch]").forEach(wrap => {
    const c = CHARTS[wrap.dataset.ch];
    if (!c) return;
    const svg = wrap.querySelector("svg"), tip = wrap.querySelector(".ch-tip");
    const cur = wrap.querySelector(".ch-cur");
    const line = cur.querySelector("line"), dot = cur.querySelector("circle");
    const bars = wrap.querySelectorAll(".ch-bar");
    let at = -1;

    const show = i => {
      if (i < 0 || i >= c.xs.length) return;
      at = i;
      const r = svg.getBoundingClientRect();
      const px = c.xs[i] / c.W * r.width;
      if (c.bar){
        bars.forEach((b, j) => b.classList.toggle("on", j === i));
        cur.hidden = true;
      } else {
        line.setAttribute("x1", c.xs[i]); line.setAttribute("x2", c.xs[i]);
        dot.setAttribute("cx", c.xs[i]); dot.setAttribute("cy", c.ys[i]);
        cur.hidden = false;
      }
      tip.firstChild.textContent = chFmt(c.vs[i], c.dec) + (c.unit ? " " + c.unit : "");
      tip.lastChild.textContent = prettyDate(c.ks[i]);
      tip.hidden = false;
      const w = tip.offsetWidth || 90;
      tip.style.left = clamp(px - w/2, 2, Math.max(2, r.width - w - 2)) + "px";
      tip.style.top = Math.max(0, c.ys[i] / c.H * r.height - tip.offsetHeight - 15) + "px";
    };
    const hide = () => { at = -1; tip.hidden = true; cur.hidden = true; bars.forEach(b => b.classList.remove("on")); };
    const nearest = ev => {
      const r = svg.getBoundingClientRect();
      const ux = (ev.clientX - r.left) / r.width * c.W;
      let best = 0;
      for (let i = 1; i < c.xs.length; i++) if (Math.abs(c.xs[i] - ux) < Math.abs(c.xs[best] - ux)) best = i;
      return best;
    };
    svg.onpointermove = ev => { ev.preventDefault(); show(nearest(ev)); };
    svg.onpointerdown = ev => { ev.preventDefault(); show(nearest(ev)); };
    svg.onpointerleave = hide;
    svg.onpointercancel = hide;
    const hit = wrap.querySelector(".ch-hit");
    hit.onfocus = () => show(at < 0 ? c.xs.length - 1 : at);
    hit.onblur = hide;
    hit.onkeydown = ev => {
      const d = { ArrowRight:1, ArrowLeft:-1 }[ev.key];
      if (!d) { if (ev.key === "Escape") hide(); return; }
      ev.preventDefault();
      show(clamp((at < 0 ? c.xs.length - 1 : at) + d, 0, c.xs.length - 1));
    };
  });
}

function seriesOf(field, days){
  const t = today();
  const from = shiftDays(t, -days);
  return Object.keys(state.days).sort()
    .filter(k => k > from && k <= t && typeof state.days[k][field] === "number")
    .map(k => ({ k, v: state.days[k][field] }));
}

function bodySeries(field, days){
  const t = today(), from = shiftDays(t, -days);
  return Object.keys(state.days).sort()
    .filter(k => k > from && k <= t && state.days[k].body && typeof state.days[k].body[field] === "number")
    .map(k => ({ k, v: state.days[k].body[field] }));
}

function chartsView(){
  const program = currentProgram();
  const p = state.profile, h = p.height / 100;
  chartSeq = 0;
  for (const k of Object.keys(CHARTS)) delete CHARTS[k];

  const w = seriesOf("weight", 60);
  const kcal = seriesOf("kcal", 21);
  const sleep = seriesOf("sleep", 21);
  const bel = bodySeries("bel", 120);
  const yag = bodySeries("yag", 365);
  const delta = w.length >= 2 ? w[w.length-1].v - w[0].v : null;

  /* sağlıklı aralıklar: kilo BMI 18,5–24,9; kalori hedefin ±%10'u;
     uyku 7–9 saat; yağ oranı ACE'nin fit–ortalama bandı */
  const wBand = h > 0 ? [18.5*h*h, 24.9*h*h] : null;
  const kBand = program ? [program.kcal*0.9, program.kcal*1.1] : null;
  const fT = p.sex === "female" ? [14,21,25,32] : p.sex === "male" ? [6,14,18,25] : [10,17.5,21.5,28.5];

  const card = (title, count, chart, note) => `<section>
    <h2>${title}${count ? ` <span class="count">${count}</span>` : ""}</h2>
    ${chart}${note || ""}
  </section>`;

  return `
  ${weeklySummary()}
  ${card("Kilo", delta !== null ? `${delta>0?"+":""}${fmtN(+delta.toFixed(1))} kg` : "",
    trendChart(w, { color:"weight", dec:1, unit:"kg", average:true, band:wBand, label:"kilo trendi" }),
    w.length >= 2 ? bandNote(`Bant sağlıklı kilo aralığın${wBand ? ` (${Math.round(wBand[0])}–${Math.round(wBand[1])} kg)` : ""}. Kesikli çizgi 7 günlük ortalama: günlük dalgalanma su ve glikojenden gelir, asıl yön ortalamada görünür.`) : "")}
  ${card("Kalori", `son ${kcal.length} gün`,
    trendChart(kcal, { color:"kcal", kind:"bar", unit:"kcal", band:kBand, label:"günlük kalori" }),
    kcal.length >= 2 && kBand ? bandNote(`Bant hedefin ±%10'u: ${Math.round(kBand[0])}–${Math.round(kBand[1])} kcal.`) : "")}
  ${card("Uyku", `son ${sleep.length} gün`,
    trendChart(sleep, { color:"sleep", kind:"bar", dec:1, unit:"sa", band:sleepBand(), label:"günlük uyku" }),
    sleep.length >= 2 ? bandNote(`Bant senin uyku hedefin: ${sleepBand()[0]}–${sleepBand()[1]} saat.`) : "")}
  ${card("Yağ oranı", yag.length >= 2 ? `${(yag[yag.length-1].v - yag[0].v) > 0 ? "+" : ""}${fmtN(+(yag[yag.length-1].v - yag[0].v).toFixed(1))} puan` : "",
    yag.length >= 2 ? trendChart(yag, { color:"fat", dec:1, unit:"%", band:[fT[1], fT[3]], label:"yağ oranı" })
      : `<div class="empty">Bugün sekmesindeki Vücut ölçüleri bölümünden yağ oranını girdikçe grafik oluşur.${yag.length ? " Şu an 1 ölçüm var." : ""}</div>`,
    yag.length >= 2 ? (() => {
      const v = yag[yag.length-1].v, inside = v >= fT[1] && v <= fT[3];
      return bandNote(`Fit–ortalama aralığı %${fmtN(fT[1])}–${fmtN(fT[3])} (ACE); ${inside ? "şu an bu aralıktasın" : v < fT[1] ? "şu an bu aralığın altındasın" : "şu an bu aralığın üstündesin"}. Ev tartılarının ölçümü günden güne birkaç puan oynar; haftada bir, aynı saatte ölç.`);
    })() : "")}
  ${bel.length >= 2 ? card("Bel çevresi", `${fmtN(+(bel[bel.length-1].v - bel[0].v).toFixed(1))} cm`,
    trendChart(bel, { color:"waist", dec:1, unit:"cm", label:"bel çevresi" })) : ""}`;
}
