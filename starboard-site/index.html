.oc-m b{display:block;font-size:17px;font-weight:800;line-height:1.3}
.oc-m i{display:block;font-style:normal;font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.oc-c{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 2px var(--line);color:transparent}
.oc-c .ico{width:15px;height:15px}
.oc.on{box-shadow:inset 0 0 0 2px var(--band);background:color-mix(in srgb,var(--band) 7%,var(--surface))}
.oc.on .oc-c{background:var(--band);box-shadow:none;color:var(--on-brand)}

/* büyük sayı ve metin */
.on-num{display:flex;align-items:baseline;justify-content:center;gap:10px;padding:18px 0 6px}
.on-num input{width:4.2ch;min-width:0;box-sizing:content-box;padding:6px 10px;text-align:center;font-size:56px;font-weight:900;letter-spacing:-1.5px;line-height:1.1;
  background:transparent;border:0;border-bottom:3px solid var(--line);border-radius:0;box-shadow:none;color:var(--ink);-moz-appearance:textfield;appearance:textfield}
.on-num input::-webkit-outer-spin-button,.on-num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.on-num input:focus{outline:none;border-bottom-color:var(--band)}
.on-num input::placeholder{color:var(--track);opacity:1}
.on-num span{font-size:20px;font-weight:800;color:var(--muted)}
.on-text{font-size:22px;font-weight:800;padding:18px 18px}
.on-chips .chip{padding:12px 18px;font-size:15px}

/* karşılama ve özet */
.on-w,.on-s{align-items:center;text-align:center}
.on-w{padding-top:calc(56px + env(safe-area-inset-top))}
.on-logo{width:104px;height:104px;border-radius:30px;overflow:hidden;display:block;box-shadow:0 18px 40px rgba(255,61,110,.28);animation:starPop .6s var(--e-spring,ease) backwards}
.on-logo.sm{width:64px;height:64px;border-radius:19px;margin-top:8px}
.on-logo svg{width:100%;height:100%;display:block}
.on-w h1{font-size:40px;letter-spacing:-1.4px;margin-top:22px}
.on-s h1{margin-top:18px}
.on-tag{margin:8px 0 0;color:var(--muted);font-size:16px;line-height:1.45}
.on-feat{list-style:none;padding:0;margin:34px 0 0;width:100%;display:flex;flex-direction:column;gap:18px;text-align:left;flex:1}
.on-feat li{display:flex;gap:14px;align-items:flex-start;animation:pageIn .5s var(--e-out,ease) backwards}
.on-feat li:nth-child(2){animation-delay:.08s}
.on-feat li:nth-child(3){animation-delay:.16s}
.on-feat b{display:block;font-size:16.5px;font-weight:800;line-height:1.3}
.on-feat i{display:block;font-style:normal;font-size:14px;color:var(--muted);line-height:1.45;margin-top:2px}
.on-w .on-nav,.on-s .on-nav{width:100%}
.on-foot{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.5}
.os-k{margin-top:22px;display:flex;flex-direction:column;align-items:center}
.os-k b{font-size:68px;font-weight:900;letter-spacing:-2.5px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.os-k span{font-size:14px;font-weight:700;color:var(--muted);margin-top:6px}
.os-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;margin-top:22px}
.os-t{background:var(--surface);border-radius:20px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.os-t b{font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1.1}
.os-t small{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0}
.os-t i{font-style:normal;font-size:12.5px;color:var(--muted);font-weight:700}
.os-p{display:flex;align-items:center;gap:14px;text-align:left;width:100%;margin-top:10px;background:var(--surface);border-radius:20px;padding:14px 16px}
.os-p > span:not(.ico-wrap){flex:1;min-width:0}
.os-p b{display:block;font-size:16px;font-weight:800;line-height:1.3}
.os-p i{display:block;font-style:normal;font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.on-s .on-nav{margin-top:auto;padding-top:22px}

/* ===== giriş: hareket ===== */
.on-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;--p:0}
.on-bg > i{position:absolute;width:120vmax;height:120vmax;border-radius:50%;transition:transform 1.3s var(--e-out,ease)}
.on-bg > i:nth-child(1){top:-70vmax;right:-70vmax;background:radial-gradient(closest-side,rgba(255,122,47,.30),transparent);
  transform:translate(calc(var(--p) * -55vw),calc(var(--p) * 40vh));animation:obBreath 9s ease-in-out infinite alternate}
.on-bg > i:nth-child(2){bottom:-80vmax;left:-70vmax;background:radial-gradient(closest-side,rgba(255,61,110,.24),transparent);
  transform:translate(calc(var(--p) * 60vw),calc(var(--p) * -30vh));animation:obBreath 11s ease-in-out -4s infinite alternate}
@keyframes obBreath{from{scale:1}to{scale:1.18}}
.on-bg > b{position:absolute;color:var(--star-tile,#FFB020);opacity:0;animation:obTw 4.2s ease-in-out infinite;
  transition:translate 1.3s var(--e-out,ease);translate:calc(var(--p) * -60px) calc(var(--p) * 24px)}
.on-bg > b .ico{width:100%;height:100%;display:block}
.on-bg > b:nth-of-type(1){width:14px;height:14px;top:9%;left:12%}
.on-bg > b:nth-of-type(2){width:9px;height:9px;top:17%;left:78%;animation-delay:-1.1s}
.on-bg > b:nth-of-type(3){width:11px;height:11px;top:42%;left:90%;animation-delay:-2.3s}
.on-bg > b:nth-of-type(4){width:8px;height:8px;top:63%;left:7%;animation-delay:-3.1s}
.on-bg > b:nth-of-type(5){width:12px;height:12px;top:80%;left:70%;animation-delay:-.6s}
.on-bg > b:nth-of-type(6){width:7px;height:7px;top:30%;left:34%;animation-delay:-1.9s}
@keyframes obTw{0%,100%{opacity:0;scale:.5;rotate:0deg}50%{opacity:.55;scale:1;rotate:45deg}}
main.on{position:relative;z-index:1;transition:opacity .3s ease,transform .3s var(--e-out,ease),filter .3s ease}
main.on.bye{opacity:0;transform:scale(1.04);filter:blur(6px)}

.on-top{transition:opacity .4s ease,transform .5s var(--e-out,ease)}
.on-top.hide{opacity:0;transform:translateY(-14px);pointer-events:none}
.on-bar i{position:relative;overflow:hidden;transition:width .6s var(--e-out,ease)}
.on-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  transform:translateX(-100%);animation:obSheen 2.2s ease-in-out infinite}
@keyframes obSheen{60%,100%{transform:translateX(100%)}}

.on-stage{flex:1;display:flex;flex-direction:column;min-height:0}
.on-q{animation:none}
.on-w.on-q,.on-s.on-q{display:flex;flex-direction:column;align-items:center;text-align:center}
.on-w{padding-top:6px}
.on-q.in :is(h1,.on-sub,.on-tag,.oc,.on-num,.on-text,.av-field,.os-k,.os-t,.os-p,.metric-note,.on-foot,.on-lw),
.on-q.in .on-chips .chip,.on-q.in .on-feat li{
  animation:obRise .6s var(--e-out,ease) backwards;animation-delay:calc(60ms + var(--i,0) * 55ms)}
.on-q.in.rev :is(h1,.on-sub,.on-tag,.oc,.on-num,.on-text,.av-field,.os-k,.os-t,.os-p,.metric-note,.on-foot),
.on-q.in.rev .on-chips .chip{animation-name:obRiseRev}
@keyframes obRise{from{opacity:0;transform:translate(26px,10px) scale(.97);filter:blur(5px)}}
@keyframes obRiseRev{from{opacity:0;transform:translate(-26px,10px) scale(.97);filter:blur(5px)}}
.on-q.out{animation:obOut .2s cubic-bezier(.4,0,1,1) forwards}
.on-q.out.rev{animation-name:obOutRev}
@keyframes obOut{to{opacity:0;transform:translateX(-34px) scale(.98);filter:blur(6px)}}
@keyframes obOutRev{to{opacity:0;transform:translateX(34px) scale(.98);filter:blur(6px)}}

.on-nav{transition:opacity .3s ease,transform .4s var(--e-out,ease)}
.on-nav.hide{opacity:0;transform:translateY(16px);pointer-events:none}
.on-nav #ob-next{position:relative;overflow:hidden}
.on-nav #ob-next::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:36%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent);animation:obBtn 3.4s ease-in-out 1.2s infinite}
@keyframes obBtn{0%{left:-40%}38%,100%{left:120%}}

/* kart seçimi */
.ocs.picked .oc:not(.on){opacity:.38;transform:scale(.97)}
.ocs.picked .oc.on{animation:obPick .36s var(--e-spring,ease)}
@keyframes obPick{40%{transform:scale(1.035)}}
.oc.on .oc-c{animation:obTick .42s var(--e-spring,ease)}
@keyframes obTick{from{transform:scale(.2) rotate(-40deg)}}
.oc .ico-wrap{transition:transform .3s var(--e-spring,ease)}
.oc.on .ico-wrap{transform:scale(1.1) rotate(-4deg)}

/* büyük rakam */
.on-num.bump input{animation:obBump .2s var(--e-out,ease)}
@keyframes obBump{40%{transform:scale(1.07)}}
.on-num.shake{animation:obShake .34s ease}
@keyframes obShake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.on-num input{transition:border-color .25s ease}
#ob-err.show{animation:obRise .3s var(--e-out,ease)}

/* canlı logo */
.lg-b{transform-box:fill-box;transform-origin:50% 100%;animation:lgGrow .7s var(--e-spring,ease) backwards}
.lg-b:nth-of-type(1){animation-delay:.28s}.lg-b:nth-of-type(2){animation-delay:.38s}
.lg-b:nth-of-type(3){animation-delay:.48s}.lg-b:nth-of-type(4){animation-delay:.58s}
@keyframes lgGrow{from{transform:scaleY(0)}}
.lg-s{transform-box:fill-box;transform-origin:center;animation:lgStar .8s var(--e-spring,ease) .8s backwards,lgTw 2.8s ease-in-out 1.7s infinite}
@keyframes lgStar{from{transform:scale(0) rotate(-90deg)}}
@keyframes lgTw{50%{transform:scale(1.22) rotate(18deg)}}
.on-logo{animation:lgIn .7s var(--e-spring,ease) backwards}
@keyframes lgIn{from{opacity:0;transform:scale(.55) rotate(-10deg)}}

/* ara sahne */
.on-build{justify-content:center;padding-bottom:12vh}
.on-lw{position:relative;width:104px;height:104px;display:block}
.on-orbit{position:absolute;inset:-34px;border-radius:50%;animation:obSpin 2.6s linear infinite}
.on-orbit i{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--grad);left:50%;top:0;margin-left:-5px}
.on-orbit i:nth-child(2){left:7%;top:72%;width:7px;height:7px;opacity:.7}
.on-orbit i:nth-child(3){left:88%;top:72%;width:5px;height:5px;opacity:.5}
@keyframes obSpin{to{transform:rotate(360deg)}}
.on-build .lg-b{animation:lgLoop .9s ease-in-out infinite alternate}
.on-build .lg-b:nth-of-type(1){animation-delay:0s}.on-build .lg-b:nth-of-type(2){animation-delay:.12s}
.on-build .lg-b:nth-of-type(3){animation-delay:.24s}.on-build .lg-b:nth-of-type(4){animation-delay:.36s}
@keyframes lgLoop{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
.on-build h1{margin-top:44px}
#ob-bl.flip{animation:obFlip .4s var(--e-out,ease)}
@keyframes obFlip{from{opacity:0;transform:translateY(10px)}}

/* özet */
.on-s .os-t .ico-wrap{animation:starPop .6s var(--e-spring,ease) backwards;animation-delay:calc(260ms + var(--i,0) * 55ms)}
/* Giren parçalar yana kayarken sayfa yatayda taşmasın. */
main.on{overflow-x:clip}

/* ===== uygulama içi sahne geçişleri ===== */
main{overflow-x:clip}
@keyframes pageInX{from{opacity:0;transform:translate(24px,8px) scale(.985);filter:blur(5px)}}
@keyframes pageInXr{from{opacity:0;transform:translate(-24px,8px) scale(.985);filter:blur(5px)}}
main.page-in > *{animation:pageInX .52s var(--e-out) backwards}
main.page-in.rev > *{animation-name:pageInXr}
main.page-in > *:nth-child(1){animation-delay:20ms}
main.page-in > *:nth-child(2){animation-delay:70ms}
main.page-in > *:nth-child(3){animation-delay:120ms}
main.page-in > *:nth-child(4){animation-delay:170ms}
main.page-in > *:nth-child(5){animation-delay:215ms}
main.page-in > *:nth-child(n+6){animation-delay:255ms}
main.page-in.k-seg > .seg,main.page-in.k-day > .wk,main.page-in.k-day > .wk-back{animation:none}
main.page-out > *{animation:pageOutX .17s cubic-bezier(.4,0,1,1) forwards}
main.page-out.rev > *{animation-name:pageOutXr}
main.page-out.k-seg > .seg,main.page-out.k-day > .wk{animation:none}
@keyframes pageOutX{to{opacity:0;transform:translateX(-30px) scale(.985);filter:blur(5px)}}
@keyframes pageOutXr{to{opacity:0;transform:translateX(30px) scale(.985);filter:blur(5px)}}
header.page-in .htext{animation:pageIn .45s var(--e-out) backwards}
header.page-in .gear{animation:starPop .5s var(--e-spring) backwards}

/* hedef satırları sırayla düşer */
main.page-in .gl .g{animation:pageIn .45s var(--e-out) backwards}
main.page-in .gl .g:nth-child(1){animation-delay:.16s}
main.page-in .gl .g:nth-child(2){animation-delay:.2s}
main.page-in .gl .g:nth-child(3){animation-delay:.24s}
main.page-in .gl .g:nth-child(4){animation-delay:.28s}
main.page-in .gl .g:nth-child(5){animation-delay:.32s}
main.page-in .gl .g:nth-child(6){animation-delay:.36s}
main.page-in .gl .g:nth-child(n+7){animation-delay:.4s}
main.page-in .wk-d{animation:pageIn .4s var(--e-out) backwards}
main.page-in .wk-d:nth-child(2){animation-delay:25ms}
main.page-in .wk-d:nth-child(3){animation-delay:50ms}
main.page-in .wk-d:nth-child(4){animation-delay:75ms}
main.page-in .wk-d:nth-child(5){animation-delay:100ms}
main.page-in .wk-d:nth-child(6){animation-delay:125ms}
main.page-in .wk-d:nth-child(7){animation-delay:150ms}
main.page-in.k-day .wk-d{animation:none}
.wk-d{transition:background .25s var(--e-out),color .2s}
.wk-d[aria-current="true"] b{animation:obBump .3s var(--e-out)}

/* alt menü: kayan işaret */
.tabbar{isolation:isolate}
.tabbar button[data-tab]::before{display:none}
.tab-ind{position:absolute;left:0;top:10px;width:46px;height:30px;border-radius:999px;z-index:-1;opacity:0;pointer-events:none;
  background:var(--tint);background:color-mix(in srgb,var(--band) 13%,transparent);
  transition:transform .42s var(--e-spring),opacity .2s}
.tabbar .fab svg{transition:transform .35s var(--e-spring)}
.tabbar .fab:active svg{transform:rotate(90deg)}

/* hedef satırı: giriş alanı açılır / kapanır */
.g-b{display:grid;grid-template-rows:1fr;padding:0;animation:none}
.g-bi{min-height:0;padding:2px 2px 18px;margin:0 -2px}
.g-b.anim{animation:gOpen .38s var(--e-out)}
.g-b.anim .g-bi,.g.closing .g-bi{overflow:hidden}
.g-b.anim .g-bi > *{animation:pageIn .42s var(--e-out) .06s backwards}
@keyframes gOpen{from{grid-template-rows:0fr;opacity:0}}
.g.closing .g-b{animation:gClose .19s cubic-bezier(.4,0,1,1) forwards}
@keyframes gClose{to{grid-template-rows:0fr;opacity:0}}
.g.closing .task-chev{transform:none}
.g-h .ico-wrap{transition:transform .3s var(--e-spring)}
.g.open .g-h .ico-wrap{transform:scale(1.08) rotate(-4deg)}
.g-h:active .g-m{transform:translateX(2px)}
.g-m{transition:transform .15s var(--e-out)}

/* tamamlanma anı */
.g.just{animation:gDone .9s var(--e-out)}
@keyframes gDone{0%{background:color-mix(in srgb,var(--good-vivid) 18%,transparent);box-shadow:0 0 0 8px color-mix(in srgb,var(--good-vivid) 18%,transparent);border-radius:14px}
  100%{background:transparent;box-shadow:0 0 0 8px transparent;border-radius:14px}}
.g.just .g-ok{animation:starPop .6s var(--e-spring)}
.gh-fg{transition:stroke-dashoffset .9s var(--e-out),stroke .4s}
.gh-n.bump b{animation:obBump .45s var(--e-spring)}
.gh.full .gh-ring{animation:ghGlow 2.6s ease-in-out infinite}
@keyframes ghGlow{50%{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--dtoday) 70%,transparent))}}
.gh.full.past .gh-ring{animation:none}

/* alttan açılan paneller */
.sheet-bg{animation:p-fade .28s ease-out;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.sheet{animation:shUp .46s var(--e-out)}
@keyframes shUp{from{transform:translateY(46%);opacity:0}}
.sheet > *:not(.sheet-h){animation:pageIn .45s var(--e-out) .1s backwards}
.sheet-bg.out{animation:shFade .24s ease-in forwards;pointer-events:none}
.sheet-bg.out .sheet{animation:shDown .24s cubic-bezier(.4,0,1,1) forwards}
@keyframes shFade{to{opacity:0}}
@keyframes shDown{to{transform:translateY(40%);opacity:0}}


/* ===== giriş: gruplu ekranlar ===== */
.og{margin-top:26px}
.on-body > .og:first-child{margin-top:0}
.og-t{font-size:13px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin:0 2px 10px}
.og-t span{text-transform:none;letter-spacing:0;font-weight:600;opacity:.8;margin-left:4px}
.og-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.og-row .og{margin-top:26px;min-width:0}
.og input{width:100%}
.on-q.in .og{animation:obRise .6s var(--e-out,ease) backwards;animation-delay:calc(60ms + var(--i,0) * 70ms)}
.on-q.in.rev .og{animation-name:obRiseRev}
.og.reveal,#og-plan.reveal > .og{animation:obRise .5s var(--e-out,ease) backwards}
#og-plan.reveal > .og:nth-child(2){animation-delay:70ms}
#og-plan.reveal > .og:nth-child(3){animation-delay:140ms}
.ocs.tri{flex-direction:row;gap:8px}
.ocs.tri .oc{flex:1 1 0;min-width:0;flex-direction:column;gap:8px;padding:14px 6px 12px;text-align:center;min-height:0}
.ocs.tri .oc-m b{font-size:14.5px}
.ocs.tri .oc-c{display:none}
.ocs.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ocs.duo .oc{min-height:60px;padding:10px 12px;gap:10px;min-width:0}
.ocs.duo .oc-m b{font-size:14.5px;overflow-wrap:anywhere}
.ocs.duo .oc-c{display:none}
.ocs.duo .ico-wrap{flex:0 0 auto}
.og input.shake{animation:obShake .34s ease}
#ob-err{margin-top:18px}

/* dönen rakamlar */
.rd{display:inline-block;height:1em;line-height:1;overflow:hidden;vertical-align:top}
.rd > span{display:block;line-height:1;transition:transform .32s var(--e-out,ease);will-change:transform}
.rs{display:inline-block;line-height:1;vertical-align:top}

/* cetvel */
.rl{background:var(--surface);border-radius:24px;padding:16px 0 10px;overflow:hidden}
.rl-v{all:unset;box-sizing:border-box;display:flex;align-items:baseline;justify-content:center;gap:8px;width:100%;cursor:text;-webkit-tap-highlight-color:transparent}
.rl-v:focus-visible{outline:2px solid var(--band);outline-offset:-4px;border-radius:14px}
.rl-n{font-size:52px;font-weight:900;letter-spacing:-1.5px;line-height:1;color:var(--ink);transition:transform .2s var(--e-spring,ease),color .2s}
.rl.live .rl-n{transform:scale(1.06);color:var(--band)}
.rl-v > span{font-size:18px;font-weight:800;color:var(--muted)}
.rl-in{width:5ch;font-size:44px;font-weight:900;text-align:center;padding:2px 6px;border-radius:14px}
.rl-w{position:relative;margin-top:10px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent)}
.rl-w::after{content:"";position:absolute;left:50%;top:0;width:4px;height:44px;margin-left:-2px;border-radius:2px;background:var(--grad);pointer-events:none;
  box-shadow:0 0 0 3px var(--surface)}
.rl-s{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;cursor:grab;touch-action:pan-x;outline:none}
.rl-s::-webkit-scrollbar{display:none}
.rl-s.drag{scroll-snap-type:none;cursor:grabbing}
.rl-s:focus-visible{box-shadow:inset 0 -3px 0 var(--band)}
.rl-t{display:flex;width:max-content;padding:0 calc(50% - var(--tw) / 2);height:66px;user-select:none}
.rl-t i{flex:0 0 var(--tw);width:var(--tw);position:relative;scroll-snap-align:center}
.rl-t i::before{content:"";position:absolute;left:50%;top:0;width:2px;margin-left:-1px;height:14px;border-radius:1px;background:var(--line)}
.rl-t i.m::before{height:24px;background:var(--muted);opacity:.55}
.rl-t i.M::before{height:34px;background:var(--ink);opacity:.8}
.rl-t i.M::after{content:attr(data-l);position:absolute;top:42px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--muted);font-style:normal}
.on-q.in .rl-w{animation:p-fade .6s ease .25s backwards}

/* ===== uygulama: kaydırdıkça beliren kartlar ===== */
.rv{opacity:0;transform:translateY(30px) scale(.975)}
main.page-in > .rv{animation:none}
.rv-in{animation:rvIn .65s var(--e-out) backwards}
@keyframes rvIn{from{opacity:0;transform:translateY(30px) scale(.975);filter:blur(4px)}}
.rv-in .item,.rv-in .g{animation:pageIn .5s var(--e-out) backwards}
.rv-in .item:nth-child(2){animation-delay:50ms}.rv-in .item:nth-child(3){animation-delay:100ms}
.rv-in .item:nth-child(4){animation-delay:150ms}.rv-in .item:nth-child(n+5){animation-delay:200ms}

/* çubuklar dolarak gelir */
@keyframes barGrow{from{width:0}}
main.page-in .task-bar i,main.page-in .mbar i,.rv-in .task-bar i,.rv-in .mbar i{animation:barGrow .95s var(--e-out) .28s backwards}

/* grafikler çizilerek gelir */
.ch-line{stroke-dasharray:1;stroke-dashoffset:0}
.ch-pre .ch-line{stroke-dashoffset:1}
.ch-pre .ch-area,.ch-pre .ch-end,.ch-pre .ch-avg,.ch-pre .ch-end-t,.ch-pre .ch-bar{opacity:0}
.draw .ch-line{animation:chDraw 1.35s var(--e-out) backwards}
@keyframes chDraw{from{stroke-dashoffset:1}}
.draw .ch-area{animation:p-fade .9s ease .55s backwards}
.draw .ch-avg{animation:p-fade .6s ease .9s backwards}
.draw .ch-end{transform-box:fill-box;transform-origin:center;animation:chDot .5s var(--e-spring) 1.05s backwards}
@keyframes chDot{from{transform:scale(0);opacity:0}}
.draw .ch-end-t{animation:pageIn .5s var(--e-out) 1.15s backwards}
.draw .ch-bar{transform-box:fill-box;transform-origin:50% 100%;animation:chBar .6s var(--e-spring) backwards;animation-delay:calc(var(--i,0) * 16ms)}
@keyframes chBar{from{transform:scaleY(0);opacity:0}}
.draw .ch-grid{animation:p-fade .5s ease backwards}

/* takvim hücreleri dalga gibi belirir */
main.page-in .cal-day{animation:calPop .42s var(--e-spring) backwards}
@keyframes calPop{from{opacity:0;transform:scale(.6)}}
main.page-in .cal-day:nth-child(7n+1){animation-delay:.12s}
main.page-in .cal-day:nth-child(7n+2){animation-delay:.15s}
main.page-in .cal-day:nth-child(7n+3){animation-delay:.18s}
main.page-in .cal-day:nth-child(7n+4){animation-delay:.21s}
main.page-in .cal-day:nth-child(7n+5){animation-delay:.24s}
main.page-in .cal-day:nth-child(7n+6){animation-delay:.27s}
main.page-in .cal-day:nth-child(7n){animation-delay:.3s}

/* basınca eğilen kartlar */
.oc,.os-t,.os-p,.own,.eve,.gh-s{will-change:transform}
.gh-n b.roll{display:inline-block}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
</style>

<script>
"use strict";

/* ---------------- depolama ---------------- */
const KEY = "saglik-takip-v1";

async function loadState(){
  if (window.storage) {
    try { const r = await window.storage.get(KEY); if (r && r.value) return JSON.parse(r.value); }
    catch(e){ /* kayıt yok */ }
  }
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return null;
}

async function saveState(s){
  calcReset();                 /* veri değişti: gün puanları yeniden hesaplansın */
  const v = JSON.stringify(s);
  if (window.storage) { try { await window.storage.set(KEY, v); } catch(e){} }
  try { localStorage.setItem(KEY, v); } catch(e){}
}

/* ---------------- tarih ---------------- */
const dayKey = d => new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today = () => dayKey(new Date());
const shiftDays = (key, n) => { const d = new Date(key + "T12:00:00"); d.setDate(d.getDate() + n); return dayKey(d); };
const isoWeekday = key => { const w = new Date(key + "T12:00:00").getDay(); return w === 0 ? 7 : w; };
const prettyDate = key => new Date(key + "T12:00:00").toLocaleDateString("tr-TR", { day:"numeric", month:"long" });
const weekdayName = key => new Date(key + "T12:00:00").toLocaleDateString("tr-TR", { weekday:"long" });
const WD_NAMES = ["","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"];
/* Kısaltmalar ayrı: "Pazartesi".slice(0,3) ile "Pazar".slice(0,3) aynı çıkıyor. */

/* ---------------- program hesabı ---------------- */
const ACTIVITY = {
  sedentary:{label:"Hareketsiz", d:"masa başı, spor yok", m:1.20},
  light:{label:"Az hareketli", d:"haftada 1-3 gün hafif spor", m:1.375},
  moderate:{label:"Orta", d:"haftada 3-5 gün spor", m:1.55},
  active:{label:"Aktif", d:"haftada 6-7 gün spor", m:1.725},
  veryActive:{label:"Çok aktif", d:"günde iki antrenman ya da bedensel iş", m:1.90}
};
const GOAL = {
  lose:{label:"Yağ kaybı", m:0.82, protein:2.4, range:[-1.00,-0.35]},
  maintain:{label:"Koruma", m:1.00, protein:2.0, range:[-0.30,0.30]},
  gain:{label:"Kas kazanımı", m:1.12, protein:2.2, range:[0.15,0.50]}
};

/* Cinsiyete bağlı sabitler. Belirtilmemişse iki değerin ortalaması kullanılır. */
const sexK = (sex, m, f) => sex === "male" ? m : sex === "female" ? f : (m + f) / 2;

/* Avatarlar: herkes seçebilir. f = yüz konumu [x, y, ölçek] (tepki ifadeleri için). */

];
const AV_CATS = [["human","İnsan"],["sport","Sporcu"],["nature","Doğa"],["space","Uzay"]];
const AV_COLORS = [["#FF5A3C","Mercan"],["#FF9500","Turuncu"],["#E8B400","Sarı"],["#16B86A","Yeşil"],
  ["#00AFA0","Turkuaz"],["#2F7BEA","Mavi"],["#7C4DFF","Mor"],["#E84A93","Pembe"]];
const avKey = p => AVATARS.some(a => a[0] === p.avatar) ? p.avatar : p.sex === "female" ? "f" : p.sex === "male" ? "m" : "n";
const avSym = k => k === "m" ? "i-body" : k === "f" ? "i-body-f" : "i-av-" + k;
const avColor = p => p.avColor || (p.sex === "female" ? "#E84A93" : p.sex === "male" ? "#2F7BEA" : "#7C4DFF");
function bodyIcon(p){ return avSym(avKey(p)); }
const sexClass = () => "custom";

function avatarPicker(cur, idp){
  const curCat = (AVATARS.find(a => a[0] === cur) || AVATARS[0])[3];
  return `<div class="av-cats" role="tablist" aria-label="Avatar sınıfları">${AV_CATS.map(([c,l]) =>
      `<button type="button" class="chip${c === curCat ? " sel" : ""}" role="tab" aria-selected="${c === curCat}" data-avcat="${c}" data-avp="${idp}">${l}</button>`).join("")}</div>
    ${AV_CATS.map(([c,l]) => `<div class="av-pick" role="radiogroup" aria-label="${l} avatarları" data-avgrid="${c}" data-avp="${idp}"${c === curCat ? "" : " hidden"}>
      ${AVATARS.filter(a => a[3] === c).map(([k,n]) =>
        `<button type="button" class="av${cur === k ? " on" : ""}" data-av="${k}" data-avp="${idp}" role="radio" aria-checked="${cur === k}" aria-label="${n}" title="${n}">
          <svg viewBox="0 0 48 64" aria-hidden="true"><use href="#${avSym(k)}"/></svg></button>`).join("")}</div>`).join("")}`;
}
function colorPicker(cur, idp){
  return `<div class="av-cols" role="radiogroup" aria-label="Avatar rengi">${AV_COLORS.map(([c,l]) =>
    `<button type="button" class="avc${cur === c ? " on" : ""}" data-avc="${c}" data-avp="${idp}" role="radio" aria-checked="${cur === c}"
      aria-label="${l}" style="--c:${c}"></button>`).join("")}</div>`;
}
function wireAvatar(idp, onPick, root){
  const r = root || app;
  r.querySelectorAll(`[data-avcat][data-avp="${idp}"]`).forEach(b => b.onclick = () => {
    r.querySelectorAll(`[data-avcat][data-avp="${idp}"]`).forEach(x => { x.classList.toggle("sel", x === b); x.setAttribute("aria-selected", x === b); });
    r.querySelectorAll(`[data-avgrid][data-avp="${idp}"]`).forEach(g => { g.hidden = g.dataset.avgrid !== b.dataset.avcat; });
  });
  r.querySelectorAll(`[data-av][data-avp="${idp}"]`).forEach(b => b.onclick = () => {
    r.querySelectorAll(`[data-av][data-avp="${idp}"]`).forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-checked", x === b); });
    onPick(b.dataset.av);
  });
}
function wireColor(idp, onPick, root){
  const r = root || app;
  r.querySelectorAll(`[data-avc][data-avp="${idp}"]`).forEach(b => b.onclick = () => {
    r.querySelectorAll(`[data-avc][data-avp="${idp}"]`).forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-checked", x === b); });
    onPick(b.dataset.avc);
  });
}

function buildProgram(profile, weightKg, adjustment){
  const bf = profile.bodyFat;
  const lbm = (bf > 0 && bf < 70) ? weightKg * (1 - bf/100) : null;
  const bmr = lbm !== null
    ? 370 + 21.6 * lbm
    : 10*weightKg + 6.25*profile.height - 5*profile.age + sexK(profile.sex, 5, -161);

  const tdee = bmr * ACTIVITY[profile.activity].m;
  const goal = GOAL[profile.goal];
  const floor = Math.max(bmr * 0.95, sexK(profile.sex, 1500, 1200));
  const raw = tdee * goal.m + (adjustment || 0);
  const floored = raw < floor;
  const kcal = Math.round(Math.max(raw, floor));

  const protein = Math.round(Math.min((lbm !== null ? lbm : weightKg*0.8) * goal.protein, weightKg*2.5));
  const fat = Math.round(kcal * 0.25 / 9);
  const carb = Math.round(Math.max((kcal - protein*4 - fat*9) / 4, 0));

  return {
    bmr:Math.round(bmr), tdee:Math.round(tdee), lbm, kcal, protein, fat, carb,
    water: Math.round(weightKg * 35), floored,
    training: trainingPlan(profile)
  };
}

const PATTERN = { 3:[1,3,5], 4:[1,2,4,5], 5:[1,2,3,5,6] };

/* Antrenman günleri: kullanıcı seçtiyse onunkiler, yoksa varsayılan desen. */
function planDays(profile, freq){
  const d = ((profile && profile.days) || []).slice().sort((a,b) => a-b);
  if (d.length === freq) return d;
  if (d.length > freq) return d.slice(0, freq);
  return PATTERN[freq] || PATTERN[3];
}

function sessionIcon(title, venue){
  const t = title.toLowerCase();
  if (/aktif dinlenme/.test(t)) return "walk";
  if (/^dinlenme/.test(t)) return "rest";
  if (/akış|esneklik|kalça|mobilite/.test(t)) return "yoga";
  if (/teknik|dayanıklılık|aralıklı/.test(t) && venue === "swim") return "swim";
  if (/skill|handstand/.test(t)) return "skill";
  if (/bacak|alt|squat|deadlift/.test(t)) return "legs";
  if (/core/.test(t)) return "core";
  if (/koşu|sprint|hiit/.test(t)) return "run";
  if (/push|itiş|bench|omuz press/.test(t)) return "push";
  if (/pull|çekiş/.test(t)) return "pull";
  if (/üst/.test(t)) return "pull";
  if (venue === "swim") return "swim";
  if (venue === "mobility") return "yoga";
  return "fullbody";
}

/* Varsayılan program: kategori içinde aktivite seviyesine en yakın gün sayısı. */
function defaultProgramId(venue, activity, days){
  /* Gün seçtiyse program frekansı oradan; yoksa aktivite seviyesinden tahmin. */
  const want = (days && days.length >= 3) ? Math.max(3, Math.min(5, days.length))
             : (activity === "sedentary" || activity === "light") ? 3
             : activity === "moderate" ? 4 : 5;
  const inVenue = Object.entries(PROGRAMS).filter(([,p]) => p.venue === venue);
  if (!inVenue.length) return "gym_ul4";
  inVenue.sort((a,b) => Math.abs(a[1].freq - want) - Math.abs(b[1].freq - want));
  return inVenue[0][0];
}

/* Program kapalı: kullanıcı spor programı istemiyor. Günler boş kalır,
   öneri üretilmez; serbest antrenman kaydı yine de yapılabilir. */
const noPlan = p => !!(p && p.noPlan);
function customCount(p){
  const c = p && p.custom && p.custom.days;
  return c ? Object.values(c).filter(d => d && d.ex && d.ex.length).length : 0;
}

function trainingPlan(profile){
  if (noPlan(profile)){
    const days = [];
    for (let d = 1; d <= 7; d++) days.push({ wd:d, t:"", b:"", icon:"rest" });
    return { id:null, title:"Program yok", freq:0, desc:"", note:"",
             cardio:"", none:true, days };
  }
  const goal = profile.goal;
  const cardio = { lose:"Haftada 3 × 30 dk tempolu kardiyo, antrenman sonrası.",
                   maintain:"Haftada 2 × 25 dk hafif kardiyo yeterli.",
                   gain:"Kardiyoyu haftada 2 × 20 dk ile sınırla." }[goal];

  /* Kullanıcının kendi yazdığı program: hareketler hazır programlarla aynı
     biçime ("Ad 3×10") çevrilir, böylece kayıt ve antrenman modu aynen çalışır. */
  if (profile.programId === "custom" && customCount(profile)){
    const days = [];
    for (let d = 1; d <= 7; d++){
      const c = profile.custom.days[d];
      const on = c && c.ex && c.ex.length;
      const day = on ? { wd:d, t:c.t || "Antrenman", b:c.ex.map(x => `${x.n} ${x.s}×${x.r}`).join(" · ") }
                     : { wd:d, t:"Dinlenme", b:"" };
      day.icon = sessionIcon(day.t, "gym");
      days.push(day);
    }
    return { id:"custom", custom:true, title:"Kendi programın", freq:customCount(profile),
             desc:"", note:"Bunu sen yazdın. Hazır programlardan birine dönmek için yukarıdan seç.", cardio, days };
  }

  const id = PROGRAMS[profile.programId] ? profile.programId
           : defaultProgramId(profile.venue || "gym", profile.activity);
  const prog = PROGRAMS[id];
  const cat = VENUE[prog.venue];
  const wds = planDays(profile, prog.freq);
  const days = [];

  for (let d = 1; d <= 7; d++){
    const i = wds.indexOf(d);
    let day;
    if (i >= 0) day = { wd:d, t:prog.s[i].t, b:applyAvoid(prog.s[i].b, profile.avoid) };
    else if (prog.freq < 5 && d === 6) day = { wd:d, t:"Aktif dinlenme", b:applyAvoid(cat.active, profile.avoid) };
    else day = { wd:d, t:"Dinlenme", b:"" };
    day.icon = sessionIcon(day.t, prog.venue);
    days.push(day);
  }

  return { id, title:`${cat.label} · ${prog.label}`, freq:prog.freq,
           desc:prog.desc, note:prog.note, cardio, days };
}

function suggestedTitles(program, key){
  const day = program.training.none ? null : program.training.days.find(d => d.wd === isoWeekday(key));
  const out = [];
  if (day) out.push(day.b ? "Antrenman: " + day.t : "Dinlenme günü — 20 dk esneme");
  out.push(program.kcal + " kcal hedefini tut");
  out.push(program.protein + " g protein al");
  out.push(program.water + " ml su iç");
  out.push(`${sleepBand()[0]}-${sleepBand()[1]} saat uyu`);
  out.push("Sabah kilo ölçümü");
  if (stepGoal()) out.push(stepGoal() + " adım at");
  return out;
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function portion(food, grams){
  const g = Math.round(grams / 5) * 5;
  if (food.unit) {
    const units = Math.max(1, Math.round(g / food.unit));
    return { text:`${food.n} — ${units} ${food.unitName}`, g: units * food.unit };
  }
  /* Gramaj değişmez (hedef tutturma bozulmasın); yakın bir porsiyon katı
     varsa yanına "≈ 2 dilim" diye yaklaşık karşılığı yazılır. */
  /* Birincil ölçüde yarımlar da olur ("≈ 0,5 kase"); ikincil ölçüde yalnız
     tam katlar ("≈ 2 tatlı kaşığı"), "≈ 0,5 bütün göğüs" gibi tuhaflıklar olmasın. */
  const P = porsOf(food);
  for (let i = 0; i < P.length; i++){
    const x = P[i], u = g / x.g;
    const r = i === 0 ? Math.round(u * 2) / 2 : Math.round(u);
    if (r >= (i === 0 ? 0.5 : 1) && r <= 12 && Math.abs(u - r) / r < 0.15)
      return { text:`${food.n} — ${g} g (≈ ${nfmt(r)} ${x.n})`, g };
  }
  return { text:`${food.n} — ${g} g`, g };
}

/* Kullanıcının günlüğüne girdiği besinlerin kaç kez geçtiği. */
function foodUsage(){
  const u = {};
  for (const k of Object.keys(state.days))
    for (const it of (state.days[k].log || [])) if (it.k) u[it.k] = (u[it.k] || 0) + 1;
  return u;
}

/* Bir besinin hangi rolü üstlenebileceği: kalorisinin çoğu hangi makrodan geliyor? */
let ROLE_CACHE = null;
function roleCandidates(role){
  if (!ROLE_CACHE){
    ROLE_CACHE = { p:[], c:[], f:[] };
    for (const [k,f] of Object.entries(FOODS)){
      const kcal = f.p*4 + f.c*4 + f.f*9;
      if (kcal < 40) continue;
      /* Eşik 0.25: baklagiller kendi karbonhidratını taşısa da protein kaynağıdır. */
      if (f.p >= 15 && f.p*4/kcal >= 0.25) ROLE_CACHE.p.push(k);
      if (f.c >= 15 && f.c*4/kcal >= 0.55) ROLE_CACHE.c.push(k);
      if (f.f >= 35 && f.f*9/kcal >= 0.60) ROLE_CACHE.f.push(k);
    }
  }
  return ROLE_CACHE[role];
}

/* Bir öğün gözü için besin seç: dışlanmışsa değiştir, "benim besinlerim" açıksa
   aynı rolü oynayan ve en çok yediğin besinle değiştir. */
function resolveSlot(orig, role, opts, used){
  const free = k => !opts.exclude.has(k) && !used.has(k) && FOODS[k];
  const byUse = list => list.slice().sort((a,b) => (opts.usage[b]||0) - (opts.usage[a]||0));

  if (opts.useMine){
    const mine = byUse(roleCandidates(role).filter(k => free(k) && (opts.usage[k]||0) >= 2));
    if (mine.length) return mine[0];
  }
  if (free(orig)) return orig;
  let alt = byUse(roleCandidates(role).filter(k => free(k) && !NO_SUGGEST.has(k)));
  if (!alt.length) alt = byUse(roleCandidates(role).filter(k => !opts.exclude.has(k) && FOODS[k]));
  /* Uygun hiçbir şey yoksa yasak besini geçirmektense boş dön. */
  return alt.length ? alt[0] : null;
}

/* Kullanıcının yediklerine en yakın kombinasyonlar başa gelsin. */
function setOrder(usage){
  return MEAL_SETS.map((s,i) => [i, s.meals.reduce((a,m) =>
      a + (usage[m.p]||0) + (usage[m.c]||0) + (usage[m.f]||0), 0)])
    .sort((a,b) => b[1] - a[1])
    .map(x => x[0]);
}

function userMeals(){
  const p = mealPrefs();
  if (!Array.isArray(p.meals) || !p.meals.length) p.meals = DEFAULT_MEALS.map(m => ({...m}));
  return p.meals.slice().sort((a,b) => (a.h ?? 12) - (b.h ?? 12));
}
function slotList(){ return userMeals().map(m => [m.id, m.name]); }
function slotLabel(id){
  const m = userMeals().find(x => x.id === id);
  return m ? m.name : (LEGACY_MEALS[id] ? LEGACY_MEALS[id].name : "Diğer");
}
function mealShares(list){
  const t = list.reduce((a,m) => a + (m.w || 1), 0) || 1;
  return list.map(m => (m.w || 1) / t);
}

/* Eski kayıtlarda geçen ama listede olmayan öğünleri geri kazandırır,
   böylece "Öğle" gibi kalemler ve onlara bağlı girişler kaybolmaz. */
function migrateMeals(){
  const p = mealPrefs();
  if (!Array.isArray(p.meals) || !p.meals.length) p.meals = DEFAULT_MEALS.map(m => ({...m}));
  const have = new Set(p.meals.map(m => m.id));
  const seen = new Set();
  for (const k of Object.keys(state.days || {}))
    for (const it of (state.days[k].log || [])) if (it.slot) seen.add(it.slot);
  for (const sId of Object.keys(p.fixed || {})) if ((p.fixed[sId] || []).length) seen.add(sId);
  let added = false;
  for (const sId of seen) if (!have.has(sId)){
    const L = LEGACY_MEALS[sId];
    p.meals.push(L ? { id:sId, ...L } : { id:sId, name:"Diğer öğün", w:20, h:12, cat:"ogle" });
    have.add(sId); added = true;
  }
  return added;
}

function mealPrefs(){
  const p = state.mealPrefs || (state.mealPrefs = { exclude:[], useMine:false, fixed:{} });
  if (!Array.isArray(p.exclude)) p.exclude = [];
  if (!p.fixed || typeof p.fixed !== "object") p.fixed = {};
  if (!p.diet) p.diet = "hepsi";
  if (!Array.isArray(p.meals) || !p.meals.length) p.meals = DEFAULT_MEALS.map(m => ({...m}));
  return p;
}

function fixedOf(slot){
  return (mealPrefs().fixed[slot] || []).filter(x => FOODS[x.k] || (state.customFoods||{})[x.k]);
}

function foodOf(k){ return FOODS[k] || (state.customFoods||{})[k]; }

  "yulafbar","sinitzel","soslumakarna","seitan","tarhana","galeta","boza","asure","iskender"]);

function foodAllowed(k, diet){
  const f = FOODS[k];
  if (!f || !diet || diet === "hepsi") return true;
  const meat = f.i === "meat" || f.i === "poultry" || HAS_MEAT.has(k);
  const fish = f.i === "fish";
  const dairyEgg = f.i === "dairy" || f.i === "egg" || HAS_DAIRY_EGG.has(k);
  switch (diet){
    case "vegan":       return !meat && !fish && !dairyEgg;
    case "vejetaryen":  return !meat && !fish;
    case "pesketaryen": return !meat;
    case "glutensiz":   return !HAS_GLUTEN.has(k);
    case "laktozsuz":   return !(f.i === "dairy" || HAS_LACTOSE.has(k));
    default: return true;
  }
}

function currentDiet(){ return mealPrefs().diet || "hepsi"; }


function solveTrio(P, C, F, tp, tc, tf, tk){
  let gp = 0, gc = 0, gf = 0;
  const capP = P.unit ? 250 : 400;
  const capC = C.c < 25 ? 500 : 350;
  /* Üç kaynak da üç makroya birden katkı verdiği için tek geçişte çözülmüyor. */
  for (let i = 0; i < 8; i++){
    gp = clamp((tp - gc*C.p/100 - gf*F.p/100) / (P.p/100), 0, capP);
    gc = clamp((tc - gp*P.c/100 - gf*F.c/100) / (C.c/100), 0, capC);
    gf = clamp((tf - gp*P.f/100 - gc*C.f/100) / (F.f/100), 0, 90);
  }
  const kcalOf = (fo,g) => (fo.p*4 + fo.c*4 + fo.f*9) * g/100;
  let excess = kcalOf(P,gp) + kcalOf(C,gc) + kcalOf(F,gf) - tk;
  /* Fazlayı önce karbonhidrattan, sonra yağdan, en son proteinden (en fazla %20) kıs. */
  if (excess > 0 && gc > 0){ const per=(C.p*4+C.c*4+C.f*9)/100; const cut=Math.min(gc, excess/per); gc-=cut; excess-=cut*per; }
  if (excess > 0 && gf > 0){ const per=(F.p*4+F.c*4+F.f*9)/100; const cut=Math.min(gf, excess/per); gf-=cut; excess-=cut*per; }
  if (excess > 0 && gp > 0){ const per=(P.p*4+P.c*4+P.f*9)/100; gp-=Math.min(gp*0.2, excess/per); }

  const sum = { p:0, c:0, f:0, lif:0 };
  for (const [fo,g] of [[P,gp],[C,gc],[F,gf]]){
    sum.p += fo.p*g/100; sum.c += fo.c*g/100; sum.f += fo.f*g/100; sum.lif += (fo.lif||0)*g/100;
  }
  sum.kcal = sum.p*4 + sum.c*4 + sum.f*9;
  return { gp, gc, gf, sum };
}

/* Öğüne yakışmayan eşleşmeler çıkmasın diye her öğünün kabul ettiği kategoriler. */

/* Tatlı, cips, gazlı içecek gibi kalemler otomatik öneriye girmez. */
const NO_SUGGEST = new Set(["baklava","kunefe","kadayif","revani","lokum","tahinhelva","asure",
  "sutlucikolata","bitter","dondurma","kazandibi","sutlac","cips","kola","meyvesuyu","kraker",
  "biskuvi","seker","un","kakaolukrem","recel","bal","pekmez","salep","boza","salgam","cay",

  "wheyizolat","kazein","gainer","bitkiselprotein","kolajen","kreatin","maltodekstrin",
  "proteinpancake","proteinpuding","proteinsut","proteinshake","proteingofret","proteinkurabiye",
  "proteincips","enerjijeli","izotonik","enerjibar","macarsalam","kuflupeynir","zeytinezmesi","kurudomates",

  "pirincunu","nohutunu","sehriye","polenta"]);

/* Kalan makro hedefine en iyi oturan üçlüyü arar. */
function pickTrio(slot, t, opts, used, variant){
  const cats = SLOT_CATS[slot] || SLOT_CATS.ogle;
  const pool = role => {
    const ok = new Set(cats[role]);
    const list = roleCandidates(role).filter(k => FOODS[k] && !opts.exclude.has(k)
      && !used.has(k) && !NO_SUGGEST.has(k) && ok.has(foodCat(FOODS[k]))
      /* kahvaltıya balık konservesi yakışmıyor */
      && !(slot === "kahvalti" && FOODS[k].i === "fish"));
    list.sort((a,b) => (opts.usage[b]||0) - (opts.usage[a]||0));
    if (!list.length){
      /* Diyet havuzu daraldıysa aynı besinin gün içinde tekrarına izin ver. */
      const relaxed = roleCandidates(role).filter(k => FOODS[k] && !opts.exclude.has(k)
        && !NO_SUGGEST.has(k) && ok.has(foodCat(FOODS[k]))
        && !(slot === "kahvalti" && FOODS[k].i === "fish"));
      if (!relaxed.length) return [];
      relaxed.sort((a,b) => (opts.usage[b]||0) - (opts.usage[a]||0));
      return relaxed.slice(0, 6);
    }
    /* Varyanta göre listeyi kaydır: "başka kombinasyon" gerçekten başkasını versin. */
    const step = role === "p" ? 3 : role === "c" ? 5 : 2;
    const off = (variant * step) % list.length;
    const rot = list.slice(off).concat(list.slice(0, off));
    return rot.slice(0, role === "c" ? 10 : role === "p" ? 8 : 6);
  };

  const ps = pool("p"), cs = pool("c"), fs = pool("f");
  if (!ps.length || !cs.length || !fs.length) return null;

  let best = null;
  for (const pk of ps) for (const ck of cs) for (const fk of fs){
    if (pk === ck || ck === fk || pk === fk) continue;
    const r = solveTrio(FOODS[pk], FOODS[ck], FOODS[fk], t.p, t.c, t.f, t.kcal);
    let err = Math.abs(r.sum.kcal - t.kcal)
            + 4 * Math.abs(r.sum.p - t.p)
            + Math.abs(r.sum.c - t.c)
            + 2 * Math.abs(r.sum.f - t.f);
    /* Bileşeni düşen ya da tabağa sığmayacak kadar büyük porsiyonlar tercih edilmesin. */
    if (r.gc < 20) err += 80;
    if (r.gf < 5) err += 50;
    if (r.gp > 280) err += (r.gp - 280) * 0.8;
    if (r.gc > 300) err += (r.gc - 300) * 0.4;
    if (!best || err < best.err) best = { err, pk, ck, fk, r };
  }
  return best;
}

function buildMeals(program, variantIndex){
  const prefs = mealPrefs();
  const usage = foodUsage();
  const diet = currentDiet();
  const exclude = new Set(prefs.exclude);
  if (diet !== "hepsi")
    for (const k of Object.keys(FOODS)) if (!foodAllowed(k, diet)) exclude.add(k);
  const opts = { exclude, useMine:!!prefs.useMine, usage, diet };
  const order = setOrder(usage);
  const set = MEAL_SETS[order[((variantIndex % order.length) + order.length) % order.length]];

  /* Öğün listesi kullanıcıdan gelir; hazır kombinasyonun besin üçlüleri
     bu listeye sırayla dağıtılır (öğün sayısı şablondan fazlaysa başa döner). */
  const mealList = userMeals();
  const shares = mealShares(mealList);
  /* Şablonlar her zaman [Kahvaltı, Öğle, Ara öğün, Akşam] sırasında.
     Öğüne sırasıyla değil türüyle eşlenir: üç öğünlü düzende "Ara öğün"
     öğle şablonunu, "Akşam" ara öğün şablonunu almasın. Büyük öğünün
     ikinci tabağı farklı bir ana öğün şablonundan gelir. */
  const TPL_OF   = { kahvalti:0, ogle:1, ara:2, aksam:3 };
  const TPL_ALT  = { kahvalti:2, ogle:3, ara:0, aksam:1 };
  const tplFor = (mm, plate) => set.meals[
    (plate ? TPL_ALT : TPL_OF)[mm.cat] ?? (plate ? 3 : 1)];

  /* 1) Kullanıcının sabitlediği yiyecekler öğün öğün toplanır. */
  const fixed = mealList.map((mm, idx) => {
    const slot = mm.id;
    const acc = { slot, items:[], p:0, c:0, f:0, lif:0, kcal:0, micros:new Set() };
    for (const x of fixedOf(slot)){
      const fo = foodOf(x.k);
      acc.items.push({ text: portion(fo, x.g).text, icon: fo.i, key:x.k, fixed:true, g:x.g });
      acc.p += fo.p*x.g/100; acc.c += fo.c*x.g/100; acc.f += fo.f*x.g/100; acc.lif += (fo.lif||0)*x.g/100;
      (fo.v || []).forEach(v => acc.micros.add(v));
    }
    acc.kcal = acc.p*4 + acc.c*4 + acc.f*9;
    return acc;
  });

  const anyFixed = fixed.some(f => f.items.length);
  /* Diyet seçiliyse hazır setleri zorlamak yerine üreticiyi kullan:
     kategori farkındalığı olduğu için daha tutarlı öğün çıkarıyor. */
  const generate = anyFixed || diet !== "hepsi";
  const dayFix = fixed.reduce((a,x) => ({ p:a.p+x.p, c:a.c+x.c, f:a.f+x.f, lif:a.lif+x.lif, kcal:a.kcal+x.kcal }),
                              { p:0, c:0, f:0, lif:0, kcal:0 });

  /* 2) Günün kalan hedefi, hâlâ yeri olan öğünlere payları oranında bölünür. */
  const rem = { p: Math.max(0, program.protein - dayFix.p),
                c: Math.max(0, program.carb - dayFix.c),
                f: Math.max(0, program.fat - dayFix.f),
                kcal: Math.max(0, program.kcal - dayFix.kcal) };
  const raw = mealList.map((mm,i) => Math.max(0, shares[i] - fixed[i].kcal / program.kcal));
  const sumW = raw.reduce((a,b) => a+b, 0);
  const w = raw.map(x => sumW > 0 ? x / sumW : 0);

  const total = { p:0, c:0, f:0, lif:0, kcal:0 };
  const micros = new Set();
  const dayUsed = new Set();

  const meals = mealList.map((mm, idx) => {
    const m = tplFor(mm, 0);
    const fx = fixed[idx];
    fx.micros.forEach(v => micros.add(v));
    total.p += fx.p; total.c += fx.c; total.f += fx.f; total.lif += fx.lif; total.kcal += fx.kcal;

    const items = fx.items.slice();
    const share = w[idx];
    fx.items.forEach(it => dayUsed.add(it.key));

    if (share <= 0.0001)
      return { name:mm.name, slot:fx.slot, items, kcal:Math.round(fx.kcal), full: fx.items.length > 0 };

    const t0 = { p: rem.p*share, c: rem.c*share, f: rem.f*share, kcal: rem.kcal*share };

    /* Payı büyük bir öğün tek tabağa sığmaz (porsiyon tavanları var);
       750 kcal üstünde ikinci bir tabak açılır — ana yemek + yan yemek. */
    const plates = t0.kcal > 750 ? 2 : 1;
    const t = { p:t0.p/plates, c:t0.c/plates, f:t0.f/plates, kcal:t0.kcal/plates };

    const used = [];
    /* Anlamsız kalan miktarlar listeye girmesin. */
    const keep = (raw2, food) => food.unit ? raw2 >= food.unit*0.5 : (food.f >= 35 ? raw2 >= 5 : raw2 >= 20);
    const put = (food, g, key) => {
      if (!keep(g, food)) return;
      const part = portion(food, g);
      items.push({ text:part.text, icon:food.i, key });
      used.push([food, part.g]);
    };

    let placed = 0;
    for (let plate = 0; plate < plates; plate++){
      /* 3) Sabitleme veya diyet varsa kalan hedefe göre yeni üçlü üretilir;
            yoksa hazır kombinasyonun besinleri kullanılır. */
      let pk, ck, fk, solved;
      if (generate){
        const best = pickTrio(mm.cat || "ogle", t, opts, dayUsed, variantIndex + plate);
        if (best){ pk = best.pk; ck = best.ck; fk = best.fk; solved = best.r; }
      }
      if (!solved){
        const src = tplFor(mm, plate);
        pk = resolveSlot(src.p, "p", opts, dayUsed);
        ck = resolveSlot(src.c, "c", opts, dayUsed);
        fk = resolveSlot(src.f, "f", opts, dayUsed);
        if (!pk || !ck || !fk) continue;
        solved = solveTrio(FOODS[pk], FOODS[ck], FOODS[fk], t.p, t.c, t.f, t.kcal);
      }
      dayUsed.add(pk); dayUsed.add(ck);
      /* Zeytinyağı gibi sade yağlar her tabakta olabilir; tekrar yasağı
         yedek seçimi sucuk gibi anlamsız yağ kaynaklarına itiyordu. */
      if (FOODS[fk].i !== "oil") dayUsed.add(fk);
      put(FOODS[pk], solved.gp, pk); put(FOODS[ck], solved.gc, ck); put(FOODS[fk], solved.gf, fk);
      placed++;
    }

    if (!placed)
      return { name:mm.name, slot:fx.slot, items, kcal:Math.round(fx.kcal), full: items.length > 0 };

    if (m.extra && !generate) items.push({ text:m.extra, icon:"veg" });
    else if (generate) items.push({ text: SIDES[(idx + variantIndex) % SIDES.length], icon:"veg" });

    const sum = { p:0, c:0, f:0, lif:0 };
    for (const [food, g] of used){
      sum.p += food.p*g/100; sum.c += food.c*g/100; sum.f += food.f*g/100; sum.lif += (food.lif||0)*g/100;
      (food.v || []).forEach(v => micros.add(v));
    }
    const kcal = sum.p*4 + sum.c*4 + sum.f*9;
    total.p += sum.p; total.c += sum.c; total.f += sum.f; total.lif += sum.lif; total.kcal += kcal;

    return { name:mm.name, slot:fx.slot, items, kcal:Math.round(fx.kcal + kcal) };
  });

  const label = diet === "hepsi" ? "Sana özel kombinasyon" : DIETS[diet] + " · sana özel";
  return { setName: generate ? label : set.name, meals, micros, generated:generate,
    total:{ p:Math.round(total.p), c:Math.round(total.c), f:Math.round(total.f),
            lif:Math.round(total.lif), kcal:Math.round(total.kcal) } };
}

const STEP = 100, MAX_ADJ = 400, MIN_SAMPLES = 3;

function avgWeights(state, fromKey, toKey){
  const out = [];
  for (const [k, d] of Object.entries(state.days))
    if (k > fromKey && k <= toKey && typeof d.weight === "number") out.push(d.weight);
  return out;
}

function weeklyRefresh(state){
  const t = today();
  if (state.lastRefreshAt && (new Date(t) - new Date(state.lastRefreshAt)) / 864e5 < 7) return null;

  const cur = avgWeights(state, shiftDays(t,-7), t);
  const prev = avgWeights(state, shiftDays(t,-14), shiftDays(t,-7));
  if (cur.length < MIN_SAMPLES || prev.length < MIN_SAMPLES)
    return { msg:`Trend için yeterli veri yok (bu hafta ${cur.length}, geçen hafta ${prev.length} ölçüm). Haftada en az ${MIN_SAMPLES} gün tartıl.`, save:false };

  const a = cur.reduce((x,y)=>x+y,0)/cur.length;
  const b = prev.reduce((x,y)=>x+y,0)/prev.length;
  const pct = (a - b) / b * 100;
  const [lo, hi] = GOAL[state.profile.goal].range;

  state.lastRefreshAt = t;
  if (pct >= lo && pct <= hi)
    return { msg:`Hedeflenen hızda ilerliyorsun (%${pct.toFixed(2)}/hafta). Kalori hedefi değişmiyor.`, save:true };

  const tooSlow = state.profile.goal === "gain" ? pct < lo : pct > hi;
  const delta = state.profile.goal === "gain" ? (tooSlow ? STEP : -STEP) : (tooSlow ? -STEP : STEP);
  const next = clamp((state.adjustment||0) + delta, -MAX_ADJ, MAX_ADJ);
  if (next === (state.adjustment||0))
    return { msg:`Düzeltme sınırına (${MAX_ADJ} kcal) ulaşıldı. Hedefi daha fazla kaydırmak yerine aktivite seviyeni gözden geçir.`, save:true };

  const applied = next - (state.adjustment||0);
  state.adjustment = next;
  return { msg:`Son hafta ortalaman ${a.toFixed(1)} kg (önceki hafta ${b.toFixed(1)} kg, %${pct.toFixed(2)}). Günlük hedef ${Math.abs(applied)} kcal ${applied<0?"düşürüldü":"artırıldı"}.`, save:true };
}

/* ---------------- ölçüm değerlendirme ---------------- */
function evaluate(entry, profile, program, weight){
  const h = profile.height / 100;
  const out = [];

  if (typeof entry.weight === "number") {
    const bmi = entry.weight / (h*h);
    out.push(bar("Kilo", entry.weight.toFixed(1)+" kg", entry.weight, 18.5*h*h, 24.9*h*h,
      `BMI ${bmi.toFixed(1)} · normal aralık ${(18.5*h*h).toFixed(0)}–${(24.9*h*h).toFixed(0)} kg`));
  } else out.push(blank("Kilo", "Bugün girilmedi"));

  if (typeof entry.sleep === "number")
    out.push(bar("Uyku", entry.sleep.toFixed(1)+" saat", entry.sleep, sleepBand()[0], sleepBand()[1], `Senin hedefin ${sleepBand()[0]}–${sleepBand()[1]} saat`));
  else out.push(blank("Uyku", "Bugün girilmedi"));

  if (weight === null) { out.push(blank("Kalori","Kilo girilmeden hesaplanamaz")); out.push(blank("Su","Kilo girilmeden hesaplanamaz")); return out; }

  if (typeof entry.kcal === "number")
    out.push(bar("Kalori", entry.kcal+" kcal", entry.kcal, program.kcal*0.9, program.kcal*1.1,
      `Hedef ${program.kcal} kcal · bant ${Math.round(program.kcal*0.9)}–${Math.round(program.kcal*1.1)}`));
  else out.push(blank("Kalori", `Hedef ${program.kcal} kcal`));

  if (typeof entry.water === "number")
    out.push(bar("Su", entry.water+" ml", entry.water, program.water*0.85, program.water*1.15, `Hedef ${program.water} ml`));
  else out.push(blank("Su", `Hedef ${program.water} ml`));

  return out;
}

function bar(name, valText, value, low, high, note){
  const span = high - low;
  const min = low - span*0.9, max = high + span*0.9;
  const pos = clamp((value - min) / (max - min) * 100, 0, 100);
  const zl = (low - min) / (max - min) * 100, zw = span / (max - min) * 100;
  const status = value < low ? "Az" : value > high ? "Fazla" : "Yeterli";
  const out = status !== "Yeterli";
  return `<div class="metric">
    <div class="metric-top"><span class="metric-name">${name}</span><span class="metric-val num">${valText}</span></div>
    <div class="track"><div class="zone" style="left:${zl}%;width:${zw}%"></div><div class="mark${out?" out":""}" style="left:${pos}%"></div></div>
    <div class="metric-note"><b class="${out?"out":""}">${status}</b> · ${note}</div>
  </div>`;
}

function blank(name, note){
  return `<div class="metric">
    <div class="metric-top"><span class="metric-name">${name}</span><span class="metric-val num">—</span></div>
    <div class="track"></div><div class="metric-note">${note}</div>
  </div>`;
}

  const e = state.days[k];

  return e;
}

function tabIndicator(prev){
  const bar = app.querySelector(".tabbar"); if (!bar) return;
  const ind = bar.querySelector(".tab-ind");
  const cur = bar.querySelector('[data-tab][aria-current="true"]');
  if (!ind) return;
  if (!cur){ ind.style.opacity = "0"; return; }
  const place = b => { ind.style.transform = `translateX(${b.offsetLeft + b.offsetWidth / 2 - 23}px)`; };
  const from = prev && prev !== tab ? bar.querySelector(`[data-tab="${prev}"]`) : null;
  if (from && !reduceMotion()){
    ind.style.transition = "none"; place(from); void ind.offsetWidth; ind.style.transition = "";
  } else ind.style.transition = "none";
  place(cur); ind.style.opacity = "1";
  if (!from) requestAnimationFrame(() => { ind.style.transition = ""; });
}
/* Sayfaya girildiğinde: ekranın altında kalan kartlar kaydırdıkça belirir,
   grafikler göründükleri anda çizilir. */
let _io = null;
function motionAfter(m, entered){
  if (!m || !entered || reduceMotion() || !("IntersectionObserver" in window)) return;
  if (_io) _io.disconnect();
  _io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const el = e.target;
    if (el.classList.contains("ch-wrap")){ el.classList.remove("ch-pre"); el.classList.add("draw"); }
    else { el.classList.remove("rv"); el.classList.add("rv-in"); }
    _io.unobserve(el);
  }), { rootMargin:"0px 0px -6% 0px" });
  const charts = [...m.querySelectorAll(".ch-wrap")];
  charts.forEach(el => el.classList.add("ch-pre"));
  requestAnimationFrame(() => {
    if (!m.isConnected) return;
    const vh = window.innerHeight;
    [...m.children].forEach(el => {
      if (el.getBoundingClientRect().top > vh * 0.94){ el.classList.add("rv"); _io.observe(el); }
    });
    charts.forEach(el => _io.observe(el));
  });
}
/* Kartlar basıldığı noktaya doğru hafifçe eğilir. */
let _tilt = null;
const TILT = ".oc,.os-t,.os-p,.own,.eve,.gh-s,.g-h,.fav button,.bt";
document.addEventListener("pointerdown", e => {
  if (reduceMotion() || !e.target.closest) return;
  const el = e.target.closest(TILT);
  if (!el) return;
  const r = el.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5;
  const k = Math.min(7, 900 / Math.max(r.width, 1));
  el.style.transition = "transform .12s ease-out";
  el.style.transform = `perspective(700px) rotateX(${(-py * 7).toFixed(2)}deg) rotateY(${(px * k).toFixed(2)}deg) scale(.985)`;
  _tilt = el;
}, { passive:true });
const untilt = () => {
  if (!_tilt) return;
  const t = _tilt; _tilt = null;
  t.style.transition = "transform .5s cubic-bezier(.34,1.45,.64,1)";
  t.style.transform = "";
  setTimeout(() => { t.style.transition = ""; }, 520);
};
["pointerup","pointercancel","scroll"].forEach(ev => document.addEventListener(ev, untilt, { passive:true, capture:true }));

const stepGoal = () => { const g = state && state.profile && state.profile.goals; return g && g.steps > 0 ? g.steps : 0; };
function syncOptional(entry, k){
  if (!entry || !entry.seeded) return;
  /* Program gün içinde değişirse antrenman / dinlenme satırı da ona uysun. */
  const p = cachedProgram();
  if (p){
    const day = p.training.none ? null : p.training.days.find(d => d.wd === isoWeekday(k));
    const isT = x => x.suggested && /^Antrenman:/.test(x.title), isR = x => x.suggested && /^Dinlenme günü/.test(x.title);
    const wantT = !!(day && day.b), wantR = !!(day && !day.b);
    if (entry.tasks.some(x => (isT(x) && !wantT) || (isR(x) && !wantR)))
      entry.tasks = entry.tasks.filter(x => !(isT(x) && !wantT) && !(isR(x) && !wantR));
    if (wantT && !entry.tasks.some(isT)) entry.tasks.unshift({ id: Date.now()+Math.random(), title:"Antrenman: " + day.t, done:false, suggested:true });
    if (wantR && !entry.tasks.some(isR)) entry.tasks.unshift({ id: Date.now()+Math.random(), title:"Dinlenme günü — 20 dk esneme", done:false, suggested:true });
  }
  const want = stepGoal();
  const i = entry.tasks.findIndex(x => x.suggested && taskKind(x) === "steps");
  if (want && i < 0) entry.tasks.push({ id: Date.now()+Math.random(), title: want + " adım at", done:false, suggested:true, kind:"steps" });
  if (!want && i >= 0) entry.tasks.splice(i, 1);
}

  const keys = Object.keys(state.days).sort().reverse();
  for (const k of keys) if (typeof state.days[k].weight === "number") return state.days[k].weight;
  /* Profil kaydı eksikse undefined dönmesin: null kontrolleri buna dayanıyor. */
  return (state.profile && typeof state.profile.startWeight === "number") ? state.profile.startWeight : null;
}

function currentProgram(){
  const w = lastWeight();

function ensureToday(){
  const t = today();
  if (!state.days[t]) state.days[t] = { tasks: [] };
  const entry = state.days[t];
  if (!entry.seeded) {
    const p = currentProgram();
    if (p) {
      for (const title of suggestedTitles(p, t))
        entry.tasks.push({ id: Date.now()+Math.random(), title, done:false, suggested:true });
      entry.seeded = true;
    }
  }
  /* Tekrar eden görevler programdan bağımsız; her gün ayrıca kontrol edilir. */
  for (const r of routinesForDay(t))
    if (!entry.tasks.some(x => x.rt && x.title === r.title))
      entry.tasks.push({ id: Date.now()+Math.random(), title:r.title, done:false, suggested:false, rt:true });
  syncOptional(entry, t);
}

/* Hareket metninin set/tekrar kısmını koruyarak adı değiştirir. */
function swapEx(str, rules){
  const m = str.match(/^(.*?)(\s*\d+\s*(?:×|set\b).*)$/);
  const base = (m ? m[1] : str).trim(), tail = m ? m[2] : "";
  if (!base){
    /* Sayıyla başlayan metinler ("8×25 m sprint"): ada yer yok, eşleşirse çıkarılır. */
    const all = str.toLocaleLowerCase("tr");
    return rules.some(([rx]) => rx.test(all)) ? null : str;
  }
  const l = base.toLocaleLowerCase("tr");
  for (const [rx, to] of rules) if (rx.test(l)) return to === null ? null : to + tail;
  return str;
}
const zoneHits = (text, zone) => (AVOID_SWAP[zone] || []).some(([rx]) => rx.test(text.toLocaleLowerCase("tr")));

/* Değişiklik durana kadar bütün bölgeleri uygular; dönüp duruyorsa hareketi çıkarır. */
function applyZones(ex, avoid){
  let cur = ex;
  for (let pass = 0; pass < 5; pass++){
    let changed = false;
    for (const z of avoid){
      const r = swapEx(cur, AVOID_SWAP[z] || []);
      if (r === null) return null;
      if (r !== cur){ cur = r; changed = true; }
    }
    if (!changed) return cur;
  }
  return null;
}

function applyAvoid(b, avoid){
  if (!avoid || !avoid.length || !b) return b;
  /* Devre metni tek parça; içinde kaçınılan hareket varsa devre tümden çıkar. */
  if (/^\d+ tur:/.test(b))
    return avoid.some(z => zoneHits(b, z)) ? "Yürüyüş 30 dk" : b;
  const out = [], seen = new Set();
  for (const ex of b.split(" · ")){
    const cur = applyZones(ex, avoid);
    if (!cur) continue;
    const key = parseEx(cur, "gym").name.toLocaleLowerCase("tr");
    if (seen.has(key)) continue;
    seen.add(key); out.push(cur);
  }
  return out.length ? out.join(" · ") : "Yürüyüş 30 dk";
}

const ROLL_COL = "0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9";
function rollHTML(str){
  return [...String(str)].map(ch => /\d/.test(ch)
    ? `<span class="rd"><span style="transform:translateY(-${ch}em)">${ROLL_COL}</span></span>`
    : `<span class="rs">${ch}</span>`).join("");

function rollSet(el, str){
  str = String(str);
  const cur = el.dataset.v || "";
  if (cur === str) return;
  el.dataset.v = str;
  const same = cur.length === str.length && [...str].every((c, i) => /\d/.test(c) === /\d/.test(cur[i]));
  if (!same || reduceMotion()){ el.innerHTML = rollHTML(str); return; }
  const cols = el.querySelectorAll(".rd > span");
  let j = 0;
  for (const c of str) if (/\d/.test(c)) cols[j++].style.transform = `translateY(-${c}em)`;
}

/* ---- sürüklemeli cetvel ----
   Yatay kaydırılan çizgili şerit; ortadaki iğnenin altındaki değer seçilir. */
function obRuler(field, min, max, step, tw, majorEvery, midEvery, unit, dec){
  const n = Math.round((max - min) / step);
  let ticks = "";
  for (let i = 0; i <= n; i++){
    const v = min + i * step;
    ticks += i % majorEvery === 0 ? `<i class="M" data-l="${+v.toFixed(1)}"></i>` : i % midEvery === 0 ? `<i class="m"></i>` : `<i></i>`;
  }
  const val = ob[field];
  const txt = dec ? val.toFixed(1).replace(".", ",") : String(val);
  return `<div class="rl" data-rl="${field}" data-min="${min}" data-max="${max}" data-step="${step}" data-tw="${tw}" data-dec="${dec ? 1 : 0}" style="--tw:${tw}px">
    <button type="button" class="rl-v" aria-label="${unit} değerini elle yaz">
      <b class="num rl-n" data-v="${txt}" aria-hidden="true">${rollHTML(txt)}</b><span>${unit}</span></button>
    <div class="rl-w">
      <div class="rl-s" tabindex="0" role="slider" aria-label="${unit}" aria-valuemin="${min}" aria-valuemax="${max}" aria-valuenow="${val}"><div class="rl-t">${ticks}</div></div>
    </div>
  </div>`;
}
function wireRulers(animate){
  app.querySelectorAll(".rl").forEach(rl => {
    const f = rl.dataset.rl, min = +rl.dataset.min, max = +rl.dataset.max, step = +rl.dataset.step, tw = +rl.dataset.tw, dec = rl.dataset.dec === "1";
    const sc = rl.querySelector(".rl-s"), out = rl.querySelector(".rl-n");
    const fmt = v => dec ? v.toFixed(1).replace(".", ",") : String(v);
    const toX = v => (v - min) / step * tw;
    const set = v => {
      v = clamp(+(Math.round(v / step) * step).toFixed(2), min, max);
      if (ob[f] === v) return;
      ob[f] = v;
      rollSet(out, fmt(v));
      sc.setAttribute("aria-valuenow", v);
      rl.classList.add("live"); clearTimeout(rl._t); rl._t = setTimeout(() => rl.classList.remove("live"), 260);
    };
    /* Açılışta cetvel değerine doğru kayarak gelir; bu sırada değer değişmez. */
    const target = ob[f];
    let intro = false;
    const endIntro = () => { if (!intro) return; intro = false; rollSet(out, fmt(ob[f])); };
    if (animate && !reduceMotion()){
      intro = true;
      sc.scrollLeft = Math.max(toX(target) - 14 * tw, 0);
      setTimeout(() => { if (intro) sc.scrollTo({ left: toX(target), behavior:"smooth" }); }, 420);
      setTimeout(() => { if (intro){ endIntro(); sc.scrollLeft = toX(target); } }, 1400);
      sc.addEventListener("touchstart", endIntro, { passive:true });
      sc.addEventListener("pointerdown", endIntro);
      sc.addEventListener("keydown", endIntro);
    } else sc.scrollLeft = toX(target);
    sc.onscroll = () => {
      const v = min + Math.round(sc.scrollLeft / tw) * step;
      if (intro) rollSet(out, fmt(clamp(+v.toFixed(2), min, max))); else set(v);
    };

    /* fareyle sürükleme (dokunmatikte kaydırma zaten yerel) */
    let drag = null;
    sc.onpointerdown = ev => {
      if (ev.pointerType !== "mouse") return;
      drag = { x: ev.clientX, left: sc.scrollLeft };
      sc.classList.add("drag"); sc.setPointerCapture(ev.pointerId);
    };
    sc.onpointermove = ev => { if (drag) sc.scrollLeft = drag.left - (ev.clientX - drag.x); };
    const end = () => {
      if (!drag) return;
      drag = null; sc.classList.remove("drag");
      sc.scrollTo({ left: toX(ob[f]), behavior: reduceMotion() ? "auto" : "smooth" });
    };
    sc.onpointerup = end; sc.onpointercancel = end;
    sc.onkeydown = ev => {
      const d = { ArrowRight:1, ArrowUp:1, ArrowLeft:-1, ArrowDown:-1, PageUp:10, PageDown:-10 }[ev.key];
      if (!d) return;
      ev.preventDefault();
      const v = clamp(ob[f] + d * step, min, max);
      sc.scrollTo({ left: toX(v), behavior:"auto" });
    };

    /* rakama dokun: elle yaz */
    const vb = rl.querySelector(".rl-v");
    vb.onclick = () => {
      if (vb.querySelector("input")) return;
      const inp = document.createElement("input");
      inp.type = "number"; inp.inputMode = "decimal"; inp.className = "rl-in"; inp.value = ob[f];
      inp.setAttribute("aria-label", vb.getAttribute("aria-label"));
      out.hidden = true; vb.insertBefore(inp, out); inp.focus(); inp.select();
      const done = () => {
        const n = num(inp.value);
        inp.remove(); out.hidden = false;
        if (n !== null){ const v = clamp(n, min, max); sc.scrollTo({ left: toX(v), behavior: reduceMotion() ? "auto" : "smooth" }); set(v); }
      };
      inp.onblur = done;
      inp.onkeydown = ev => { if (ev.key === "Enter"){ ev.preventDefault(); inp.blur(); } };
      inp.onclick = ev => ev.stopPropagation();
    };
  });
}

const OB_PARTS = "h1,.on-sub,.on-tag,.og,.on-feat li,.os-k,.os-t,.os-p,.on-s .metric-note,.on-foot,.on-lw";
function obMount(stage, html, dir){
  stage.innerHTML = html;
  const q = stage.firstElementChild;
  q.querySelectorAll(OB_PARTS).forEach((el, i) => el.style.setProperty("--i", Math.min(i, 12)));
  q.classList.add("in");
  if (dir === -1) q.classList.add("rev");

/* Eski sahne çıkar, sonra yenisi girer. */
function obSwap(stage, dir, then){
  const old = stage.firstElementChild;
  if (!old || !dir || reduceMotion()){ then(); return; }
  obBusy = true;
  old.classList.remove("in");
  old.classList.add("out");
  if (dir === -1) old.classList.add("rev");
  setTimeout(() => { obBusy = false; then(); }, 200);
}

function obCountUp(){
  const el = document.getElementById("os-kn");
  if (!el || reduceMotion()) return;
  const to = +el.dataset.to, t0 = performance.now(), dur = 1100;
  el.textContent = "0";
  const step = now => {
    if (!el.isConnected) return;
    const p = Math.min(1, (now - t0) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 4)));
    if (p < 1) requestAnimationFrame(step); else sparkle(el);
  };
  setTimeout(() => requestAnimationFrame(step), 260);
}

function renderOnboarding(dir){
  if (!ob) { ob = obDefaults(); obStep = 0; }
  applyTheme(ob.theme);
  const list = obList();
  obStep = clamp(obStep, 0, list.length - 1);
  const st = list[obStep];
  let stage = document.getElementById("on-stage");
  if (!stage){
    app.innerHTML = `<div class="on-bg" id="on-bg" aria-hidden="true"><i></i><i></i>${[0,1,2,3,4,5].map(() => `<b>${icon("star4")}</b>`).join("")}</div>
    <main class="on">
      <div class="on-top hide" id="on-top">
        <button class="on-back" id="ob-back" aria-label="Geri">${icon("prev")}</button>
        <div class="on-bar" id="on-bar" role="progressbar" aria-valuemin="1"><i></i></div>
        <span class="on-cnt num" id="on-cnt"></span>
      </div>
      <div class="on-stage" id="on-stage"></div>
      <div class="on-nav" id="on-nav"><button id="ob-next">İleri</button></div>
    </main>`;
    stage = document.getElementById("on-stage");
  }
  const n = list.length - 2;                         /* karşılama ve özet sayılmaz */
  const first = st.id === "welcome", sum = st.id === "summary";
  document.getElementById("on-top").classList.toggle("hide", first);
  const bar = document.getElementById("on-bar");
  bar.firstElementChild.style.width = (sum ? 100 : obStep / n * 100).toFixed(1) + "%";
  bar.setAttribute("aria-valuemax", n); bar.setAttribute("aria-valuenow", Math.min(obStep, n));
  bar.setAttribute("aria-label", sum ? "Sorular tamam" : `Adım ${obStep} / ${n}`);
  document.getElementById("on-cnt").textContent = first || sum ? "" : `${obStep}/${n}`;
  document.getElementById("on-bg").style.setProperty("--p", (obStep / (list.length - 1)).toFixed(3));
  document.getElementById("on-nav").classList.remove("hide");
  document.getElementById("ob-next").textContent = first ? "Başlayalım" : sum ? "Başla" : "İleri";

  obSwap(stage, dir, () => {
    obMount(stage, first ? obWelcome() : sum ? obSummary() : obQuestion(st), dir);
    wireOb(st, list, true);
    if (sum) obCountUp();
  });
}

/* Aynı ekranda bir seçim yeni soruları açtığında: sahne yerinde tazelenir,

  const y = window.scrollY;
  stage.innerHTML = obQuestion(st);

  document.getElementById("on-cnt").textContent = "";

      line.textContent = OB_BUILD[i]; line.classList.add("flip");

function obErr(msg){
  const box = document.getElementById("ob-err");
  if (!box) return;
  box.textContent = msg || "";
  box.classList.toggle("show", !!msg);
  if (msg) box.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block:"nearest" });
}

function wireOb(st, list, animate){
  const go = d => {
    if (obBusy) return;
    const nxt = list[obStep + d];
    obStep += d;
    if (d > 0 && nxt && nxt.id === "summary" && !reduceMotion()){ obPlayBuild(); return; }
    renderOnboarding(d); window.scrollTo(0, 0);
  };
  const next = async () => {
    if (obBusy) return;
    if (st.read) st.read();
    const err = st.valid ? st.valid() : "";
    if (err){
      const [msg, focus] = Array.isArray(err) ? err : [err, null];
      obErr(msg);
      const f = focus && document.getElementById(focus);
      if (f){ f.focus(); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); }
      return;
    }
    if (st.id === "summary"){ await obFinish(); return; }
    go(1);
  };
  document.getElementById("ob-next").onclick = next;
  document.getElementById("ob-back").onclick = () => { if (obBusy) return; if (st.read) st.read(); go(-1); };
  if (st.wire) st.wire();
  wireRulers(animate);
  app.querySelectorAll(".on-q input").forEach(i => i.addEventListener("input", () => obErr("")));

  /* seçim kartları: yalnızca işaretler, ekranı değiştirmez */
  app.querySelectorAll(".ocs [data-oc]").forEach(b => b.onclick = () => {
    const box = b.closest(".ocs"), f = box.dataset.field, v = b.dataset.oc;
    if (f === "plan"){ const was = !!ob.noPlan; ob.noPlan = v === "off"; ob.planTouched = true; if (was !== ob.noPlan){ obRefresh("#og-plan"); return; } }
    else if (f === "sex"){
      const was = ob.sex; ob.sex = v;
      if (was !== v){ ob.avatar = undefined; ob.avColor = undefined; obRefresh(was ? null : "#og-av"); return; }
    }
    else ob[f] = box.dataset.num ? Number(v) : v;
    if (f === "activity" && ob.planTouched !== true){ ob.noPlan = v === "sedentary"; ob.days = null; }
    box.querySelectorAll("[data-oc]").forEach(x => {
      x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", String(x === b));
    });
    if (f === "venue"){ const note = document.getElementById("day-note"); if (note) note.textContent = dayNote(ob.venue, ob.activity, ob.days); }
    obErr("");
  });

  /* uyku: tek seçimli rozet */
  app.querySelectorAll("[data-obsleep]").forEach(b => b.onclick = () => {
    ob.sleepMin = Number(b.dataset.obsleep);
    app.querySelectorAll("[data-obsleep]").forEach(x => { x.classList.toggle("sel", x === b); x.setAttribute("aria-pressed", String(x === b)); });
  });

  /* çok seçimli rozetler */
  const toggle = (attr, field, cast) => app.querySelectorAll(`[data-${attr}]`).forEach(b => b.onclick = () => {
    const v = cast(b.dataset[attr]);
    const i = ob[field].indexOf(v);
    if (i >= 0) ob[field].splice(i, 1); else ob[field].push(v);
    b.classList.toggle("sel", i < 0); b.setAttribute("aria-pressed", String(i < 0));
  });
  toggle("obavoid", "avoid", String);
  toggle("obdis", "dislike", Number);

  /* antrenman günleri: 3-5 arası */
  app.querySelectorAll("[data-obday]").forEach(b => b.onclick = () => {
    const n = Number(b.dataset.obday);
    ob.days = (ob.days || OB_DEFAULT_DAYS(ob.activity)).slice();
    const i = ob.days.indexOf(n);
    if (i >= 0){
      if (ob.days.length <= 3){ toast("En az 3 antrenman günü gerekli."); return; }
      ob.days.splice(i, 1);
    } else {
      if (ob.days.length >= 5){ toast("En fazla 5 gün seçebilirsin."); return; }
      ob.days.push(n);
    }
    ob.days.sort((a, b2) => a - b2);
    b.classList.toggle("sel", i < 0); b.setAttribute("aria-pressed", String(i < 0));
    const note = document.getElementById("day-note");
    if (note) note.textContent = dayNote(ob.venue, ob.activity, ob.days);
  });
}

async function obFinish(){
  const profile = obProfile();
  state = { profile, adjustment:0, lastRefreshAt:null, days:{} };
  state.mealPrefs = { exclude:[], useMine:false, fixed:{}, diet: ob.diet, meals: mealsFromPreset(ob.mealSet) };
  const ex = new Set();
  for (const i of ob.dislike) for (const k of (DISLIKE[i] || [])[1] || []) if (FOODS[k]) ex.add(k);
  state.mealPrefs.exclude = [...ex];
  state.routines = [];

  state.days[today()] = { weight: ob.weight, tasks:[] };
  ensureToday();
  await saveState(state);
  applyTheme(profile.theme);
  /* Giriş sahnesi kararır, uygulama açılır. */
  const shell = app.querySelector("main.on");
  if (shell && !reduceMotion()){
    obBusy = true; shell.classList.add("bye");
    await new Promise(r => setTimeout(r, 300));
    obBusy = false;
  }
  ob = null; obStep = 0;
  tab = "today"; viewDate = null;
  render(); window.scrollTo(0,0);
}

      + (planTab === "howto" ? howtoView(program)

  if (tab === "plan") {

      if (b.dataset.planTab === planTab) return;

/* ---- hafta şeridi ----
   Takvime gitmeden son yedi gün arasında gezilir; seçilen gün çok eskiyse
   şerit o günün çevresine kayar. */
const LV_WORD = { e:"veri yok", t:"tamamlandı", 5:"tamamlandı", 4:"çoğu tamam", 3:"yarısı tamam", 2:"az tamam", 1:"başlandı" };
function weekStrip(key){
  const t = today();
  let end = t;
  if (key < shiftDays(t, -6)){ const c = shiftDays(key, 3); end = c > t ? t : c; }
  const days = [];
  for (let i = 6; i >= 0; i--) days.push(shiftDays(end, -i));
  return `<div class="wk" role="group" aria-label="Gün seç">${days.map(k => {
    const lv = dayLevel(k);
    return `<button class="wk-d" data-wk="${k}" data-lv="${lv}" aria-current="${k === key}"
      aria-label="${prettyDate(k)} ${weekdayName(k)}, ${k === t ? "bugün, " : ""}${LV_WORD[lv] || ""}">
      <span class="wk-n">${k === t ? "Bugün" : WD_SHORT[isoWeekday(k)]}</span><b class="num">${+k.slice(8)}</b><i></i></button>`;
  }).join("")}</div>
  ${key !== t ? `<div class="wk-back"><button class="link" id="back-today">Bugüne dön</button></div>` : ""}`;
}

/* ---- akşam kapanış satırı ----
   21:00'den sonra günün durumu tek cümlede: kaç hedef tamam, ne eksik.
   Eksik olana dokununca girişi açılır. */
const EVE_WORD = ["Hiçbir","Bir","İki","Üç","Dört","Beş","Altı","Yedi","Sekiz","Dokuz","On"];
function eveMiss(kind, entry, program, a){
  switch (kind){
    case "water": { const need = Math.round(program.water * 0.9); return `su ${Math.max(need - (entry.water || 0), 0)} ml eksik`; }
    case "protein": { const need = Math.round(program.protein * 0.9);
      const v = entry.log && entry.log.length ? logTotals(entry).p : 0; return `protein ${Math.max(need - v, 0)} g eksik`; }
    case "kcal": { const B = kcalBand(program);
      if (typeof entry.kcal !== "number") return "kalori girilmedi";
      return entry.kcal > B.hi ? `kalori ${entry.kcal - B.hi} kcal fazla` : `kalori ${B.lo - entry.kcal} kcal eksik`; }
    case "sleep": return typeof entry.sleep === "number" ? "uyku hedefin altında" : "uyku girilmedi";
    case "weigh": return "kilo girilmedi";
    case "steps": return `${Math.max(stepGoal() - (entry.steps || 0), 0)} adım eksik`;
    case "train": { const m = /^(\d+)\/(\d+)/.exec(a.txt || ""); return m ? `antrenmanda ${m[2] - m[1]} hareket eksik` : "antrenman eksik"; }
  }
  return "";
}
function eveningLine(entry, program, key){
  if (key !== today() || nowHour() < 21 || !program) return "";
  let done = 0, total = 0;
  const miss = [];
  for (const t of entry.tasks){
    if (!t.suggested){
      total++;
      if (t.done) done++; else miss.push(["own", `“${t.title}” duruyor`]);
      continue;
    }
    const kind = taskKind(t);
    if (skipTask(kind, key, entry)) continue;
    const a = autoInfo(t, entry, program, key);
    if (!a) continue;
    total++;
    if (a.ok) done++; else miss.push([kind, eveMiss(kind, entry, program, a)]);
  }
  if (!total) return "";
  const head = done >= total ? "Bütün hedefler tamam"
             : done === 0 ? "Henüz tamamlanan hedef yok" : `${EVE_WORD[done] || done} hedef tamam`;
  return `<div class="eve" role="status">${icon("star4")}
    <div><b>${head}</b>${miss.length ? ", " + miss.slice(0, 2).map(([k, txt]) =>
      `<button data-goto="${k}">${esc(txt)}</button>`).join(", ")
      + (miss.length > 2 ? ` ve ${miss.length - 2} hedef daha` : "") + "." : "; bugünün yıldızı yandı."}</div></div>`;
}
