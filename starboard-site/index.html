function goalHero(key, sc){
  const now = key === today();
  const pct = sc.total ? clamp(sc.done / sc.total, 0, 1) : 0;
  const full = !!sc.total && sc.done >= sc.total;
  const C = 2 * Math.PI * 34;
  const off = +(C * (1 - pct)).toFixed(1);
  const entering = render.lastTab !== "today" || !!navDir;
  const prevOff = entering || _ringPrev[key] === undefined ? +C.toFixed(1) : _ringPrev[key].off;
  const bump = !entering && _ringPrev[key] && _ringPrev[key].done !== sc.done;
  const rollFrom = String(bump && !reduceMotion() ? _ringPrev[key].done : sc.done);
  _ringPrev[key] = { off, done: sc.done };
  const w = weekInfo(weekStart(today())), streak = streakNow();
  const title = !sc.total ? "Hedef yok" : full ? (now ? "Bugün tamam" : "Gün tamam") : `${sc.total - sc.done} hedef kaldı`;
  const sub = !now ? `${prettyDate(key)} · ${weekdayName(key)}`
            : full ? "Bugünün yıldızı yandı." : "Satıra dokun, olduğu yerde gir.";
  return `<div class="gh${full ? " full" : ""}${now ? "" : " past"}">
    <div class="gh-ring">
      <svg viewBox="0 0 84 84" aria-hidden="true">
        <circle class="gh-bg" cx="42" cy="42" r="34"/>
        <circle class="gh-fg" cx="42" cy="42" r="34" transform="rotate(-90 42 42)"
          stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${reduceMotion() ? off : prevOff}" data-to="${off}"/>
      </svg>
      <span class="gh-n num${bump ? " bump" : ""}" aria-label="${sc.total} hedeften ${sc.done} tamam"><b class="roll" data-v="${rollFrom}" data-to="${sc.done}">${rollHTML(rollFrom)}</b>/${sc.total}</span>
    </div>
    <div class="gh-t"><b>${title}</b><i>${sub}</i>
      <button class="gh-s" id="gh-cal">${icon("star4")}<span>${streak} günlük seri · bu hafta ${w.n}/7</span></button></div>
  </div>`;
}

const GOAL_ICON = { kcal:"grain", protein:"poultry", water:"dairy", sleep:"rest", weigh:"legs", steps:"walk" };

/* Hedefin girişi satırın altında açılır; başka sayfaya gidilmez. */
function goalEditor(kind, entry, program, key){
  const val = v => (typeof v === "number" ? v : "");
  const now = key === today();
  const logged = !!(entry.log && entry.log.length);
  switch (kind){
    case "weigh": return `<div class="g-f"><label for="i-weight">Kilo (kg)</label>
      <input id="i-weight" type="number" inputmode="decimal" value="${val(entry.weight)}" placeholder="—"></div>`;
    case "sleep": return sleepHTML(entry);
    case "water": return `
      <div class="lbl-row"><span class="lbl">Bardak bardak işaretle</span><span class="lbl-v num">${val(entry.water) || 0}${program ? ` / ${program.water}` : ""} ml</span></div>
      ${cupsHTML(entry.water, program && program.water)}
      <div class="water-exact"><label for="i-water">Tam miktar (ml)</label>
        <input id="i-water" type="number" inputmode="numeric" value="${val(entry.water)}" placeholder="—"></div>`;
    case "kcal": return `<div class="g-f"><label for="i-kcal">Kalori (kcal)</label>
        <input id="i-kcal" type="number" inputmode="numeric" value="${val(entry.kcal)}" placeholder="—"${logged ? " disabled" : ""}></div>
      ${logged
        ? `<div class="metric-note" style="margin-top:7px">Beslenme günlüğündeki ${entry.log.length} kalemden hesaplandı.</div>`
        : `<div class="chips"><button class="chip" data-add-kcal="200">+200</button><button class="chip" data-add-kcal="400">+400</button><button class="chip" data-add-kcal="600">+600</button></div>`}
      <button class="ghost" data-goto="kcal" style="margin-top:12px">${logged ? "Beslenme günlüğünü aç" : "Yediklerini tek tek gir"}</button>`;
    case "steps": return `<div class="g-f"><label for="i-steps">Adım sayısı</label>
        <input id="i-steps" type="number" inputmode="numeric" value="${val(entry.steps)}" placeholder="—"></div>
      <div class="metric-note" style="margin-top:7px">Telefonundaki Sağlık uygulamasında ${now ? "bugün" : "o gün"} için yazan sayıyı gir.</div>`;
    case "train": {
      const ses = program.training.days.find(d => d.wd === isoWeekday(key));
      if (!ses) return "";
      return `<div class="metric-note">${esc(ses.b)}</div>
        <button class="ghost" id="go-train" style="margin-top:12px">${now ? "Antrenmana başla" : "Antrenmanı kaydet"}</button>`;
    }
  }
  return "";
}

function goalRow(t, entry, program, key){
  const info = t.suggested ? autoInfo(t, entry, program, key) : null;
  if (!info){
    /* Elle işaretlenen hedef: kendi görevlerin ve dinlenme günü esnemesi. */
    return `<div class="g" data-done="${t.done ? 1 : 0}"${t.suggested ? "" : " data-own"}>
      <div class="g-h">
        <button class="check" data-done="${t.done ? 1 : 0}" data-id="${t.id}" aria-label="${esc(t.title)}: tamamlandı olarak işaretle"></button>
        <span class="g-m"><b>${esc(t.title)}</b>${t.rt ? `<i>her gün tekrar eder</i>` : ""}</span>
        ${t.suggested ? "" : `<button class="del" data-del="${t.id}" aria-label="${esc(t.title)}: sil">×</button>`}
      </div></div>`;
  }
  const kind = taskKind(t), open = goalOpen === kind;
  const ses = kind === "train" ? program.training.days.find(d => d.wd === isoWeekday(key)) : null;
  const ic = kind === "train" ? ((ses && ses.icon) || "fullbody") : GOAL_ICON[kind];
  const seen = _doneSeen[key];
  if (info.ok && seen && !seen.has(kind)) _justAt[key + kind] = Date.now();
  const just = info.ok && Date.now() - (_justAt[key + kind] || 0) < 1000;
  return `<div class="g${open ? " open" : ""}${just ? " just" : ""}" data-done="${info.ok ? 1 : 0}" data-kind="${kind}">
    <button class="g-h" data-goal="${kind}" aria-expanded="${open}">
      ${iconBox(ic)}
      <span class="g-m"><b>${esc(info.title)}</b><i${info.warn ? ` class="warn"` : ""}>${esc(info.txt)}</i>
        ${info.ok ? "" : `<span class="task-bar"><i style="width:${clamp(info.pct * 100, 0, 100).toFixed(0)}%"></i></span>`}</span>
      ${info.ok ? `<span class="g-ok" aria-label="tamam">${icon("star4")}</span>`
                : `<svg class="ico task-chev" aria-hidden="true"><use href="#i-next"/></svg>`}
    </button>
    ${open ? `<div class="g-b${goalJust === kind ? " anim" : ""}"><div class="g-bi">${goalEditor(kind, entry, program, key)}</div></div>` : ""}
  </div>`;
}

function todayView(entry, program, key){
  key = key || today();
  const now = key === today();
  const vis = entry.tasks.filter(t => !t.suggested || !skipTask(taskKind(t), key, entry));
  /* Veriyle işaretlenenler üstte, elle işaretlenenler altta. */
  const auto = t => !!(t.suggested && autoInfo(t, entry, program, key));
  const shown = vis.filter(auto).concat(vis.filter(t => !auto(t)));
  const sc = dayScore(key);
  const rows = shown.map(t => goalRow(t, entry, program, key)).join("");
  _doneSeen[key] = new Set(shown.filter(t => t.suggested).map(t => [taskKind(t), autoInfo(t, entry, program, key)])
    .filter(([, a]) => a && a.ok).map(([k2]) => k2));

  return `
  ${weekStrip(key)}
  ${eveningLine(entry, program, key)}
  ${program ? goalHero(key, sc) : `<section class="welcome">
    <span class="brand-i">${BRAND_SVG}</span>
    <b>Starboard hazır</b>
    <i>Kilonu girdiğinde günün hedefleri burada belirir.</i>
    <button id="np-go">Kilonu gir</button>
  </section>`}

  <section class="gl" id="goal-list">
    ${rows}
    <button class="ghost" id="goal-add">＋ Hedef ekle</button>
  </section>

  ${notice && now ? `<div class="notice">${iconBox("day")}<div>${esc(notice)}</div></div>` : ""}

  ${now ? skyCard() : ""}`;
}

/* Kapalıyken de bir şey söylesin: son kilo ve kaç günlük veri var. */
function reviewCount(){
  const w = lastWeight();
  const n = Object.keys(state.days || {}).filter(k => typeof state.days[k].weight === "number").length;
  return w !== null ? `${kg1(w)} kg · ${n} ölçüm` : "henüz ölçüm yok";
}

/* ---- otomatik güncellenen program önerileri ----
   Her öneri girilen verilerden hesaplanır: başlık güncel hedefi taşır,
   koşul sağlanınca kendiliğinden işaretlenir. Elle işaretleme de çalışır;
   veri koşulu sağladığında elle verilen karar yerini otomatiğe bırakır. */
/* Kalori aralığı hedefe göre değişir.
   Yağ kaybı: hedefin altı serbest ama güvenli sınıra kadar. Alt sınır üç
   ölçünün en yükseği: hedefin 500 kcal altı, bakım kalorisinin 1000 kcal
   altı (NICE'ın denetimsiz önerdiği en büyük açık) ve bazal metabolizmaya
   dayalı taban (erkekte 1500, kadında 1200 kcal'den az değil).
   Koruma: hedefin ±%10'u. Kas kazanımı: bakımın %5-20 üstü (Iraki ve ark. 2019). */
function kcalBand(program){
  const T = program.tdee, G = program.kcal, goal = state.profile.goal;
  const floor = Math.round(Math.max(program.bmr * 0.95, sexK(state.profile.sex, 1500, 1200)));
  if (goal === "lose"){
    const lo = Math.round(Math.max(floor, G - 500, T - 1000)), hi = Math.round(G * 1.05);
    return { G, T, lo, hi,
      okMsg: v => v < G ? `açığın ${T - v} kcal, güvenli aralıkta` : "hedefte",
      overMsg: v => v > T ? "bakım kalorinin üstündesin, bugün açık oluşmadı" : `hedefin ${v - G} kcal üstündesin, açık küçüldü`,
      underMsg: v => `açık ${T - v} kcal; bu kadar düşük kalori kas kaybı ve yorgunluk riskini artırır, ${lo} kcal altına inme` };
  }
  if (goal === "gain"){
    const lo = Math.round(T * 1.05), hi = Math.round(T * 1.20);
    return { G, T, lo, hi,
      okMsg: v => `fazlalığın ${v - T} kcal`,
      overMsg: v => `fazlalık ${v - T} kcal; bu kadarı kas yerine çoğunlukla yağ olarak depolanır`,
      underMsg: v => v < T ? "bakım kalorinin altındasın, kas kazanımı için fazlalık gerekli" : "fazlalık kas kazanımı için yetersiz kaldı" };
  }
  const lo = Math.round(G * 0.9), hi = Math.round(G * 1.1);
  return { G, T, lo, hi,
    okMsg: v => Math.abs(v - G) < 20 ? "tam hedefte" : v > G ? `hedefin ${v - G} kcal üstü, tolerans içinde` : `hedefin ${G - v} kcal altı, tolerans içinde`,
    overMsg: v => `hedefin ${v - G} kcal üstündesin, uzun sürerse kilo artışı olur`,
    underMsg: v => `hedefin ${G - v} kcal altındasın, uzun sürerse kilo kaybı olur` };
}

function taskKind(t){
  if (t.kind) return t.kind;
  const x = t.title || "";
  return /^Antrenman:/.test(x) ? "train" : /kcal hedefini tut/.test(x) ? "kcal"
       : /g protein al/.test(x) ? "protein" : /ml su iç/.test(x) ? "water"
       : /saat uyu/.test(x) ? "sleep" : /kilo ölçümü/.test(x) ? "weigh"
       : /^\d+ adım at$/.test(x) ? "steps" : null;
}

function autoInfo(t, entry, program, key){
  key = key || today();
  const kind = taskKind(t);
  if (!kind || !program) return null;
  switch (kind){
    case "kcal": {
      const B = kcalBand(program);
      const has = typeof entry.kcal === "number";
      const v = has ? entry.kcal : 0;
      const title = `Kaloriyi ${B.lo}–${B.hi} kcal arasında tut`;
      /* gün bitmeden az yemek henüz sorun değil; geçmiş günde gün zaten bitti */
      const late = key < today() || new Date().getHours() >= 20;
      if (!has) return { title, ok:false, pct:0, txt:`Hedef ${B.G} kcal · kalori girilmedi`,
        why:"Kalori ya da beslenme günlüğü girilince kendiliğinden işaretlenir." };
      if (v > B.hi) return { title, ok:false, pct:1, warn:true, txt:`${v} kcal · ${B.overMsg(v)}`,
        why:`Üst sınır ${B.hi} kcal. ${B.overMsg(v)}.` };
      if (v < B.lo){
        const gap = B.lo - v;
        return late
          ? { title, ok:false, pct:v/B.lo, warn:true, txt:`${v} kcal · ${B.underMsg(v)}`, why:B.underMsg(v) + "." }
          : { title, ok:false, pct:v/B.lo, txt:`${v} kcal · aralığa ${gap} kcal kaldı`,
              why:`Alt sınır ${B.lo} kcal; ${gap} kcal daha alınca işaretlenir.` };
      }
      return { title, ok:true, pct:1, txt:`${v} kcal · ${B.okMsg(v)}` };
    }
    case "protein": {
      const has = entry.log && entry.log.length;
      const v = has ? logTotals(entry).p : 0, g = program.protein, need = Math.round(g*0.9);
      return { title:`${g} g protein al`, ok: v >= need, pct: v/need,
        txt: has ? `${v} / ${g} g` : "Beslenme günlüğüne ekledikçe dolar",
        why:`Hedefin %90'ı olan ${need} g'a ulaşınca işaretlenir. Şu an ${v} g.` };
    }
    case "water": {
      const v = entry.water || 0, g = program.water, need = Math.round(g*0.9);
      return { title:`${g} ml su iç`, ok: v >= need, pct: v/need, txt:`${v} / ${g} ml`,
        why:`${need} ml'ye ulaşınca işaretlenir. ${Math.max(need - v, 0)} ml kaldı.` };
    }
    case "sleep": {
      const v = typeof entry.sleep === "number" ? entry.sleep : null;
      const [lo, hi] = sleepBand();
      const long = v !== null && v > hi + 0.5;
      return { title:`${lo}-${hi} saat uyu`, ok: v !== null && v >= lo, pct: v === null ? 0 : v/lo, warn: long || (v !== null && v < lo - 1),
        txt: v === null ? "Uyku girilmedi" : durTxt(Math.round(v*60)) + (long ? ` · düzenli olarak ${hi} saati aşmak yorgunluk işareti olabilir` : v < lo ? ` · ${lo} saatin altında` : ""),
        why: v === null ? "Uyku kadranıyla girince işaretlenir." : `Kendi hedefin en az ${lo} saat.` };
    }
    case "weigh": {
      const v = typeof entry.weight === "number" ? entry.weight : null;
      const gun = key === today() ? "Bugün" : "O gün";
    return { title:"Sabah kilo ölçümü", ok: v !== null, pct: v === null ? 0 : 1,
        txt: v === null ? `${gun} tartılmadın` : `${v.toFixed(1)} kg girildi`,
        why:`${gun}ün kilosu girilince işaretlenir.` };
    }
    case "steps": {
      const g = stepGoal();
      if (!g) return null;
      const v = typeof entry.steps === "number" ? entry.steps : 0;
      return { title:`${g} adım at`, ok: v >= g, pct: v/g, txt:`${v} / ${g} adım`,
        why:`${g} adıma ulaşınca işaretlenir. ${Math.max(g - v, 0)} adım kaldı.` };
    }
    case "train": {
      const ses = program.training.days.find(d => d.wd === isoWeekday(key));
      if (!ses || !ses.b) return null;
      const list = exercisesOf(ses);
      const n = list.filter(x => liftHas((entry.lifts || {})[x])).length;
      return { title:`Antrenman: ${ses.t}`, ok: n === list.length, pct: n/list.length,
        txt:`${n}/${list.length} hareket kaydedildi`,
        why:"Antrenman kaydındaki bütün hareketler girilince işaretlenir." };
    }
  }
  return null;
}

/* Bugünün önerilerini verilerle eşitler; bir şey değiştiyse true döner. */
function syncSuggested(entry, program, key){
  let changed = false;
  for (const t of entry.tasks){
    if (!t.suggested) continue;
    const a = autoInfo(t, entry, program, key);
    if (!a) continue;
    const kind = taskKind(t);
    if (t.kind !== kind){ t.kind = kind; changed = true; }
    if (t.title !== a.title){ t.title = a.title; changed = true; }
    if (t.man !== undefined){ delete t.man; changed = true; }
    if (t.done !== a.ok){ t.done = a.ok; changed = true; }
  }
  return changed;
}

/* Öneriye dokununca verinin girildiği yere gidilir. */
const GOTO_LABEL = { kcal:"beslenme günlüğüne git", protein:"beslenme günlüğüne git", water:"su girişine git",
  sleep:"uyku girişine git", weigh:"kilo girişine git", train:"antrenman kaydına git", steps:"adım girişine git" };
function openFold(key){
  state.ui = state.ui || {}; state.ui.fold = state.ui.fold || {};
  state.ui.fold[key] = true;
}
function goToTask(kind, key){
  if (kind === "kcal" || kind === "protein"){
    tab = "meals"; mealTab = "log"; render(); window.scrollTo(0,0); return;
  }
  if (kind === "train"){
    tab = "plan"; planTab = "log"; render(); window.scrollTo(0,0); return;
  }
  tab = "today";
  if (kind !== "own"){ if (goalOpen !== kind) goalJust = kind; goalOpen = kind; }
  render();
  const el = kind === "own" ? app.querySelector(".g[data-own]")
           : app.querySelector(`[data-goal="${kind}"]`)?.closest(".g");
  if (!el) return;
  el.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block:"center" });
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400);
  if (kind === "weigh") setTimeout(() => document.getElementById("i-weight")?.focus({ preventScroll:true }), 350);
  if (kind === "steps") setTimeout(() => document.getElementById("i-steps")?.focus({ preventScroll:true }), 350);
}

function taskRow(t, info){
  return `<div class="task" data-done="${t.done?1:0}">
    <button class="check" data-done="${t.done?1:0}" data-id="${t.id}" aria-label="Tamamlandı olarak işaretle"></button>
    ${info ? `<button class="task-title task-go" data-goto="${taskKind(t)}" aria-label="${esc(t.title)}: ${GOTO_LABEL[taskKind(t)]}">` : `<span class="task-title">`}<span class="tt">${esc(t.title)}</span>${info ? `<span class="task-sub${info.warn ? " warn" : ""}">${info.warn ? "⚠️ " : ""}${esc(info.txt)}</span>
      ${info.ok ? "" : `<span class="task-bar"><i style="width:${clamp(info.pct*100,0,100).toFixed(0)}%"></i></span>`}` : ""}${info ? `</button><svg class="ico task-chev" aria-hidden="true"><use href="#i-next"/></svg>` : `</span>`}

}

function wirePastBar(key){
  const bt = document.getElementById("back-today");
  if (bt) bt.onclick = () => {
    viewDate = null; calSel = today();
    saveState(state); render(); window.scrollTo(0,0);
  };
  const go = d => {
    const k = shiftDays(key, d);
    if (k >= today()) { viewDate = null; calSel = today(); }
    else { ensureDay(k); viewDate = k; calSel = k; }
    resetMealUI();          /* açık besin paneli başka güne taşınmasın */
    saveState(state); render(); window.scrollTo(0,0);
  };
  const pp = document.getElementById("pd-prev"); if (pp) pp.onclick = () => go(-1);
  const pn = document.getElementById("pd-next"); if (pn) pn.onclick = () => go(1);
}

function wireToday(entry, program, key){
  key = key || today();
  /* mark: elle girildiğini kaydeden bayrak; günlük devralmadan önce sorulur. */
  const bind = (id, field, int, mark) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.onchange = async () => {
      const n = num(el.value);
      if (n === null){ delete entry[field]; if (mark) delete entry[mark]; }
      else { entry[field] = int ? Math.round(n) : n; if (mark) entry[mark] = true; }
      await saveState(state); render();
    };
  };
  bind("i-weight","weight");
  wireSleep(entry);
  app.querySelectorAll("[data-cup]").forEach(b => b.onclick = async () => {
    const i = +b.dataset.cup, cur = Math.floor((entry.water || 0) / CUP);
    const n = (i + 1 === cur) ? i : i + 1;          /* son dolu bardağa dokunmak onu boşaltır */
    if (n) entry.water = n * CUP; else delete entry.water;
    await saveState(state); render();
  });
  bind("i-kcal","kcal",true,"kcalManual"); bind("i-water","water",true);
  const st = document.getElementById("i-steps");
  if (st) st.onchange = async () => {
    const n = num(st.value);
    if (n === null || n < 0) delete entry.steps; else entry.steps = Math.round(n);
    await saveState(state); render();
  };

  app.querySelectorAll("[data-goal]").forEach(b => b.onclick = () => {
    const k = b.dataset.goal;
    if (k === "protein"){ navTo(() => goToTask("protein", key), 1); return; }
    if (goalOpen === k){
      const row = b.closest(".g");
      goalOpen = null;
      if (reduceMotion()){ render(); return; }
      row.classList.add("closing");
      setTimeout(render, 190);
      return;
    }
    goalOpen = k; goalJust = k;
    render();
  });
  goalJust = null;
  /* halka eski değerinden yenisine dolar; yeni biten hedef parıldar */
  const fg = app.querySelector(".gh-fg[data-to]");
  if (fg) requestAnimationFrame(() => requestAnimationFrame(() => { fg.style.strokeDashoffset = fg.dataset.to; }));
  app.querySelectorAll(".g.just .g-ok").forEach(el => setTimeout(() => sparkle(el), 200));
  const rn = app.querySelector(".gh-n b.roll");
  if (rn && rn.dataset.to !== rn.dataset.v) requestAnimationFrame(() => requestAnimationFrame(() => rollSet(rn, rn.dataset.to)));
  app.querySelectorAll("[data-wk]").forEach(b => b.onclick = () => {
    const k = b.dataset.wk;
    if (k === key) return;
    navTo(() => {
      if (k >= today()){ viewDate = null; calSel = today(); }
      else { ensureDay(k); viewDate = k; calSel = k; }
      goalOpen = null; resetMealUI();
      saveState(state); render();
    }, k > key ? 1 : -1, "k-day");
  });
  const ga = document.getElementById("goal-add");
  if (ga) ga.onclick = () => openGoalSheet(key);
  const gc = document.getElementById("gh-cal");
  if (gc) gc.onclick = () => { tab = "calendar"; render(); window.scrollTo(0,0); };

  const quick = (attr, field) => app.querySelectorAll(`[data-${attr}]`).forEach(b => b.onclick = async () => {
    entry[field] = (entry[field] || 0) + parseInt(b.dataset[attr === "add-water" ? "addWater" : "addKcal"], 10);
    if (field === "kcal") entry.kcalManual = true;
    await saveState(state); render();
  });
  quick("add-water","water"); quick("add-kcal","kcal");

  app.querySelectorAll(".check[data-id]").forEach(b => b.onclick = async () => {
    const t = entry.tasks.find(x => String(x.id) === b.dataset.id);
    if (!t) return;
    const info = t.suggested ? autoInfo(t, entry, currentProgram(), key) : null;
    if (info){
      toast(info.ok ? "Bu görev girdiğin verilerden işaretlendi." : `Henüz tamamlanmadı. ${info.why || ""}`);
      return;
    }
    t.done = !t.done;
    await saveState(state); render();
    if (t.done){
      const nb = app.querySelector(`.check[data-id="${b.dataset.id}"]`);
      sparkle(nb);
    }
  });

  app.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => goToTask(b.dataset.goto, key));

  app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    entry.tasks = entry.tasks.filter(x => String(x.id) !== b.dataset.del);
    await saveState(state); render();
  });

  const gtr = document.getElementById("go-train");
  if (gtr) gtr.onclick = () => { tab = "plan"; planTab = "log"; render(); window.scrollTo(0,0); };
  wireFolds();

}

/* Vücut ölçüleri Ben sayfasında girilir. */
function wireBody(entry){
  if (!entry) return;
  const yagEl = document.getElementById("bd-yag");
  if (yagEl) yagEl.onchange = async () => {
    const n = num(yagEl.value);
    entry.body = entry.body || {};
    if (n === null || n <= 2 || n >= 70) delete entry.body.yag; else entry.body.yag = Math.round(n*10)/10;
    if (!Object.keys(entry.body).length) delete entry.body;
    /* Program hesabı en son girilen yağ oranını kullansın. */
    const last = bodySeries("yag", 3650).pop();
    if (last) state.profile.bodyFat = last.v;
    await saveState(state); render();
  };

  BODY.forEach(([k]) => {
    const el = document.getElementById("bd-" + k);
    if (!el) return;
    el.onchange = async () => {
      entry.body = entry.body || {};
      const n = num(el.value);
      if (n === null) delete entry.body[k]; else entry.body[k] = n;
      if (!Object.keys(entry.body).length) delete entry.body;
      await saveState(state); render();
    };
  });
}

/* ---- beslenme ---- */
const norm = s => s.toLowerCase()
  .replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
  .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c")
  /* "İ".toLowerCase() geriye i + birleşik nokta bırakıyor; ayrıştırıp temizliyoruz. */
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"");

function allFoods(){
  return Object.entries(FOODS).concat(Object.entries(state.customFoods || {}));
}

function logTotals(entry){
  const t = { kcal:0, p:0, c:0, f:0, lif:0 };
  const micros = new Set();
  for (const it of (entry.log || [])){
    t.p += it.p * it.g/100; t.c += it.c * it.g/100; t.f += it.f * it.g/100;
    t.lif += (it.lif || 0) * it.g/100;
    (it.v || []).forEach(x => micros.add(x));
  }
  t.kcal = t.p*4 + t.c*4 + t.f*9;
  return { kcal:Math.round(t.kcal), p:Math.round(t.p), c:Math.round(t.c),
           f:Math.round(t.f), lif:Math.round(t.lif), micros };
}

/* Lif için yaygın referans: 1000 kcal başına ~14 g. */
const fiberTarget = program => Math.round(program.kcal / 1000 * 14);

/* Günlükte kayıt varsa günün kalorisi oradan gelir; elle girilen değeri ezer. */
function syncKcal(entry){
  if (entry.log && entry.log.length){ entry.kcal = logTotals(entry).kcal; delete entry.kcalManual; }
  else if (entry.logCleared) { delete entry.kcal; delete entry.logCleared; delete entry.kcalManual; }
}

function mealsView(program){
  const entry = ensureDay(vKey());
  const body = mealTab === "plan" ? planView(program)
             : mealTab === "log" ? logView(program, entry)
             : recipesView();
  return `<div class="seg">
    ${[["log","Günlüğüm"],["plan","Öneriler"],["recipes","Tarifler"]].map(([k,l]) =>
      `<button data-meal-tab="${k}" aria-current="${mealTab===k}">${l}</button>`).join("")}
  </div>` + body;
}

/* Tarif makroları malzemelerden hesaplanıyor, ayrıca girilmiyor. */
function recipeMacros(r){
  let g = 0, p = 0, c = 0, f = 0, lif = 0;
  const v = new Set();
  for (const [k, grams] of r.ing){
    const food = FOODS[k];
    if (!food) continue;
    g += grams;
    p += food.p*grams/100; c += food.c*grams/100; f += food.f*grams/100; lif += (food.lif||0)*grams/100;
    (food.v || []).forEach(x => v.add(x));
  }
  const srv = r.srv || 1;
  return {
    gPer: Math.round(g / srv),
    per100: { p: p/g*100, c: c/g*100, f: f/g*100, lif: lif/g*100 },
    serving: { kcal:Math.round((p*4+c*4+f*9)/srv), p:Math.round(p/srv), c:Math.round(c/srv),
               f:Math.round(f/srv), lif:Math.round(lif/srv) },
    v: [...v]
  };
}

function recipeCard(r, idx){
  const m = recipeMacros(r);
  const open = recipeOpen === idx;
  return `<section>
    <div class="item rec" data-recipe="${idx}">${iconBox(r.i)}
      <div class="item-main"><h3>${r.n}</h3>
        <p>${r.t} · ${r.srv} porsiyon · P${m.serving.p} K${m.serving.c} Y${m.serving.f} · lif ${m.serving.lif} g</p></div>
      <span class="k num">${m.serving.kcal} kcal</span>
    </div>
    ${open ? `<div class="rec-body">
      <h4>Malzemeler (${r.srv} porsiyon)</h4>
      ${r.ing.map(([k,g]) => { const f = FOODS[k]; return f
        ? `<div class="rec-ing"><span>${f.n}</span><span>${f.unit ? `${Math.round(g/f.unit)} ${f.unitName}` : `${g} g`}</span></div>` : ""; }).join("")}
      <h4>Hazırlanışı</h4>
      <ol>${r.steps.map(s => `<li>${s}</li>`).join("")}</ol>
      <button class="ghost" data-recipe-add="${idx}" style="margin-top:6px">Günlüğüme 1 porsiyon ekle</button>
    </div>` : ""}
  </section>`;
}

/* Arama boşken üç tarif gösteriyoruz; "başka tarifler" listeyi kaydırıyor. */
/* Tarifin türü de aranabilsin: "balık" yazınca hamsi ve somon tarifleri de çıksın. */
const CAT_WORDS = { fish:"balık deniz ürünü", poultry:"tavuk kümes beyaz et", meat:"et kırmızı et kıyma",
  legume:"baklagil bakliyat", veg:"sebze zeytinyağlı", grain:"tahıl hamur pilav",
  dairy:"süt ürünü yoğurt", egg:"yumurta kahvaltı", nuts:"kuruyemiş", potato:"patates", bread:"hamur", fruit:"meyve tatlı" };

const recipeFits = r => r.ing.every(([k]) => foodAllowed(k, currentDiet()));

/* Parantezli ekleri at: "Pilav (pişmiş)" → "pilav" */
const plainName = n => norm(n.replace(/\s*\(.*?\)/g, "").trim());

/* Bir besin için tarif bağlantısı: kendisi bir yemekse o tarif,
   değilse onu malzeme olarak kullanan tarifler. */
function recipeFor(key){
  const f = foodOf(key);
  if (!f) return null;
  const n = plainName(f.n);
  if (n.length < 3) return null;
  /* Sadece tam ad eşleşmesi "bu besinin tarifi" sayılır. Alt dize eşleşmesi
     "Yumurta" → "Yumurtalı ıspanak" gibi yanıltıcı bağlantılar üretiyordu. */
  const idx = RECIPES.findIndex(r => plainName(r.n) === n);
  const uses = RECIPES.filter(r => r.ing.some(([k]) => k === key)).length;
  if (idx < 0 && !uses) return null;
  return { idx, uses, q: f.n.replace(/\s*\(.*?\)/g, "").trim() };
}

function recipeList(){
  const q = norm(recipeQuery.trim());
  if (q.length >= 2){
    const hits = RECIPES.map((r,i) => [r,i]).filter(([r]) =>
      matchScore(r.n, q) > 0
      || norm(CAT_WORDS[r.i] || "").includes(q)
      || r.ing.some(([k]) => FOODS[k] && norm(FOODS[k].n).includes(q)));
    if (!hits.length) return `<section><div class="empty">"${esc(recipeQuery)}" için tarif bulunamadı. Yemek adı ya da malzeme adıyla arayabilirsin.</div></section>`;
    return `<div class="metric-note" style="margin:0 4px 12px">${hits.length} tarif bulundu</div>`
      + hits.map(([r,i]) => recipeCard(r,i)).join("");
  }
  const pool = RECIPES.map((r,i) => [r,i]).filter(([r]) => recipeFits(r));
  if (!pool.length) return `<section><div class="empty">Seçtiğin beslenme türüne uyan hazır tarif yok. Arama kutusundan tüm tariflere bakabilirsin.</div></section>`;
  const start = recipeOffset % pool.length;
  const idxs = [0,1,2].map(k => pool[(start + k) % pool.length]);
  return (currentDiet() !== "hepsi"
      ? `<div class="metric-note" style="margin:0 4px 12px">${DIETS[currentDiet()]} beslenmeye uyan ${pool.length} tarif</div>` : "")
    + idxs.map(([r,i]) => recipeCard(r, i)).join("")
    + `<section><button class="ghost" id="rec-more">Başka tarifler göster</button></section>`;
}

function recipesView(){
  return `
  <section>
    <h2>Tarifler <span class="count">${RECIPES.length} tarif</span></h2>
    <input id="rec-q" type="text" placeholder="Ara: karnıyarık, mercimek, tavuk…" value="${esc(recipeQuery)}" autocomplete="off">
    <div class="metric-note" style="margin-top:10px">Yemek adıyla da malzemeyle de arayabilirsin. Değerler bir porsiyon içindir ve malzemelerden hesaplanır.</div>
  </section>
  <div id="rec-results">${recipeList()}</div>`;
}

function macroRow(label, got, target, unit, ic, color){
  return `<div class="macro">${iconBox(ic)}<div class="lbl">${label}
    <div class="mbar"><i style="width:${clamp(got/target*100,0,100)}%;background:var(--${color||"band"})"></i></div></div>
    <span class="v num">${got}${unit}<span class="tgt">/ ${target}${unit}</span></span></div>`;
}

function microSection(micros){
  const keys = Object.keys(NUTRIENTS);
  const missing = keys.filter(k => !micros.has(k));
  return fold("micro", "Mikro besinler", `${keys.length - missing.length}/${keys.length}`, `
    <div class="pills">${keys.map(k => micros.has(k)
      ? `<span class="pill on"><svg class="ico"><use href="#i-check"/></svg>${NUTRIENTS[k].n}</span>`
      : `<span class="pill">${NUTRIENTS[k].n}</span>`).join("")}</div>
    ${missing.length ? `<div class="metric-note" style="margin-top:14px">
      ${missing.slice(0,4).map(k => `<b>${NUTRIENTS[k].n}</b> için: ${NUTRIENTS[k].src}`).join("<br>")}
    </div>` : `<div class="metric-note" style="margin-top:14px">On dört mikro besin kaynağının hepsinden bir şeyler almışsın.</div>`}
    <div class="metric-note" style="margin-top:12px">Bu bölüm miligram ölçmez; hangi besin grubundan bir şey yediğini gösterir. Ayrıntısı aşağıda.</div>`);
}

function logView(program, entry){
  const log = entry.log || [];
  const tot = logTotals(entry);
  const fib = fiberTarget(program);

  return `
  ${favBlock(entry)}
  <section>
    <h2>${onToday() ? "Bugün aldığın" : "O gün aldığın"} <span class="count">${tot.kcal} / ${program.kcal} kcal</span></h2>
    ${macroRow("Kalori", tot.kcal, program.kcal, "", "grain", "band")}
    ${macroRow("Protein", tot.p, program.protein, " g", "poultry", "mp")}
    ${macroRow("Karbonhidrat", tot.c, program.carb, " g", "bread", "mc")}
    ${macroRow("Yağ", tot.f, program.fat, " g", "oil", "mf")}
    ${macroRow("Lif", tot.lif, fib, " g", "veg", "ml")}
    ${tot.kcal > program.kcal * 1.1 ? `<div class="metric-note" style="margin-top:12px"><b class="out">Hedefi ${tot.kcal-program.kcal} kcal aştın.</b></div>`
      : tot.kcal ? `<div class="metric-note" style="margin-top:12px">Hedefe ${Math.max(program.kcal-tot.kcal,0)} kcal kaldı.</div>` : ""}
  </section>

  ${log.length ? microSection(tot.micros) : ""}

  ${mealCards(entry)}
  ${mealManager()}
  <div class="foot">Değerler ortalamadır; markalı ürünlerde ambalajdaki bilgiyi kullanmak daha doğru olur. Günlüğe kayıt girdiğin sürece Bugün sekmesindeki kalori alanı buradan hesaplanır.</div>`;
}

/* ---- dünün aynısı ----
   Kalemler kimlikleriyle birlikte kopyalanmaz; her kopya yeni kimlik alır
   ki düzenleme ve silme iki günü birden etkilemesin. */
/* Gün değişince açık kalan besin ekleme paneli, arama ve düzenleme
   yanlış güne yazılıyormuş gibi görünüyordu; gün değiştiren yollar sıfırlar. */
function resetMealUI(){
  addOpen = null; logPick = null; logQuery = ""; logCat = null; editLog = null;
  mealAddOpen = false;
}

function ydayLog(){
  const p = state.days[shiftDays(vKey(), -1)];
  return (p && p.log) ? p.log : [];
}
function copyItems(entry, items){
  entry.log = entry.log || [];
  for (const it of items) entry.log.push({ ...it, id: Date.now() + Math.random() });
}

/* Her öğün kendi kartı: o öğünün kayıtları ve besin eklemesi bir arada. */
function mealCards(entry){
  const log = entry.log || [];
  const list = slotList();
  const known = new Set(list.map(([k]) => k));
  const fallback = list.length ? list[list.length-1][0] : "aksam";
  const slotOf = x => { const sId = x.slot || fallback; return known.has(sId) ? sId : "__other"; };
  const kcalOf = items => Math.round(items.reduce((a,it) => a + (it.p*4+it.c*4+it.f*9)*it.g/100, 0));

  const cards = list.map(([k,l]) => {
    const items = log.filter(x => slotOf(x) === k);
    const yIt = items.length ? [] : ydayLog().filter(x => slotOf(x) === k);
    return `<section>
      <h2>${esc(l)}${items.length ? `<span class="count">${kcalOf(items)} kcal</span>` : ""}</h2>
      ${items.length ? items.map(logLine).join("")
        : `<div class="empty">Bu öğüne henüz bir şey eklemedin.</div>`}
      ${addOpen === k ? addPanel()
        : `<button class="ghost" data-addfood="${k}" style="margin-top:12px">Besin ekle</button>
           ${yIt.length ? `<button class="ghost rep" data-copymeal="${k}" style="margin-top:8px">
             ↺ ${onToday() ? "Dünküyle" : "Bir önceki günle"} aynı (${yIt.length} kalem · ${kcalOf(yIt)} kcal)</button>` : ""}`}
    </section>`;
  });

  const other = log.filter(x => slotOf(x) === "__other");
  if (other.length) cards.push(`<section>
    <h2>Diğer <span class="count">${kcalOf(other)} kcal</span></h2>
    ${other.map(logLine).join("")}
    <div class="metric-note" style="margin-top:10px">Kaldırdığın bir öğüne ait kayıtlar. Silebilir ya da o öğünü geri ekleyebilirsin.</div>
  </section>`);

  return cards.join("");
}

/* Arama paneli açık olduğu öğünün kartının içinde durur; öğün zaten belli
   olduğu için ayrıca "hangi öğün" sormaya gerek kalmıyor. */
function addPanel(){
  return `<div class="pick" style="margin-top:12px">
    <input id="food-q" type="text" placeholder="Ara: karnıyarık, hellim, kivi…" value="${esc(logQuery)}" autocomplete="off">
    ${logQuery.trim().length >= 2 ? "" : catChips()}
    <div class="res" id="food-results">${resultsHTML()}</div>
    ${logPick ? pickCard() : ""}
    <div class="row" style="margin-top:12px">
      <button class="ghost" id="custom-toggle">Kendim tanımlayayım</button>
      <button class="ghost" id="add-close" style="flex:0 0 92px">Kapat</button>
    </div>
    <div id="custom-form"></div>
  </div>`;
}

function mealManager(){
  const list = userMeals();
  const shares = mealShares(list);
  const T = MEAL_TIMES.find(x => x.key === mealAddTime) || MEAL_TIMES[1];
  return `<section>
    <h2>Öğünlerim <span class="count">${list.length}</span></h2>
    ${list.map((m,i) => `<div class="rt">${iconBox(m.cat === "kahvalti" ? "egg" : m.cat === "ara" ? "fruit" : "grain")}
      <div class="m"><h3>${esc(m.name)}</h3><p>günlük hedefin %${Math.round(shares[i]*100)} kadarı · ${m.h}:00 civarı</p></div>
      ${list.length > 1 ? `<button class="del" data-meal-del="${m.id}" aria-label="Öğünü kaldır">×</button>` : ""}
    </div>`).join("")}
    ${mealAddOpen ? `<div class="pick">
      <div class="field"><label for="ml-name">Öğün adı</label>
        <input id="ml-name" type="text" placeholder="Örn. Öğle yemeği" autocomplete="off"></div>
      <label>Ne zaman</label>
      <div class="chips">${MEAL_TIMES.map(x =>
        `<button class="chip${mealAddTime===x.key?" sel":""}" data-meal-time="${x.key}">${x.label}</button>`).join("")}</div>
      <div class="row" style="margin-top:14px">
        <button id="ml-save">Ekle</button>
        <button class="ghost" id="ml-cancel" style="flex:0 0 100px">Vazgeç</button>
      </div>
      <div class="metric-note" style="margin-top:10px">Eklediğin öğün hem günlükte hem önerilerde çıkar; günlük hedef öğünler arasında yeniden bölünür.</div>
    </div>` : `<button class="ghost" id="ml-add" style="margin-top:12px">Öğün ekle</button>`}
  </section>`;
}

function logBySlot(log){
  const list = slotList();
  const known = new Set(list.map(([k]) => k));
  /* Öğünü belirtilmemiş eski kayıtlar son öğüne düşer. */
  const fallback = list.length ? list[list.length-1][0] : "aksam";
  const slotOf = x => { const sId = x.slot || fallback; return known.has(sId) ? sId : "__other"; };
  const groups = list.map(([k,l]) => [k, l, log.filter(x => slotOf(x) === k)]);
  const other = log.filter(x => slotOf(x) === "__other");
  if (other.length) groups.push(["__other", "Diğer", other]);
  return groups.filter(([,,items]) => items.length).map(([,l,items]) => {
    const kc = items.reduce((a,it) => a + (it.p*4+it.c*4+it.f*9)*it.g/100, 0);
    return `<div class="slot-head"><span>${l}</span><span class="num">${Math.round(kc)} kcal</span></div>
      ${items.map(logLine).join("")}`;
  }).join("");
}

function logLine(it){
  const open = editLog === String(it.id);
  return `<div class="log-line${open ? " editing" : ""}">${iconBox(it.i || "grain")}
    <button class="m log-tap" data-log-edit="${it.id}" aria-expanded="${open}" aria-label="${esc(it.n)}, porsiyonu düzenle">
      <span class="lt-h">${esc(it.n)}</span><span class="lt-p">${amountText(it)} · P${Math.round(it.p*it.g/100)} K${Math.round(it.c*it.g/100)} Y${Math.round(it.f*it.g/100)}</span></button>
    <span class="k num">${Math.round((it.p*4+it.c*4+it.f*9)*it.g/100)} kcal</span>
    <button class="del" data-log-del="${it.id}" aria-label="Sil">×</button></div>
    ${open ? logEditor(it) : ""}`;
}

/* Günlükteki bir kalemin porsiyonunu ve öğününü değiştirme paneli */
function portionChips(f){
  const P = porsOf(f);
  if (f && f.unit) return [1,2,3].map(c => [c * f.unit, `${c} ${f.unitName}`]);
  if (P.length){
    const a = P[0];
    const seen = new Set();
    return (a.s || porSteps(a.g)).map(c => [Math.round(c*a.g), `${nfmt(c)} ${a.n}`])
      .concat(P.slice(1).map(x => [x.g, `1 ${x.n}`]))
      .concat([[100, "100 g"]])
      .filter(([,l]) => seen.has(l) ? false : (seen.add(l), true));
  }
  return [50,100,150,200].map(c => [c, `${c} g`]);
}
function logEditor(it){
  const f = it.k ? foodOf(it.k) : null;
  const unit = f && f.unit;
  const val = unit ? +(it.g / f.unit).toFixed(2) : it.g;
  return `<div class="pick log-edit">
    <div class="lbl-row"><label for="le-amt">Miktar (${unit ? esc(f.unitName) : "g"})</label>
      <span class="lbl-v num" id="le-kcal">${Math.round((it.p*4+it.c*4+it.f*9)*it.g/100)} kcal</span></div>
    <div class="le-row">
      <button class="lf-sb" data-le-step="-1" aria-label="Azalt">−</button>
      <input id="le-amt" type="number" inputmode="decimal" value="${val}" data-unit="${unit ? f.unit : 1}">
      <button class="lf-sb" data-le-step="1" aria-label="Artır">+</button>
    </div>
    <div class="chips">${portionChips(f).map(([g,l]) => `<button class="chip${Math.abs(g - it.g) < 1 ? " sel" : ""}" data-le-g="${g}">${esc(l)}</button>`).join("")}</div>
    <label for="le-slot" style="margin-top:12px">Öğün</label>
    <select id="le-slot">${slotList().map(([k,l]) => `<option value="${k}"${(it.slot || "") === k ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>
    <div class="row" style="margin-top:14px">
      <button id="le-save">Kaydet</button>
      <button class="ghost" id="le-cancel" style="flex:0 0 100px">Vazgeç</button>
    </div>
  </div>`;
}

function favBlock(entry){
  const favs = favoriteFoods();
  const y = shiftDays(vKey(), -1);
  const yLog = (state.days[y] && state.days[y].log) || [];
  if (!favs.length && !yLog.length) return "";
  return `<section class="favs">
    <h2>Sık yediklerin <span class="count">dokun, eklensin</span></h2>
    ${favs.length ? `<div class="fav">${favs.map(([k,c]) =>
      `<button data-fav="${k}" data-fav-g="${c.g}" data-fav-slot="${c.slot||""}"><b>${esc(c.name)}</b> · ${c.g} g</button>`).join("")}</div>`
      : `<div class="empty">Besin ekledikçe sık kullandıkların burada birikecek.</div>`}
    ${yLog.length ? `<button class="ghost rep" id="copy-y" style="margin-top:14px">↺ ${onToday() ? "Dünün" : "Bir önceki günün"} tamamını kopyala (${yLog.length} kalem)</button>` : ""}
  </section>`;
}

function amountText(it){
  const f = foodOf(it.k);
  if (f && f.unit) { const u = it.g / f.unit; return `${Number.isInteger(u)?u:u.toFixed(1)} ${f.unitName} (${it.g} g)`; }
  /* Gramaj bir porsiyonun tam katıysa "2 dilim (60 g)" diye göster. */
  for (const x of porsOf(f)){
    const u = it.g / x.g;
    const r = Math.round(u * 2) / 2;
    if (r >= 0.5 && Math.abs(u - r) < 0.06) return `${nfmt(r)} ${x.n} (${it.g} g)`;
  }
  return `${it.g} g`;
}

/* Kategori: besinde açıkça yazılıysa o, yoksa simgesinden türetilir. */
const ICON_CAT = { poultry:"et", meat:"et", fish:"balik", dairy:"sut", egg:"kahvaltilik",
  grain:"tahil", bread:"tahil", legume:"baklagil", veg:"sebze", potato:"sebze",
  fruit:"meyve", nuts:"kuruyemis", oil:"yag", avocado:"meyve" };

const CAT_LABELS = { kahvaltilik:"Kahvaltılık", sarkuteri:"Şarküteri", spor:"Spor & protein", ara:"Ara öğün",
  yemek:"Ana yemek", et:"Et & tavuk", balik:"Balık", sut:"Süt ürünleri", sebze:"Sebze",
  meyve:"Meyve", tahil:"Tahıl & ekmek", baklagil:"Baklagil", kuruyemis:"Kuruyemiş", yag:"Yağ & zeytin" };

const foodCat = f => f.cat || ICON_CAT[f.i] || "tahil";

function catCounts(){
  const c = {};
  for (const [,f] of allFoods()) { const k = foodCat(f); c[k] = (c[k]||0) + 1; }
  return c;
}

function foodRow(k, f){
  const P = porsOf(f);
  const per = f.unit ? ` · 1 ${f.unitName} ${Math.round((f.p*4+f.c*4+f.f*9)*f.unit/100)} kcal`
    : P.length ? ` · 1 ${P[0].n} ${Math.round((f.p*4+f.c*4+f.f*9)*P[0].g/100)} kcal` : "";
  return `<div class="item" data-food="${k}">${iconBox(f.i || "grain")}
    <div class="item-main"><h3>${esc(f.n)}</h3><p>100 g: ${Math.round(f.p*4+f.c*4+f.f*9)} kcal${per}</p></div>
    <span class="add">+</span></div>`;
}

/* Kelime sırasından bağımsız arama: sorgudaki her kelime adın bir kelimesinde
   geçmeli. Tam kelime > kelime başı > kelime içi diye puanlanır, böylece
   "hindi" yazınca "Hindi salam" "Hindistan cevizi"nden önce gelir. */
function matchScore(text, q){
  const words = norm(text).split(/[^a-z0-9]+/).filter(Boolean);
  const toks = norm(q).split(/[^a-z0-9]+/).filter(Boolean);
  if (!toks.length) return 0;
  /* Türkçe ünsüz yumuşaması: ek alınca sondaki k→ğ, p→b, t→d, ç→c olur
     ("ekmek" → "ekmeği"). Normalleştirmede ğ→g olduğu için bunları da dene. */
  /* Yalnız verimli olan k→ğ ve p→b; t→d "süt"ü "suda" ile eşleştiriyordu. */
  const soft = t => {
    const m = { k:"g", p:"b" };
    const last = t[t.length-1];
    return t.length >= 3 && m[last] ? t.slice(0,-1) + m[last] : null;
  };
  let score = 0;
  for (const t of toks){
    let best = 0;
    const ts = soft(t);
    for (const w of words){
      if (w === t) { best = 3; break; }
      /* "ekmeği" = "ekmek"in kendisi; kısa ekli yumuşamış hal tam eşleşme sayılır */
      if (ts && w.startsWith(ts) && w.length - ts.length <= 2) { best = 3; break; }
      if (w.startsWith(t) || (ts && w.startsWith(ts))) best = Math.max(best, 2);
      else if (t.length >= 3 && w.includes(t)) best = Math.max(best, 1);
    }
    if (!best) return 0;
    score += best;
  }
  return score;
}
/* Ad eşleşmesi takma ad eşleşmesinden biraz öne geçer. */
function foodScore(f, q){
  const a = matchScore(f.n, q);
  if (a) return a + 0.5;
  return f.a ? matchScore(f.n + " " + f.a, q) : 0;
}
/* Bir besinin ne kadar "temel" olduğu: hazır öğün setlerinde ve tariflerde
   kaç kez geçtiği. Eşit puanlı aramada "Tavuk göğsü" "Tavuk şiş"in önüne geçsin. */
let POP_CACHE = null;
function foodPop(k){
  if (!POP_CACHE){
    POP_CACHE = {};
    for (const set of MEAL_SETS) for (const m of set.meals)
      for (const x of [m.p, m.c, m.f]) POP_CACHE[x] = (POP_CACHE[x]||0) + 1;
    for (const r of RECIPES) for (const [x] of r.ing) POP_CACHE[x] = (POP_CACHE[x]||0) + 1;
  }
  return POP_CACHE[k] || 0;
}

function searchFoods(q, limit){
  const use = foodUsage();
  /* Eşit puanda önce sık kullandığın besin, sonra temel besin (spor ürünü ya da
     atıştırmalık değil), sonra kısa ad: "yulaf" → önce Yulaf ezmesi, sonra barı. */
  const side = f => (f.cat === "spor" || f.cat === "ara") ? 1 : 0;
  return allFoods()
    .map(([k,f]) => [k, f, foodScore(f, q)])
    .filter(x => x[2] > 0)
    .sort((a,b) => b[2] - a[2] || (use[b[0]]||0) - (use[a[0]]||0)
                 || side(a[1]) - side(b[1]) || foodPop(b[0]) - foodPop(a[0])
                 || a[1].n.length - b[1].n.length)
    .slice(0, limit)
    .map(([k,f]) => [k,f]);
}

}

/* Porsiyon çokluğu, bir porsiyonun ağırlığına göre seçilir:
   "1 dilim ekmek" ile "10 adet zeytin" aynı listeden gelmemeli. */
/* Porsiyon tek nesne ya da liste olabilir; ilki birincil ölçüdür. */
const porsOf = f => !f || !f.por ? [] : Array.isArray(f.por) ? f.por : [f.por];
function porSteps(g){
  if (g >= 250) return [0.5, 1, 1.5];   /* nar, greyfurt, kase çorba */
  if (g >= 10)  return [1, 2, 3];       /* dilim, adet, bardak, kaşık */
  return [2, 5, 10];                    /* zeytin, sarımsak dişi gibi küçükler */
}
const nfmt = n => Number.isInteger(n) ? String(n) : String(n).replace(".", ",");

function pickCard(){
  const f = foodOf(logPick);
  if (!f) return "";
  const def = f.unit ? 1 : 100;
  /* Birimli besinlerde giriş birim cinsinden; diğerlerinde gram,
     porsiyon rozetleri gram alanını doldurur. */
  const P = porsOf(f);
  let chips;
  if (f.unit) chips = [1,2,3].map(c => [c, `${c} ${f.unitName}`]);
  else if (P.length) {
    const a = P[0];
    chips = (a.s || porSteps(a.g)).map(c => [Math.round(c*a.g), `${nfmt(c)} ${a.n}`])
      .concat(P.slice(1).map(x => [x.g, `1 ${x.n}`]))
      .concat([[100, "100 g"]]);
    /* Aynı etiketi iki kez gösterme; aynı gramaj farklı adla gelebilir
       ("10 adet" ile "1 dürüm" ikisi de 200 g ama kullanıcı için farklı). */
    const seen = new Set();
    chips = chips.filter(([,l]) => seen.has(l) ? false : (seen.add(l), true));
  }
  else chips = [50,100,150,200].map(c => [c, `${c} g`]);
  return `<div class="pick" style="background:var(--surface);margin-top:14px">
    <h3>${esc(f.n)}</h3>
    <label for="pick-amt">Miktar (${f.unit ? f.unitName : "g"})</label>
    <input id="pick-amt" type="number" inputmode="decimal" value="${def}">
    <div class="chips">${chips.map(([v,l]) => `<button class="chip" data-amt="${v}">${esc(l)}</button>`).join("")}</div>
    ${f.unit ? `<div class="metric-note" style="margin-top:9px">1 ${esc(f.unitName)} ≈ ${f.unit} g</div>`
      : P.length ? `<div class="metric-note" style="margin-top:9px">${P.map(x => `1 ${esc(x.n)} ≈ ${x.g} g`).join(" · ")}</div>` : ""}
    <div class="row" style="margin-top:14px">
      <button id="pick-add">Ekle</button>
      <button class="ghost" id="pick-cancel" style="flex:0 0 100px">Vazgeç</button>
    </div>
  </div>`;
}

function fixResults(){
  const q = norm(fixQuery.trim());
  if (q.length < 2) return "";
  const hits = searchFoods(fixQuery, 8);
  if (!hits.length) return `<div class="empty" style="padding-top:10px">Bulunamadı.</div>`;
  return hits.map(([k,f]) => `<div class="item" data-fixfood="${k}">${iconBox(f.i || "grain")}
    <div class="item-main"><h3>${esc(f.n)}</h3><p>100 g: ${Math.round(f.p*4+f.c*4+f.f*9)} kcal</p></div>
    <span class="add">+</span></div>`).join("");
}

function planView(program){
  const plan = buildMeals(program, mealVariant);
  const off = Math.abs(plan.total.kcal - program.kcal);

  return `
  <section>
    <h2>${plan.setName} <span class="count">${plan.total.kcal} kcal</span></h2>
    ${macroRow("Kalori", plan.total.kcal, program.kcal, "", "grain", "band")}
    ${macroRow("Protein", plan.total.p, program.protein, " g", "poultry", "mp")}
    ${macroRow("Karbonhidrat", plan.total.c, program.carb, " g", "bread", "mc")}
    ${macroRow("Yağ", plan.total.f, program.fat, " g", "oil", "mf")}
    ${macroRow("Lif", plan.total.lif, fiberTarget(program), " g", "veg", "ml")}
    ${off > program.kcal * 0.08 ? `<div class="metric-note" style="margin-top:12px">
      <b class="out">Bu kombinasyon hedeften ${off} kcal ${plan.total.kcal>program.kcal?"yüksek":"düşük"}.</b>
      Yağlı besinler kendi yağını da getirdiği için bazı setler düşük kalorili hedeflere oturmuyor; başka kombinasyon dene.</div>` : ""}
    <button class="ghost" id="reroll" style="margin-top:14px">Başka kombinasyon</button>
  </section>
  ${prefsSection()}
  ${microSection(plan.micros)}
  ${plan.meals.map(m => `<section>
    <h2>${m.name} <span class="count">${m.kcal} kcal</span></h2>
    ${m.items.map(i => {
      const rec = i.key ? recipeFor(i.key) : null;
      return `<div class="item">${iconBox(i.icon)}
      ${rec
        ? `<button class="item-main tap" data-recipefor="${i.key}">
             <h3>${esc(i.text)}</h3>
             <p>${i.fixed?"senin girdiğin · ":""}${rec.idx >= 0 ? "tarifi gör" : rec.uses + " tarifte kullanılıyor"}</p>
           </button><svg class="ico chev" aria-hidden="true"><use href="#i-next"/></svg>`
        : `<div class="item-main"><h3>${esc(i.text)}</h3>${i.fixed?`<p>senin girdiğin</p>`:""}</div>`}
      ${i.fixed
        ? `<button class="del" data-fixdel="${m.slot}|${i.key}" aria-label="Kaldır">×</button>`
        : i.key ? `<button class="del" data-mex="${i.key}" aria-label="Bu besini önerilerden çıkar">×</button>` : ""}
    </div>`; }).join("")}
    ${m.full ? `<div class="metric-note" style="margin-top:10px">Bu öğün girdiklerinle doldu; günün kalanı diğer öğünlere dağıtıldı.</div>` : ""}
    <button class="ghost" data-fixadd="${m.slot}" style="margin-top:12px">${fixSlot===m.slot?"Kapat":"Kendi yiyeceğini ekle"}</button>
    ${fixSlot===m.slot ? fixPicker() : ""}
  </section>`).join("")}
  <div class="foot">Miktarlar pişmemiş/ham ağırlıktır. Ortalama besin değerlerine göre hesaplandığı için markaya ve pişirmeye göre sapma olur.</div>`;
}

function wireMeals(entry){
  app.querySelectorAll("[data-meal-tab]").forEach(b => b.onclick = () => {
    if (b.dataset.mealTab === mealTab) return;
    navTo(() => { mealTab = b.dataset.mealTab; render(); window.scrollTo(0,0); }, segDir(b), "k-seg");
  });

  const rq = document.getElementById("rec-q");
  if (rq) {
    /* Odak kaybolmasın diye sadece sonuç listesini tazeliyoruz. */
    rq.oninput = () => { recipeQuery = rq.value; recipeOpen = null;
      document.getElementById("rec-results").innerHTML = recipeList(); bindRecipes(entry); };
  }
  bindRecipes(entry);
  wireMealsRest(entry);
}

function bindRecipes(entry){
  const more = document.getElementById("rec-more");
  if (more) more.onclick = () => { recipeOffset += 3; recipeOpen = null;
    document.getElementById("rec-results").innerHTML = recipeList(); bindRecipes(entry); };

  app.querySelectorAll("[data-recipe]").forEach(b => b.onclick = () => {
    const i = Number(b.dataset.recipe);
    recipeOpen = recipeOpen === i ? null : i;
    document.getElementById("rec-results").innerHTML = recipeList();
    bindRecipes(entry);
  });

  app.querySelectorAll("[data-recipe-add]").forEach(b => b.onclick = async (ev) => {
    ev.stopPropagation();
    const r = RECIPES[Number(b.dataset.recipeAdd)];
    if (!(await guardKcal(entry))) return;
    const m = recipeMacros(r);
    entry.log = entry.log || [];
    entry.log.push({ id:Date.now()+Math.random(), n:r.n + " (1 porsiyon)", g:m.gPer,
      p:+m.per100.p.toFixed(1), c:+m.per100.c.toFixed(1), f:+m.per100.f.toFixed(1),
      lif:+m.per100.lif.toFixed(1), v:m.v, i:r.i, slot: defaultSlot() });
    syncKcal(entry);
    mealTab = "log"; recipeOpen = null; recipeQuery = "";
    await saveState(state); render(); window.scrollTo(0,0);
  });
}

function wireMealsRest(entry){
  const btn = document.getElementById("reroll");
  if (btn) btn.onclick = () => { mealVariant++; render(); };

  const ds = document.getElementById("diet-sel");
  if (ds) ds.onchange = async () => {
    mealPrefs().diet = ds.value;
    await saveState(state); render();
  };

  const um = document.getElementById("use-mine");
  if (um) um.onclick = async () => {
    const prefs = mealPrefs();
    prefs.useMine = !prefs.useMine;
    await saveState(state); render();
  };

  app.querySelectorAll("[data-mex]").forEach(b => b.onclick = async () => {
    const prefs = mealPrefs();
    if (!prefs.exclude.includes(b.dataset.mex)) prefs.exclude.push(b.dataset.mex);
    await saveState(state); render();
  });

  app.querySelectorAll("[data-munex]").forEach(b => b.onclick = async () => {
    const prefs = mealPrefs();
    prefs.exclude = prefs.exclude.filter(k => k !== b.dataset.munex);
    await saveState(state); render();
  });

  app.querySelectorAll("[data-recipefor]").forEach(b => b.onclick = () => {
    const rec = recipeFor(b.dataset.recipefor);
    if (!rec) return;
    mealTab = "recipes";
    recipeQuery = rec.q;
    recipeOpen = rec.idx >= 0 ? rec.idx : null;
    render(); window.scrollTo(0,0);
  });

  app.querySelectorAll("[data-fixadd]").forEach(b => b.onclick = () => {
    fixSlot = fixSlot === b.dataset.fixadd ? null : b.dataset.fixadd;
    fixQuery = ""; fixPick = null;
    render();
  });

  app.querySelectorAll("[data-fixdel]").forEach(b => b.onclick = async () => {
    const [slot, key] = b.dataset.fixdel.split("|");
    const prefs = mealPrefs();
    const list = prefs.fixed[slot] || [];
    const i = list.findIndex(x => x.k === key);
    if (i >= 0) list.splice(i, 1);
    await saveState(state); render();
  });

  const fq = document.getElementById("fix-q");
  if (fq) {
    fq.oninput = () => { fixQuery = fq.value;
      document.getElementById("fix-res").innerHTML = fixResults(); bindFix(); };
    bindFix();
    const amt = document.getElementById("fix-amt");
    if (amt) {
      app.querySelectorAll("[data-fixamt]").forEach(x => x.onclick = () => { amt.value = x.dataset.fixamt; });
      document.getElementById("fix-save").onclick = async () => {
        const food = foodOf(fixPick);
        const n = num(amt.value);
        if (!food || !n || n <= 0) return;
        const grams = Math.round(food.unit ? n * food.unit : n);
        const prefs = mealPrefs();
        const list = prefs.fixed[fixSlot] || (prefs.fixed[fixSlot] = []);
        const ex = list.find(x => x.k === fixPick);
        if (ex) ex.g = grams; else list.push({ k:fixPick, g:grams });
        fixPick = null; fixQuery = "";
        await saveState(state); render();
      };
    }
  }

  app.querySelectorAll("[data-fav]").forEach(b => b.onclick = async () => {
    if (!(await guardKcal(entry))) return;
    addFoodDirect(entry, b.dataset.fav, Number(b.dataset.favG), b.dataset.favSlot || null);
    await saveState(state); render();
  });

  app.querySelectorAll("[data-copymeal]").forEach(b => b.onclick = async () => {
    const list = slotList(), known = new Set(list.map(([x]) => x));
    const fallback = list.length ? list[list.length-1][0] : "aksam";
    const slot = b.dataset.copymeal;
    const items = ydayLog().filter(x => {
      const sId = x.slot || fallback;
      return (known.has(sId) ? sId : "__other") === slot;
    });
    if (!items.length) return;
    if (!(await guardKcal(entry))) return;
    copyItems(entry, items);
    syncKcal(entry);                 /* günlük doldu, günün kalorisi de güncellensin */
    await saveState(state); render();
    toast(`${items.length} kalem kopyalandı.`);
  });

  app.querySelectorAll("[data-addfood]").forEach(b => b.onclick = () => {
    addOpen = b.dataset.addfood;
    logQuery = ""; logCat = null; logPick = null;
    render();
    const el = document.getElementById("food-q");
    if (el) el.scrollIntoView({ behavior:"smooth", block:"center" });
  });
  const addClose = document.getElementById("add-close");
  if (addClose) addClose.onclick = () => { addOpen = null; logPick = null; logQuery = ""; logCat = null; render(); };

  const mlAdd = document.getElementById("ml-add");
  if (mlAdd) mlAdd.onclick = () => { mealAddOpen = true; render(); };
  const mlCancel = document.getElementById("ml-cancel");
  if (mlCancel) mlCancel.onclick = () => { mealAddOpen = false; render(); };
  app.querySelectorAll("[data-meal-time]").forEach(b => b.onclick = () => {
    mealAddTime = b.dataset.mealTime;
    app.querySelectorAll("[data-meal-time]").forEach(x => x.classList.toggle("sel", x === b));
  });
  const mlSave = document.getElementById("ml-save");
  if (mlSave) mlSave.onclick = async () => {
    const el = document.getElementById("ml-name");
    const name = el.value.trim();
    if (!name) { el.focus(); return; }
    const T = MEAL_TIMES.find(x => x.key === mealAddTime) || MEAL_TIMES[1];
    const p = mealPrefs();
    const id = "m" + Date.now().toString(36);
    p.meals.push({ id, name, w:T.w, h:T.h, cat:T.cat });
    mealAddOpen = false;
    await saveState(state); render();
  };
  app.querySelectorAll("[data-meal-del]").forEach(b => b.onclick = async () => {
    const p = mealPrefs();
    if (p.meals.length <= 1) return;
    p.meals = p.meals.filter(m => m.id !== b.dataset.mealDel);
    delete p.fixed[b.dataset.mealDel];
    await saveState(state); render();
  });

  const cy = document.getElementById("copy-y");
  if (cy) cy.onclick = async () => {
    const y = shiftDays(vKey(), -1);
    const yLog = (state.days[y] && state.days[y].log) || [];
    if (!yLog.length) return;
    if (!(await guardKcal(entry))) return;
    entry.log = entry.log || [];
    for (const it of yLog) entry.log.push({ ...it, id: Date.now()+Math.random() });
    syncKcal(entry);
    await saveState(state); render();
  };

  app.querySelectorAll("[data-log-edit]").forEach(b => b.onclick = () => {
    editLog = editLog === b.dataset.logEdit ? null : b.dataset.logEdit;
    render();
    const el = document.getElementById("le-amt");
    if (el) el.closest(".log-edit").scrollIntoView({ behavior:"smooth", block:"center" });
  });
  const leAmt = document.getElementById("le-amt");
  if (leAmt){
    const it = (entry.log || []).find(x => String(x.id) === editLog);
    const u = +leAmt.dataset.unit;
    const grams = () => { const n = num(leAmt.value); return n && n > 0 ? n * u : null; };
    const showK = () => { const g = grams(); document.getElementById("le-kcal").textContent =
      g ? `${Math.round((it.p*4+it.c*4+it.f*9)*g/100)} kcal` : "—"; };
    leAmt.oninput = showK;
    app.querySelectorAll("[data-le-g]").forEach(c => c.onclick = () => {
      leAmt.value = +(Number(c.dataset.leG) / u).toFixed(2); showK();

  q.oninput = () => {

    if (browsing !== qWasBrowsing){
      /* Kategori rozetleri girip çıkarken paneli baştan çiz, odağı geri ver. */

      const pos = q.selectionStart;
      render();
      const el = document.getElementById("food-q");

      return;
    }
    document.getElementById("food-results").innerHTML = resultsHTML();
    bindResults();
  };
  bindResults();

  app.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
    logCat = logCat === b.dataset.cat ? null : b.dataset.cat;

      entry.log = entry.log || [];
      entry.log.push({ id: Date.now()+Math.random(), k:logPick, n:f.n, g:Math.round(grams),
        p:f.p, c:f.c, f:f.f, lif:f.lif || 0, v:f.v || [], i:f.i, slot: addOpen || defaultSlot() });
      syncKcal(entry);
      logPick = null; logQuery = "";
      await saveState(state); render();
    };
  }


  const ct = document.getElementById("custom-toggle");
  if (ct) ct.onclick = () => {
    const box = document.getElementById("custom-form");
    if (box.innerHTML) { box.innerHTML = ""; return; }
    box.innerHTML = `<div class="pick">
      <h3>Kendi besinin</h3>
      <div class="field"><label for="cf-n">Ad</label><input id="cf-n" type="text" placeholder="Annemin mercimek köftesi"></div>
      <div class="row">

        <div class="field"><label for="cf-c">Karb.</label><input id="cf-c" type="number" inputmode="decimal" placeholder="g/100g"></div>
        <div class="field"><label for="cf-f">Yağ</label><input id="cf-f" type="number" inputmode="decimal" placeholder="g/100g"></div>
      </div>
      <button id="cf-save">Kaydet</button>
      <div class="metric-note" style="margin-top:10px">Değerleri 100 gram başına gir. Bir kere tanımladığın besin aramada çıkar.</div>
    </div>`;
    document.getElementById("cf-save").onclick = async () => {
      const n = document.getElementById("cf-n").value.trim();
      const p = num(document.getElementById("cf-p").value) || 0;
      const c = num(document.getElementById("cf-c").value) || 0;
      const f = num(document.getElementById("cf-f").value) || 0;

function favoriteFoods(){
  const counts = {};
  for (const k of Object.keys(state.days).sort())
    for (const it of (state.days[k].log || []))
      if (it.k && (FOODS[it.k] || (state.customFoods||{})[it.k])){
        const c = counts[it.k] || (counts[it.k] = { n:0, g:it.g, slot:it.slot, name:it.n });
        c.n++; c.g = it.g; c.slot = it.slot;   /* en son kullanılan gramaj */
      }
  return Object.entries(counts).sort((a,b) => b[1].n - a[1].n).slice(0, 8);
}

    <div class="field"><label for="fr-note">Not <span style="opacity:.7">(isteğe bağlı)</span></label>
      <input id="fr-note" type="text" placeholder="örn. tempolu, 5 km"

/* ---- antrenman kaydı ---- */
function exercisesOf(session){
  if (!session || !session.b) return [];
  if (/^\d+ tur:/.test(session.b)) return [session.b];   // devre: tek kalem
  return session.b.split(" · ");
}

function venueOf(program){
  const p = program && program.training && PROGRAMS[program.training.id];
  return p ? p.venue : "gym";
}

const BW_RX = /barfiks|chin-up|dips|plank|karın|hollow|şınav|l-sit|handstand|lever|muscle-up|pistol|shrimp|nordic|dragon|jump squat|superman|dead bug|glute bridge|step-up|sandalye|duvar|sıçrama|burpee|avustralya|havlu|ters kürek|lastik/;
const XKG_RX = /^(barfiks|chin-up|dips)/;

/* Hareket metnini giriş tipine çevirir:
   w  = set başına kg + tekrar     r  = set başına tekrar
   t  = set başına saniye           wc = kg + tamamlanan set
   n  = tamamlanan tur              c  = süre (+ mesafe)
   sw = yüzme: tamamlanan tekrar + süre   sd = mesafe + süre
   ok = yapıldı işareti */
function parseEx(s, venue){
  const l = s.toLocaleLowerCase("tr");
  let m;
  const base = s.replace(/\s*\d+\s*(×|set\b).*$/,"").trim() || s;
  if ((m = l.match(/^(\d+) tur:\s*(.*)$/)))
    return { t:"n", n:+m[1], name:"Devre", sub:s.replace(/^\d+ tur:\s*/,"").replace(/ · /g,", "), unit:"tur" };
  if ((m = l.match(/(\d+) tur\b/))){
    const rest = s.replace(/\s*\d+ tur\b/,"").trim();
    if (/^\(/.test(rest)) return { t:"n", n:+m[1], name:"Koşu-yürüyüş aralığı", sub:`${m[1]} tur · ${rest.slice(1,-1)}`, unit:"tur" };
    return { t:"n", n:+m[1], name:rest || s, sub:m[1]+" tur", unit:"tur" };
  }
  if ((m = l.match(/^(\d+)\s*×\s*(\d+) dk koşu/)))
    return { t:"n", n:+m[1], name:"Koşu", sub:s, unit:"blok" };
  if ((m = l.match(/(\d+)×(\d+) m\b/))){
    if (venue === "swim") return { t:"sw", n:+m[1], d:+m[2], name:s.replace(/^\d+×\d+ m\s*/,"").replace(/^./,c=>c.toLocaleUpperCase("tr")), sub:`${m[1]} × ${m[2]} m` };
    return { t:"wc", n:+m[1], name:base, sub:`${m[1]} × ${m[2]} m`, unit:"set" };
  }
  if ((m = l.match(/^(\d+) m (ısınma|soğuma)/)))
    return { t:"ok", name:m[2][0].toLocaleUpperCase("tr")+m[2].slice(1), sub:m[1]+" m" };
  if ((m = l.match(/^(\d+) m\s*(.*)$/)))
    return { t:"sd", d:+m[1], name:(m[2]||"yüzme").replace(/^./,c=>c.toLocaleUpperCase("tr")), sub:m[1]+" m" };
  if (/(\d+)×(\d+) sn/.test(l) && /sprint/.test(l)){
    m = l.match(/(\d+)×(\d+) sn/);
    return { t:"n", n:+m[1], name:base, sub:`${m[1]} × ${m[2]} sn`, unit:"tekrar" };
  }
  if ((m = l.match(/(\d+)×(\d+) sn/)))
    return { t:"t", n:+m[1], tg:m[2], name:base, sub:`${m[1]} set × ${m[2]} sn` };
  if (/koşu|yürüyüş|bisiklet|ip atlama/.test(l)){
    m = l.match(/(\d+(?:-\d+)?) dk/);
    return { t:"c", tg:m ? m[1] : "", km:/koşu|yürüyüş|bisiklet/.test(l),
             name:s.replace(/^\d+(-\d+)? dk\s*/,"").replace(/^./,c=>c.toLocaleUpperCase("tr")), sub:m ? m[1]+" dk" : "" };
  }
  if ((m = l.match(/(\d+)(?:-\d+)? dk/)) || !/\d/.test(l) || /\(\d+ dk\)|her poz/.test(l))
    return { t:"ok", name:s.replace(/\s*\(.*\)$/,""), sub:(s.match(/\(([^)]*)\)$/)||[])[1] || "" };
  const heavy = /çantalı/.test(l) || ((venue === "gym" || venue === "kettlebell") && !BW_RX.test(l));
  if ((m = l.match(/(\d+)×(max|\d+(?:-\d+)?)( adım)?/))){
    const n = +m[1], tg = m[2];
    const sub = `${n} set × ${tg === "max" ? "max" : tg}${m[3] ? " adım" : ""}`;
    if (heavy && (n > 6 || tg === "1")) return { t:"wc", n, name:base, sub:sub + (/her taraf/.test(l) ? " (her taraf)" : ""), unit:"set" };
    if (heavy) return { t:"w", n, tg, name:base, sub };
    return { t:"r", n, tg, name:base, sub, xkg:XKG_RX.test(l) };
  }
  if ((m = l.match(/(\d+) set(?: \(%([\d-]+)\))?/))){
    const pc = m[2] ? m[2].split("-").map(x => "%"+x) : [];
    return { t:"w", n:+m[1], tg:"", pc, name:base, sub:`${m[1]} set${pc.length?" · "+pc.join(" / ")+" 1TM":""}` };
  }
  return { t:"ok", name:s, sub:"" };
}

const numsOf = a => (a || []).filter(v => typeof v === "number");
function liftHas(l){
  if (!l) return false;
  if (l.kg || l.reps || l.n || l.ok || l.min || l.km || l.m) return true;
  return (l.sets || []).some(x => x && (typeof x === "number" ? x : (x.kg || x.r)));
}

/* Aynı hareketin son kaydı */
function lastLift(name, before){
  const t = before || today();
  for (const k of Object.keys(state.days).sort().reverse()){
    if (k >= t) continue;
    const l = state.days[k].lifts && state.days[k].lifts[name];
    if (liftHas(l)) return { ...l, k };
  }
  return null;
}

const fmtN = v => String(v).replace(".", ",");
function pace(min, km){
  if (!min || !km) return "";
  const p = min / km, mm = Math.floor(p), ss = Math.round((p - mm) * 60);
  return `${mm}:${String(ss === 60 ? 0 : ss).padStart(2,"0")} /km`;
}

function liftSummary(l, ex){
  if (!l.t)          // eski kayıt biçimi
    return `${l.kg ? fmtN(l.kg) + " kg" : ""}${l.kg && l.reps ? " × " : ""}${l.reps ? l.reps + " tekrar" : ""}`;
  const sets = l.sets || [];
  switch (ex.t){
    case "w": {
      const done = sets.filter(x => x && x.r);
      if (!done.length) return "";
      const kgs = [...new Set(done.map(x => x.kg || 0))];
      return kgs.length === 1
        ? `${kgs[0] ? fmtN(kgs[0]) + " kg · " : ""}${done.map(x => x.r).join("-")} tekrar`
        : done.map(x => `${fmtN(x.kg || 0)}×${x.r}`).join(", ");
    }
    case "r": { const r = numsOf(sets); return r.length ? `${r.join("-")} tekrar${l.kg2 ? ` · +${fmtN(l.kg2)} kg` : ""}` : ""; }
    case "t": { const r = numsOf(sets); return r.length ? `${r.join("-")} sn` : ""; }
    case "wc": return `${l.kg ? fmtN(l.kg) + " kg · " : ""}${l.n || 0}/${ex.n} ${ex.unit}`;
    case "n":  return `${l.n || 0}/${ex.n} ${ex.unit}`;
    case "sw": return `${l.n || 0}/${ex.n} × ${ex.d} m${l.min ? ` · ${fmtN(l.min)} dk` : ""}`;
    case "sd": return `${l.m || ex.d} m${l.min ? ` · ${fmtN(l.min)} dk` : ""}`;
    case "c":  return [l.min ? fmtN(l.min) + " dk" : "", l.km ? fmtN(l.km) + " km" : "", pace(l.min, l.km)].filter(Boolean).join(" · ");
    default:   return l.ok ? "yapıldı" : "";
  }
}

const LIFT_KIND = { w:"Ağırlık × tekrar", r:"Tekrar", t:"Süre", wc:"Ağırlık + set", n:"Tur", sw:"Tekrar + süre", sd:"Mesafe + süre", c:"Süre + mesafe", ok:"" };

function liftInput(i, f, k, val, ph, dec, label){
  return `<label class="lf-cell">${label ? `<span>${label}</span>` : ""}<input type="number" inputmode="${dec?"decimal":"numeric"}"
    data-lx="${i}" data-f="${f}"${k !== undefined ? ` data-k="${k}"` : ""} value="${val ?? ""}" placeholder="${ph ?? ""}"></label>`;
}

function stepper(i, cur, max, unit){
  return `<div class="lf-step">
    <button class="lf-sb" data-lstep="${i}" data-d="-1" aria-label="Azalt"${cur <= 0 ? " disabled" : ""}>−</button>
    <div class="lf-sv num"><b>${cur}</b> / ${max} <span>${unit}</span></div>
    <button class="lf-sb" data-lstep="${i}" data-d="1" aria-label="Artır"${cur >= max ? " disabled" : ""}>+</button>
  </div>`;
}

function liftBody(i, ex, cur, prev){
  const sets = cur.sets || [];
  const pSets = prev && prev.sets || [];
  const idx = Array.from({ length: ex.n || 0 }, (_, k) => k);
  switch (ex.t){
    case "w": return `<div class="lf-sets">${idx.map(k => {
        const s = sets[k] || {}, p = pSets[k] || {};
        const prevKg = (k > 0 && sets[k-1] && sets[k-1].kg) || undefined;
        const kgPh = ex.pc && ex.pc[k] ? ex.pc[k] : (p.kg ?? prevKg ?? (prev && prev.kg) ?? "kg");
        return `<div class="lf-set"><span class="lf-no">${k+1}</span>
          ${liftInput(i,"kg",k,s.kg,kgPh === "kg" ? "kg" : kgPh,true,"kg")}
          ${liftInput(i,"r",k,s.r,p.r ?? ex.tg ?? "",false,"tekrar")}</div>`;
      }).join("")}</div>`;
    case "r": case "t": return `<div class="lf-grid">${idx.map(k =>
        liftInput(i,"s",k,sets[k],(typeof pSets[k] === "number" ? pSets[k] : ex.tg),false,`${k+1}. set${ex.t==="t"?" · sn":""}`)).join("")}
        ${ex.xkg ? liftInput(i,"kg2",undefined,cur.kg2,prev && prev.kg2 || "",true,"Ek kg") : ""}</div>`;
    case "wc": return `<div class="lf-row">${liftInput(i,"kg",undefined,cur.kg,prev && prev.kg || "",true,"Ağırlık (kg)")}</div>${stepper(i, cur.n || 0, ex.n, ex.unit)}`;
    case "n":  return stepper(i, cur.n || 0, ex.n, ex.unit);
    case "sw": return `${stepper(i, cur.n || 0, ex.n, "× " + ex.d + " m")}<div class="lf-row">${liftInput(i,"min",undefined,cur.min,prev && prev.min || "",true,"Süre (dk)")}</div>`;
    case "sd": return `<div class="lf-row">${liftInput(i,"m",undefined,cur.m,ex.d,false,"Mesafe (m)")}${liftInput(i,"min",undefined,cur.min,prev && prev.min || "",true,"Süre (dk)")}</div>`;
    case "c":  return `<div class="lf-row">${liftInput(i,"min",undefined,cur.min,ex.tg || "",true,"Süre (dk)")}${ex.km ? liftInput(i,"km",undefined,cur.km,prev && prev.km || "",true,"Mesafe (km)") : ""}</div>
                 ${cur.min && cur.km ? `<div class="metric-note">Tempo: <b>${pace(cur.min, cur.km)}</b></div>` : ""}`;
    default:   return "";
  }
}

function howLink(name){
  const ids = guidesFor(name);
  return ids.length ? `<button class="how-link" data-howgo="${ids[0]}">Nasıl yapılır</button>` : "";
}

/* ---- antrenman kaydı ----
   Beslenmedeki günlükle aynı mantık: kayıt kendi sekmesinde durur,
   Bugün sayfası yalnızca "bugün ne var" der ve buraya gönderir. */
function trainLogView(entry, program, key){
  key = key || today();
  const none = program.training.none;
  const session = none ? null : program.training.days.find(d => d.wd === isoWeekday(key));
  const now = key === today();

  if (none) return `
    ${freeCard(entry, key)}
    <section>
      <h2>Spor programın kapalı</h2>
      <div class="metric-note">Aktivite seviyeni "Hareketsiz" seçtiğin için program kurulmadı ve görevlerinde antrenman çıkmıyor. Düzenli spora başlarsan Ayarlar'dan açabilirsin.</div>
      <button class="ghost" id="plan-on" style="margin-top:12px">Spor programı kur</button>
    </section>
    ${prBoard()}`;

  if (!session || !session.b) return `
    <section>
      <h2>${now ? "Bugün dinlenme" : "O gün dinlenme günüydü"}</h2>
      <div class="metric-note">${session && session.t ? esc(session.t) + ". " : ""}Programında bu güne antrenman düşmüyor.</div>
    </section>
    ${freeCard(entry, key)}
    ${nextSessionCard(program, key)}
    ${prBoard()}`;

  const list = exercisesOf(session);
  const lifts = entry.lifts || {};
  const doneN = list.filter(n => liftHas(lifts[n])).length;

  return `
  <section>
    <h2>${esc(session.t)} <span class="count">${doneN}/${list.length} hareket</span></h2>
    <div class="metric-note" style="margin-bottom:13px">${esc(session.b)}</div>
    <button id="wo-start">${doneN ? "Antrenman moduna dön" : "Antrenman modunu başlat"}</button>
    <div class="metric-note" style="margin-top:10px">Hareketler tek tek tam ekranda gelir; her set geçen antrenmandaki değerle hazır gelir, ✓ ile onaylarsın. Tek bir hareketi sonradan düzeltmek istersen aşağıdaki listeyi aç.</div>
  </section>
  ${liftsSection(entry, session, key)}
  ${freeCard(entry, key)}
  ${prBoard()}`;
}

/* Bugün antrenman yoksa sıradaki günü söyler. */
function nextSessionCard(program, key){
  const days = program.training.days.filter(d => d.b);
  if (!days.length) return "";
  const wd = isoWeekday(key);
  let best = null, bestGap = 99;
  for (const d of days){
    const gap = ((d.wd - wd) % 7 + 7) % 7 || 7;
    if (gap < bestGap){ bestGap = gap; best = d; }
  }
  if (!best) return "";
  return `<section>
    <h2>Sıradaki antrenman</h2>
    <div class="item">${iconBox(best.icon)}
      <div class="item-main"><h3>${esc(best.t)}</h3>
        <p>${WD_NAMES[best.wd]}${bestGap === 1 ? " · yarın" : ` · ${bestGap} gün sonra`}</p></div></div>
  </section>`;
}

function liftsSection(entry, session, key){
  key = key || today();
  const list = exercisesOf(session);
  if (!list.length) return "";
  const venue = venueOf(currentProgram());
  const lifts = entry.lifts || {};
  const doneN = list.filter(n => liftHas(lifts[n])).length;
  return fold("lifts", "Hareketleri tek tek gir", `${doneN}/${list.length}`, `
    ${list.map((name, i) => {
      const ex = parseEx(name, venue);
      const cur = lifts[name] || {};
      const prev = lastLift(name, key);
      const has = liftHas(cur);
      const ps = prev ? liftSummary(prev, ex) : "";
      if (ex.t === "ok") return `<div class="lift lift-ok">
        <button class="check" data-done="${cur.ok?1:0}" data-ltog="${i}" aria-label="${esc(ex.name)} tamamlandı"></button>
        <div class="lift-main"><div class="lift-name">${esc(ex.name)}</div>${ex.sub?`<div class="lift-sub">${esc(ex.sub)}</div>`:""}${howLink(name)}</div>
      </div>`;
      return `<div class="lift${has?" on":""}">
        <div class="lift-head">
          <div class="lift-main"><div class="lift-name">${esc(ex.name)}</div>
            <div class="lift-sub">${esc(ex.sub)}${LIFT_KIND[ex.t] ? ` · ${LIFT_KIND[ex.t]}` : ""}</div>${howLink(name)}</div>
          ${has ? `<svg class="ico lift-tick" aria-hidden="true"><use href="#i-check"/></svg>` : ""}
        </div>
        ${liftBody(i, ex, cur, prev)}
        <div class="metric-note">${ps ? `Son: ${esc(ps)} · ${prettyDate(prev.k)}` : "İlk kez kaydediyorsun."}</div>
      </div>`;
    }).join("")}`);
}

function wireLifts(entry, key){
  key = key || today();
  const session = currentProgram()
    ? currentProgram().training.days.find(d => d.wd === isoWeekday(key)) : null;
  const list = exercisesOf(session);
  const venue = venueOf(currentProgram());
  const recOf = i => {
    entry.lifts = entry.lifts || {};
    const name = list[i];
    let r = entry.lifts[name];
    if (!r || !r.t) r = entry.lifts[name] = {};
    r.t = parseEx(name, venue).t;
    return r;
  };
  const tidy = i => { const n = list[i]; if (entry.lifts && !liftHas(entry.lifts[n])) delete entry.lifts[n]; };

  app.querySelectorAll("[data-lx]").forEach(el => el.onchange = async () => {
    const i = +el.dataset.lx, f = el.dataset.f, k = el.dataset.k;
    const before = records().find(r => r.name === list[i]);
    const rec = recOf(i);
    let n = num(el.value);
    if (n !== null && n < 0) n = null;
    const intF = f === "r" || f === "s" || f === "m";
    if (n !== null && intF) n = Math.round(n);
    if (k === undefined){
      if (n === null) delete rec[f]; else rec[f] = n;
    } else {
      rec.sets = rec.sets || [];
      const kk = +k;
      if (f === "s") rec.sets[kk] = n;
      else {
        const s = rec.sets[kk] = rec.sets[kk] || {};
        if (n === null) delete s[f]; else s[f] = n;
        // tekrar girilip kg boşsa önceki setin kilosunu devral
        if (f === "r" && n !== null && s.kg === undefined && kk > 0 && rec.sets[kk-1] && rec.sets[kk-1].kg) s.kg = rec.sets[kk-1].kg;
      }
      for (let j = 0; j < rec.sets.length; j++) if (rec.sets[j] === undefined) rec.sets[j] = null;
    }
    tidy(i);
    await saveState(state); render();
    checkPR(list[i], before);
  });
  app.querySelectorAll("[data-lstep]").forEach(b => b.onclick = async () => {
    const i = +b.dataset.lstep, ex = parseEx(list[i], venue), rec = recOf(i);
    const before = records().find(r => r.name === list[i]);
    rec.n = Math.max(0, Math.min(ex.n, (rec.n || 0) + (+b.dataset.d)));
    if (!rec.n) delete rec.n;
    tidy(i);
    await saveState(state); render();
    checkPR(list[i], before);
  });
  const woBtn = document.getElementById("wo-start");
  if (woBtn) woBtn.onclick = openWorkout;
  app.querySelectorAll("[data-howgo]").forEach(b => b.onclick = () => {
    tab = "plan"; planTab = "howto"; howQuery = ""; howOpen = b.dataset.howgo;
    render();
    const el = app.querySelector(`[data-how="${howOpen}"]`);
    if (el) el.scrollIntoView({ block:"center" }); else window.scrollTo(0,0);
  });
  app.querySelectorAll("[data-ltog]").forEach(b => b.onclick = async () => {
    const i = +b.dataset.ltog, rec = recOf(i);
    if (rec.ok) delete rec.ok; else rec.ok = 1;
    tidy(i);
    await saveState(state); render();
  });
}

/* ---- onay sayfası ----
   window.confirm yerine uygulamanın kendi sayfası: metin uzun olabilir ve
   iki seçenek de adıyla anılır. Söz veren bir Promise döndürür. */
function askSheet({ title, body, ok, cancel }){
  return new Promise(resolve => {
    const el = document.createElement("div");
    el.className = "sheet-bg";
    let done = false;
    const close = v => { if (done) return; done = true; sheetOut(el); resolve(v); };
    el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ask-t">
      <div class="sheet-h"><b id="ask-t">${title}</b>
        <button class="sheet-x" aria-label="Kapat">×</button></div>
      <div class="metric-note" style="margin:2px 0 4px">${body}</div>
      <div class="row" style="margin-top:16px">
        <button id="ask-ok">${ok}</button>
        <button class="ghost" id="ask-no" style="flex:0 0 110px">${cancel}</button>
      </div></div>`;
    document.body.appendChild(el);
    el.onclick = ev => { if (ev.target === el) close(false); };
    el.querySelector(".sheet-x").onclick = () => close(false);
    el.querySelector("#ask-no").onclick = () => close(false);
    el.querySelector("#ask-ok").onclick = () => close(true);
    el.querySelector("#ask-ok").focus();
  });
}

/* Elle girilmiş kalori, günlüğe ilk kalem eklenince sessizce silinmesin. */
async function guardKcal(entry){
  const manual = entry.kcalManual && typeof entry.kcal === "number" && entry.kcal > 0;
  if (!manual || (entry.log && entry.log.length)) return true;
  const yes = await askSheet({
    title: "Kalori nereden hesaplansın?",
    body: `Bu güne elle <b>${entry.kcal} kcal</b> girilmişti. Beslenme günlüğüne kalem eklersen kalori bundan sonra günlükten hesaplanır ve elle girdiğin değer kaybolur.`,
    ok: "Günlükten hesapla", cancel: "Vazgeç" });
  if (yes) delete entry.kcalManual;
  return yes;
}

/* ---- hızlı giriş ----
   Sabit + düğmesi: hangi sekmede olursan ol günün verisi tek yerden girilir.
   Yazılan gün her zaman görüntülenen gündür, geçmiş bir gün de olabilir. */

/* Bir önceki günün değeri; "dünün aynısı" düğmeleri bunu kullanır. */
function prevVal(k, field){
  const p = state.days[shiftDays(k, -1)];
  return p && typeof p[field] === "number" && p[field] > 0 ? p[field] : null;
}

          <input id="qs-w" type="text" inputmode="decimal" placeholder="${lw !== null ? kg1(lw) : "kg"}"

        </div>
      </div>

      ${stepGoal() ? `<div class="qs-row">
        <div class="qs-h">${iconBox("walk")}<div><b>Adım</b>
          <i>${e.steps || 0} / ${stepGoal()} adım</i></div></div>
        <div class="row">
          <input id="qs-st" type="text" inputmode="numeric" placeholder="adım sayısı"

          <button id="qs-st-ok" style="flex:0 0 92px">Kaydet</button>
