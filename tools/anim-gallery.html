<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starboard hareket animasyonları</title>
<link rel="stylesheet" href="../starboard-site/css/tokens.css">
<link rel="stylesheet" href="../starboard-site/css/components.css">
<style>
  body{padding:16px;max-width:none}
  h1{font-size:20px;margin:0 0 4px}
  p{margin:0 0 14px;color:var(--muted);font-size:13px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  figure{margin:0;background:var(--surface);border-radius:16px;padding:6px}
  figure .how-anim{margin:0;padding:2px 4px}
  figcaption{font-size:11.5px;font-weight:800;color:var(--muted);padding:4px 6px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<h1>Hareket animasyonları</h1>
<p>Geliştirme aracı: bütün animasyonları yan yana gösterir. Adrese <code>?v=0</code>, <code>?v=1</code> ya da <code>?v=0.5</code> eklenirse hepsi o karede durur.</p>
<div id="grid"></div>
<script>window.STARBOARD_LANG = "tr"; const reduceMotion = () => false;</script>
<script src="../starboard-site/js/vendor/motion.js"></script>
<script src="../starboard-site/js/exercise-anim.js"></script>
<script>
  const still = new URLSearchParams(location.search).get("v");
  const only = new URLSearchParams(location.search).get("k");
  const grid = document.getElementById("grid");
  let n = 0;
  for (const [key, a] of Object.entries(EX_ANIMS)){
    if (only && !only.split(",").includes(key)) continue;
    const fig = document.createElement("figure");
    fig.innerHTML = `<div class="how-anim"></div><figcaption>${key}</figcaption>`;
    grid.appendChild(fig);
    const box = fig.firstElementChild, frames = a.f.map(exPose);
    box.innerHTML = exAnimSvg("g" + (++n), a);
    const svg = box.firstElementChild;
    if (still === "both"){
      /* İlk ve son poz üst üste: son poz soluk. Pozları gözle denetlemek için. */
      exAnimDraw(svg, a, frames, 0);
      box.style.position = "relative";
      box.insertAdjacentHTML("beforeend", exAnimSvg("h" + n, a));
      const ghost = box.lastElementChild;
      ghost.style.cssText = "position:absolute;inset:2px 4px;opacity:.4";
      exAnimDraw(ghost, a, frames, 1);
    }
    else if (still !== null) exAnimDraw(svg, a, frames, +still);
    else Motion.animate(0, 1, { duration: a.d * (frames.length - 1), ease: "linear", repeat: Infinity, repeatType: "reverse",
      onUpdate: v => exAnimDraw(svg, a, frames, v) });
  }
</script>
</body>
</html>
